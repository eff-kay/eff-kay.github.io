oke-width=\"2\"/><text x=\"95\" y=\"75\" font-size=\"18\" fill=\"#b9d0f2\" text-anchor=\"start\" font-weight=\"450\">MAYA ASKS<\/text><text x=\"95\" y=\"132\" font-size=\"34\" fill=\"#faf9f5\" text-anchor=\"start\" font-weight=\"600\">Find me a blue carry-on backpack under $100<\/text><text x=\"95\" y=\"178\" font-size=\"34\" fill=\"#faf9f5\" text-anchor=\"start\" font-weight=\"600\">that arrives by Friday.<\/text><rect x=\"95\" y=\"260\" width=\"315\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"252.5\" y=\"308.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Blue + carry-on<\/text><rect x=\"485\" y=\"260\" width=\"315\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"642.5\" y=\"308.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Under $100 total<\/text><rect x=\"875\" y=\"260\" width=\"315\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1032.5\" y=\"308.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Arrives by Friday<\/text><\/svg>", "notes": "I want to start with a question someone might actually ask: find me a blue carry-on backpack under a hundred dollars that arrives by Friday. A model can understand that sentence. But understanding it doesn’t tell us which shops have stock, what delivery costs, or when a parcel is expected to arrive. Those facts live outside the model. So before I think about a protocol, I need a way to reach the systems that know the answer. I’m going to use fictional shops and sample prices, so we can follow the whole journey without getting distracted by a particular retailer. Keep those three constraints in mind: the product, the total budget, and the deadline.", "group": 0, "point": null, "timed": true, "number": 2, "minute": 1}, {"title": "One answer depends on<br>three different providers.", "sub": "Two shops know the products. A delivery service knows the journey.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"One buyer assistant connects to two independent shops and a delivery provider\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"35\" y=\"130\" width=\"260\" height=\"120\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"165.0\" y=\"190.0\" font-size=\"27.38095238095238\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Buyer assistant<\/text><text x=\"165.0\" y=\"220.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">Maya’s question<\/text><path d=\"M310 190H520V60H900\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><path d=\"M310 190H520V190H900\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><path d=\"M310 190H520V320H900\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"920\" y=\"10\" width=\"320\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080.0\" y=\"60.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">TrailShop<\/text><text x=\"1080.0\" y=\"90.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">catalog + prices<\/text><rect x=\"920\" y=\"140\" width=\"320\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080.0\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">CityBags<\/text><text x=\"1080.0\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">catalog + prices<\/text><rect x=\"920\" y=\"270\" width=\"320\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080.0\" y=\"320.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ParcelQuote<\/text><text x=\"1080.0\" y=\"350.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">delivery estimates<\/text><text x=\"550\" y=\"365\" font-size=\"21\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">Each provider owns a different part of the answer.<\/text><\/svg>", "notes": "Let’s say TrailShop and CityBags both sell suitable backpacks. They are separate businesses, with separate catalogs and APIs. ParcelQuote is a third provider that gives us delivery estimates. Neither shop’s product list, on its own, answers Maya’s full question. I need to search both catalogs, carry the product and shipping details into the delivery lookup, and combine the results. If a provider doesn’t return enough information, I need to say what’s missing. The important point is that the user asked one question, but the application needs several capabilities from several providers. That’s why I want to explain MCP through a buyer assistant rather than through one isolated function.", "group": 0, "point": null, "timed": true, "number": 3, "minute": 2}, {"title": "Now connect every app<br>to every provider.", "sub": "Wouldn’t it help to agree on one capability interface?", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Many applications connect separately to three provider APIs\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"20\" y=\"32\" width=\"260\" height=\"76\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"150.0\" y=\"78.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Buyer chat<\/text><path d=\"M295 70L980 70\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M295 70L980 190\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M295 70L980 310\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><rect x=\"20\" y=\"152\" width=\"260\" height=\"76\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"150.0\" y=\"198.0\" font-size=\"25.669642857142854\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Mobile assistant<\/text><path d=\"M295 190L980 70\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M295 190L980 190\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M295 190L980 310\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><rect x=\"20\" y=\"272\" width=\"260\" height=\"76\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"150.0\" y=\"318.0\" font-size=\"24.159663865546214\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Support assistant<\/text><path d=\"M295 310L980 70\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M295 310L980 190\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M295 310L980 310\" fill=\"none\" stroke=\"#a8b8ca\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><rect x=\"995\" y=\"32\" width=\"265\" height=\"76\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1127.5\" y=\"78.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">TrailShop API<\/text><rect x=\"995\" y=\"152\" width=\"265\" height=\"76\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1127.5\" y=\"198.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">CityBags API<\/text><rect x=\"995\" y=\"272\" width=\"265\" height=\"76\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1127.5\" y=\"318.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Delivery API<\/text><rect x=\"405\" y=\"135\" width=\"440\" height=\"110\" rx=\"4\" fill=\"#faf9f5\" stroke=\"#c0ccda\" stroke-width=\"2\"/><text x=\"625\" y=\"180\" font-size=\"24\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"600\">Different inputs. Different results.<\/text><text x=\"625\" y=\"218\" font-size=\"24\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"450\">Repeated integration work.<\/text><\/svg>", "notes": "I can absolutely build this with the providers’ APIs. The mess starts when I repeat the descriptions, input handling, authentication and response handling inside several applications. Shared libraries already help, so I’m not claiming every model change forces a full rewrite. But I’d still like a common way for an AI application to ask what capabilities exist and request them. Imagine adding another assistant, or another shopping provider. I want to reuse the interface instead of rebuilding that part each time. That’s the question that leads us to MCP: wouldn’t it be useful if supporting applications and servers agreed on how to describe and use capabilities?", "group": 0, "point": null, "timed": true, "number": 4, "minute": 3}, {"title": "MCP is a common language.<br>Your APIs stay.", "sub": "“MCP is not a replacement for APIs.”", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"API operations and MCP capability interface compared\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"35\" y=\"25\" width=\"565\" height=\"310\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"680\" y=\"25\" width=\"565\" height=\"310\" rx=\"4\" fill=\"#edf0e8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"75\" y=\"85\" font-size=\"22\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"700\">API<\/text><text x=\"75\" y=\"145\" font-size=\"31\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"600\">The service’s capabilities.<\/text><text x=\"75\" y=\"215\" font-size=\"27\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Search a catalog<\/text><text x=\"75\" y=\"265\" font-size=\"27\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Estimate a delivery<\/text><text x=\"720\" y=\"85\" font-size=\"22\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"700\">MCP<\/text><text x=\"720\" y=\"145\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"600\">A shared interface for AI apps.<\/text><text x=\"720\" y=\"215\" font-size=\"27\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Discover available tools<\/text><text x=\"720\" y=\"265\" font-size=\"27\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Request them consistently<\/text><\/svg>", "notes": "MCP stands for Model Context Protocol. I think of it as a common language between an AI application and a server exposing useful capabilities. The short version is: MCP is not a replacement for APIs. The shops still have their own APIs. Somebody still implements the adapters that call them. What changes is the interface I offer to supporting AI applications: they can discover the tools and request them through the same protocol. MCP doesn’t create stock, unlock permissions, or make a delivery estimate more certain. It standardizes the capability exchange. In our example, I’m choosing to put the three provider adapters behind one buyer server. That’s our design, not a requirement that every MCP system has one central gateway.", "group": 1, "point": 1, "timed": true, "number": 5, "minute": 4}, {"title": "First discover the tools.<br>Then make a specific request.", "sub": "A name, a purpose, and the inputs each operation needs.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"One application discovers a server menu with product search and delivery quote tools\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"35\" y=\"125\" width=\"300\" height=\"130\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"185.0\" y=\"190.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">AI application<\/text><text x=\"185.0\" y=\"220.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">What can you do?<\/text><path d=\"M350 190L540 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"560\" y=\"15\" width=\"680\" height=\"350\" rx=\"4\" fill=\"#faf9f5\" stroke=\"#bac9da\" stroke-width=\"2\"/><text x=\"600\" y=\"65\" font-size=\"20\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">BUYER SERVER · TOOL MENU<\/text><rect x=\"605\" y=\"95\" width=\"590\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"900.0\" y=\"145.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Search products<\/text><text x=\"900.0\" y=\"175.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">shop · product · color<\/text><rect x=\"605\" y=\"220\" width=\"590\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"900.0\" y=\"270.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Quote delivery<\/text><text x=\"900.0\" y=\"300.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">item · destination · deadline<\/text><\/svg>", "notes": "Before I ask the buyer server to do anything, my application can ask which tools it offers. Here it learns about product search and delivery quotes, along with the inputs those tools need. That’s discovery. I don’t have to invent a tool definition inside each application. I still decide which tools the host makes available, and the server still validates every request. Discovering a tool is not permission to use it. I also want a focused menu: search products and quote delivery are easier to understand than a universal tool that accepts any arbitrary API request. The protocol gives us the mechanism; clear tool design makes that mechanism useful.", "group": 1, "point": 2, "timed": true, "number": 6, "minute": 5}, {"title": "The host coordinates.<br>The server connects to providers.", "sub": "Model → client → server → existing systems", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Host contains model and client; server fans out to three providers\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"15\" y=\"55\" width=\"465\" height=\"275\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"50\" y=\"105\" font-size=\"24\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"650\">HOST · the buyer application<\/text><rect x=\"50\" y=\"145\" width=\"175\" height=\"130\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"137.5\" y=\"210.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Model<\/text><text x=\"137.5\" y=\"240.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">proposes<\/text><rect x=\"255\" y=\"145\" width=\"190\" height=\"130\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"350.0\" y=\"210.0\" font-size=\"28.57142857142857\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">MCP client<\/text><text x=\"350.0\" y=\"240.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">connects<\/text><path d=\"M235 210L245 210\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><path d=\"M495 190L640 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"655\" y=\"120\" width=\"260\" height=\"145\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"785.0\" y=\"192.5\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Buyer server<\/text><text x=\"785.0\" y=\"222.5\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">checks + adapts<\/text><path d=\"M930 190H965V60H1000\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"1015\" y=\"15\" width=\"245\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1137.5\" y=\"60.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">TrailShop<\/text><text x=\"1137.5\" y=\"90.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">catalog<\/text><path d=\"M930 190H965V190H1000\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"1015\" y=\"145\" width=\"245\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1137.5\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">CityBags<\/text><text x=\"1137.5\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">catalog<\/text><path d=\"M930 190H965V320H1000\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"1015\" y=\"275\" width=\"245\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1137.5\" y=\"320.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ParcelQuote<\/text><text x=\"1137.5\" y=\"350.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">delivery<\/text><\/svg>", "notes": "Let me name the parts. The host is the buyer application. Inside it, an MCP client handles the connection to our server. The model can propose a tool call, but the host coordinates that call. The server validates it, applies its policies, and talks to the providers. On the right, we still have three independent systems. The model isn’t opening its own connection to every shop. And the server isn’t the model. This is one possible aggregation design; I could also use separate MCP servers and clients for separate providers. What stays common is the protocol between the application and each server. That’s the first major point: a reusable interface with clear responsibilities.", "group": 1, "point": 3, "timed": true, "number": 7, "minute": 6}, {"title": "Search both shops.<br>Keep the user’s constraints.", "sub": "One question fans out into two catalog lookups.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Product search fans out to two shops and yields three candidate offers\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"20\" y=\"135\" width=\"255\" height=\"110\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"147.5\" y=\"190.0\" font-size=\"28.698979591836732\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Maya’s request<\/text><text x=\"147.5\" y=\"220.0\" font-size=\"16.31054131054131\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">blue · under $100 · Friday<\/text><path d=\"M290 190L440 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"455\" y=\"135\" width=\"260\" height=\"110\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"585.0\" y=\"190.0\" font-size=\"27.38095238095238\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Search products<\/text><text x=\"585.0\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">same constraints<\/text><path d=\"M730 190H780V65H865\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"880\" y=\"20\" width=\"340\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1050.0\" y=\"65.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">TrailShop<\/text><text x=\"1050.0\" y=\"95.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">one blue carry-on<\/text><path d=\"M730 190H780V200H865\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"880\" y=\"155\" width=\"340\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1050.0\" y=\"200.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">CityBags<\/text><text x=\"1050.0\" y=\"230.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">two blue carry-ons<\/text><text x=\"1020\" y=\"350\" font-size=\"27\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">3 candidate offers<\/text><\/svg>", "notes": "Now let’s run Maya’s question through that design. The host can propose searches of TrailShop and CityBags for blue carry-on backpacks. In a real product, I’d also need a clear interpretation of carry-on size and the relevant destination. I shouldn’t silently guess missing requirements. For this example, assume we already have those details. Both searches can be independent, so our application can run them together if its implementation supports that. TrailShop returns one candidate and CityBags returns two. We keep the shop, item identifier, price and stock information attached to each result. MCP carries the calls, but our application still owns planning the workflow and deciding what to do with the results.", "group": 2, "point": 1, "timed": true, "number": 8, "minute": 7}, {"title": "A cheap product can still<br>be the wrong answer.", "sub": "Compare the total and the arrival estimate—not just the item price.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Delivery estimates fan out per offer; one offer meets budget and deadline\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"25\" y=\"135\" width=\"245\" height=\"110\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"147.5\" y=\"190.0\" font-size=\"21.329365079365076\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">3 candidate offers<\/text><text x=\"147.5\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">prices + origin<\/text><path d=\"M285 190L415 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"430\" y=\"135\" width=\"270\" height=\"110\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"565.0\" y=\"190.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">ParcelQuote<\/text><text x=\"565.0\" y=\"220.0\" font-size=\"20.538720538720536\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">estimate each delivery<\/text><path d=\"M715 190H765V55H850\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"865\" y=\"5\" width=\"375\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1052.5\" y=\"55.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">TrailShop · $91<\/text><text x=\"1052.5\" y=\"85.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">Friday · meets request<\/text><path d=\"M715 190H765V180H850\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"865\" y=\"130\" width=\"375\" height=\"100\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1052.5\" y=\"180.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">CityBags · $92<\/text><text x=\"1052.5\" y=\"210.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">Monday · too late<\/text><path d=\"M715 190H765V305H850\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"865\" y=\"255\" width=\"375\" height=\"100\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1052.5\" y=\"305.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">CityBags · $103<\/text><text x=\"1052.5\" y=\"335.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">Thursday · over budget<\/text><\/svg>", "notes": "Next I ask the independent delivery provider for estimates for the three candidate offers. This is where the earlier results become inputs to another tool. The sample totals include delivery and taxes. TrailShop comes to 91 dollars with a Friday estimate. One CityBags option is 92 dollars but arrives Monday; another is 103 dollars and arrives Thursday. So only the first meets both constraints in our fixture. I want the final answer to explain that comparison and identify the shops behind it. Friday is still an estimate, not a guarantee. If a quote is unavailable or stale, I should say so rather than pretend I found a complete answer.", "group": 2, "point": 2, "timed": true, "number": 9, "minute": 8}, {"title": "Recommend with evidence.<br>Don’t quietly turn it into a purchase.", "sub": "Read access is enough for this first useful version.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Buyer recommendation includes total, estimated arrival and no purchase action\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><g transform=\"translate(65 70) scale(1.1)\"><path d=\"M20 55Q20 30 45 30H135Q160 30 160 55V200Q160 220 140 220H40Q20 220 20 200Z\" fill=\"#195bca\"/><path d=\"M60 32V14Q60 0 90 0Q120 0 120 14V32\" fill=\"none\" stroke=\"#102d4b\" stroke-width=\"9\"/><rect x=\"38\" y=\"125\" width=\"104\" height=\"65\" rx=\"4\" fill=\"#ffffff35\"/><path d=\"M50 60V100H130V60\" fill=\"none\" stroke=\"#ffffff70\" stroke-width=\"6\"/><\/g><rect x=\"350\" y=\"35\" width=\"880\" height=\"285\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"395\" y=\"100\" font-size=\"21\" fill=\"#b9d0f2\" text-anchor=\"start\" font-weight=\"450\">TRAILSHOP · BLUE CARRY-ON<\/text><text x=\"395\" y=\"175\" font-size=\"36\" fill=\"#faf9f5\" text-anchor=\"start\" font-weight=\"650\">$91 total · expected Friday<\/text><text x=\"395\" y=\"235\" font-size=\"27\" fill=\"#faf9f5\" text-anchor=\"start\" font-weight=\"450\">Meets the request. Show the offer.<\/text><text x=\"395\" y=\"285\" font-size=\"23\" fill=\"#b9d0f2\" text-anchor=\"start\" font-weight=\"450\">No order placed.<\/text><\/svg>", "notes": "My answer to Maya can now be concrete: this blue carry-on from TrailShop is 91 dollars in total and is expected Friday. I can explain why the other options didn’t qualify and show the source offer. But I haven’t bought anything. That’s a deliberate boundary for this first version. Finding and comparing products doesn’t authorize a purchase or expose private customer records. If I later add checkout, it needs separate permissions, clear confirmation and reliable handling of the payment outcome. I also keep provider credentials out of model-visible content and validate results on the server. MCP connects the capabilities; my product still owns those controls and the accuracy of the final experience.", "group": 2, "point": 3, "timed": true, "number": 10, "minute": 9}, {"title": "Make the experience<br>reviewable before submitting.", "sub": "Host it. Test it in the target app. Give reviewers a working path.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Service, product and evidence are required before platform submission\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"60\" y=\"90\" width=\"320\" height=\"200\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"220.0\" y=\"190.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">SERVICE<\/text><text x=\"220.0\" y=\"220.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">HTTPS + working access<\/text><rect x=\"480\" y=\"90\" width=\"320\" height=\"200\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"640.0\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">PRODUCT<\/text><text x=\"640.0\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">clear tools + limits<\/text><rect x=\"900\" y=\"90\" width=\"320\" height=\"200\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1060.0\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">EVIDENCE<\/text><text x=\"1060.0\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">realistic review cases<\/text><text x=\"640\" y=\"355\" font-size=\"24\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"450\">A directory listing does not host your backend.<\/text><\/svg>", "notes": "Before I open a submission portal, I want this experience to work for somebody who isn’t me. I need a stable HTTPS service, correct authentication where needed, clear tool descriptions, and privacy and support information. I test in the target application, not only in my own client. For this buyer assistant I’d test a useful match, no matching offers, a missing delivery quote and a request outside our permissions. I prepare realistic sample data and reviewer access when sign-in is required. A listing is distribution, not hosting, and a private connection isn’t the same as public approval. That’s the foundation for publishing the same underlying service in two different ecosystems.", "group": 3, "point": 1, "timed": true, "number": 11, "minute": 10}, {"title": "ChatGPT: submit the package.<br>Prove the connected experience.", "sub": "ZIP + remote MCP setup + review evidence", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Package → Connect → Review → Publish\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"60.0\" y=\"100\" width=\"263.75\" height=\"180\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"191.875\" y=\"190.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Package<\/text><text x=\"191.875\" y=\"220.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">plugin ZIP<\/text><path d=\"M332.75 190L351.75 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"358.75\" y=\"100\" width=\"263.75\" height=\"180\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"490.625\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Connect<\/text><text x=\"490.625\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">domain + auth + scan<\/text><path d=\"M631.5 190L650.5 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"657.5\" y=\"100\" width=\"263.75\" height=\"180\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"789.375\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Review<\/text><text x=\"789.375\" y=\"220.0\" font-size=\"19.142512077294683\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">5 positive · 3 negative<\/text><path d=\"M930.25 190L949.25 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"956.25\" y=\"100\" width=\"263.75\" height=\"180\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1088.125\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Publish<\/text><text x=\"1088.125\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">after approval<\/text><text x=\"640\" y=\"345\" font-size=\"23\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"450\">platform.openai.com/plugins<\/text><\/svg>", "notes": "For ChatGPT, I use the Plugins portal with the right organization permissions and verified publisher identity. I upload the package with its remote MCP configuration, connect the endpoint, verify the domain and complete authentication and scans. I include five positive cases, three negative cases and an accessible walkthrough, with reviewer access when required. For our buyer tool, I show both a useful comparison and honest failure behavior. I resolve the findings, submit for review and publish after approval. Uploading successfully is not approval. I also keep private credentials out of the public package. The listing helps people discover the integration; I continue operating the buyer service behind it.", "group": 3, "point": 2, "timed": true, "number": 12, "minute": 11}, {"title": "Claude: choose connector<br>or plugin bundle.", "sub": "A remote server can be listed directly; workflows can be bundled.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Claude remote connector and optional GitHub plugin bundle submission paths\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"30\" y=\"30\" width=\"600\" height=\"285\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"70\" y=\"85\" font-size=\"20\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">REMOTE MCP CONNECTOR<\/text><text x=\"70\" y=\"150\" font-size=\"28\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"600\">HTTPS server → validate → review<\/text><text x=\"70\" y=\"215\" font-size=\"22\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Test in Claude. Add listing + reviewer access.<\/text><rect x=\"680\" y=\"30\" width=\"570\" height=\"285\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"85\" font-size=\"20\" fill=\"#a76524\" text-anchor=\"start\" font-weight=\"650\">OPTIONAL PLUGIN BUNDLE<\/text><text x=\"720\" y=\"150\" font-size=\"27\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"600\">GitHub source → validate → review<\/text><text x=\"720\" y=\"215\" font-size=\"23\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Package skills and MCP connections.<\/text><text x=\"640\" y=\"365\" font-size=\"23\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"450\">claude.ai/directory/manage · publish after approval<\/text><\/svg>", "notes": "For Claude, I can submit this remote server as an MCP connector through the directory portal. I test it in Claude, provide the HTTPS endpoint, authentication, listing information and reviewer access, and make sure the tools have titles and the appropriate hints. The current portal supports paid plans with the relevant account permissions. If I also want to distribute reusable workflow instructions, I can submit a plugin bundle from GitHub; my own remote server still needs its connector submission. I address validation and review findings, then publish after approval. I don’t assume ChatGPT approval transfers here. In either portal, broken access or misleading tools make the experience difficult to review.", "group": 3, "point": 3, "timed": true, "number": 13, "minute": 12}, {"title": "One question.<br>Three lessons.", "sub": "Connect consistently. Answer responsibly. Publish deliberately.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"CONNECT → ANSWER → PUBLISH\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"60.0\" y=\"100\" width=\"363.3333333333333\" height=\"180\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"241.66666666666666\" y=\"190.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">CONNECT<\/text><text x=\"241.66666666666666\" y=\"220.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">one capability interface<\/text><path d=\"M432.3333333333333 190L451.3333333333333 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"458.3333333333333\" y=\"100\" width=\"363.3333333333333\" height=\"180\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"640.0\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ANSWER<\/text><text x=\"640.0\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">several provider results<\/text><path d=\"M830.6666666666666 190L849.6666666666666 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"856.6666666666666\" y=\"100\" width=\"363.3333333333333\" height=\"180\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1038.3333333333333\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">PUBLISH<\/text><text x=\"1038.3333333333333\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">two review processes<\/text><\/svg>", "notes": "Let me bring the three main points back to Maya’s question. First, we connected through a common capability interface instead of making every application learn a different tool protocol. Second, we used that interface to combine two shops and an independent delivery provider into a useful answer, while keeping the evidence and limits visible. Third, we prepared that experience for publication, with separate ChatGPT and Claude submissions. Those are related steps, but they solve different problems. MCP is the connection layer. The buyer assistant is the product. The platform directory is how people discover it. If you can distinguish those three, you can reason about most MCP projects without memorizing all the wire-level messages.", "group": 4, "point": null, "timed": true, "number": 14, "minute": 13}, {"title": "After publication,<br>you still own the service.", "sub": "Watch failures. Preserve compatibility. Help users recover.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"A live service requires health, compatibility and support after publication\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"30\" y=\"115\" width=\"300\" height=\"150\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"180.0\" y=\"190.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Your service<\/text><text x=\"180.0\" y=\"220.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">you keep it working<\/text><path d=\"M345 190H680V60H890\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"905\" y=\"15\" width=\"335\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1072.5\" y=\"60.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Health<\/text><text x=\"1072.5\" y=\"90.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">Can users connect?<\/text><path d=\"M345 190H680V190H890\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"905\" y=\"145\" width=\"335\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1072.5\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Compatibility<\/text><text x=\"1072.5\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">Do old requests still work?<\/text><path d=\"M345 190H680V320H890\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"905\" y=\"275\" width=\"335\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1072.5\" y=\"320.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Support<\/text><text x=\"1072.5\" y=\"350.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">Can users recover?<\/text><\/svg>", "notes": "There’s one final responsibility I don’t want publication to hide. I still operate the service. If a shop changes its API, a sign-in flow breaks, or a delivery provider stops responding, I need to know and handle it. I want enough observability to understand failed operations without collecting unnecessary customer data. I also want published tools to remain compatible while updates roll out. A successful search must not suddenly become a purchase because I changed what a tool means. The directories have their own checks for changes, but they don’t replace our monitoring and release discipline. My responsibility is the experience people get after they click Connect, not just the moment the listing goes live.", "group": 4, "point": null, "timed": true, "number": 15, "minute": 14}, {"title": "Start with one real question.<br>Ship one useful connection.", "sub": "Then expand only when the next user need is clear.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Return to the original buyer query and three practical next steps\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"70\" y=\"35\" width=\"1140\" height=\"175\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"115\" y=\"100\" font-size=\"36\" fill=\"#faf9f5\" text-anchor=\"start\" font-weight=\"600\">“Find me a blue carry-on under $100<\/text><text x=\"115\" y=\"155\" font-size=\"36\" fill=\"#faf9f5\" text-anchor=\"start\" font-weight=\"600\">that arrives by Friday.”<\/text><rect x=\"90\" y=\"270\" width=\"300\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"240.0\" y=\"318.0\" font-size=\"25.375939849624057\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">One useful workflow<\/text><rect x=\"500\" y=\"270\" width=\"300\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"650.0\" y=\"318.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Clear boundaries<\/text><rect x=\"910\" y=\"270\" width=\"300\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1060.0\" y=\"318.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">A tested release<\/text><\/svg>", "notes": "If I were starting tomorrow, I’d begin with the user’s question, not with a giant list of tools. What result would actually help them? Which providers know the facts? What’s the smallest set of capabilities I can expose to get there? For our buyer, searching two shops and checking delivery was already useful. We didn’t need to add checkout to prove the idea. I’d make that one workflow clear, bounded and testable, and then prepare it for the places our users already work. That’s the approach I wanted to share: understand the need, connect the capabilities, verify the experience, and publish it deliberately. From there, the next capability should follow a real user need.", "group": 4, "point": null, "timed": true, "number": 16, "minute": 15}, {"title": "What would your buyer<br>need to connect to?", "sub": "Questions · examples · your next MCP server", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"One buyer assistant connects to two independent shops and a delivery provider through a buyer MCP server\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"35\" y=\"130\" width=\"260\" height=\"120\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"165.0\" y=\"190.0\" font-size=\"27.38095238095238\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Buyer assistant<\/text><text x=\"165.0\" y=\"220.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">Maya’s question<\/text><path d=\"M310 190L455 190\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"470\" y=\"105\" width=\"290\" height=\"170\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"615.0\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Buyer MCP server<\/text><text x=\"615.0\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">selected capabilities<\/text><path d=\"M775 190H825V60H900\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><path d=\"M775 190H825V190H900\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><path d=\"M775 190H825V320H900\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"920\" y=\"10\" width=\"320\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080.0\" y=\"60.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">TrailShop<\/text><text x=\"1080.0\" y=\"90.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">catalog + prices<\/text><rect x=\"920\" y=\"140\" width=\"320\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080.0\" y=\"190.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">CityBags<\/text><text x=\"1080.0\" y=\"220.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">catalog + prices<\/text><rect x=\"920\" y=\"270\" width=\"320\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080.0\" y=\"320.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ParcelQuote<\/text><text x=\"1080.0\" y=\"350.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">delivery estimates<\/text><\/svg>", "notes": "I’m happy to take questions. If you have an example in mind, let’s start with the user’s request, the providers that know the answer, and what the assistant is allowed to do. We can trace it through the same picture: application, MCP server and underlying systems. We can also talk about hosting or the publication paths. This discussion is outside the fifteen-minute content plan.", "group": null, "point": null, "timed": false, "number": 17, "minute": null}],groups=['Motivate','Connect','Answer','Publish','Conclude'];let current=0;const $=s=>document.querySel
