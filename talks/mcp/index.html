    "body": "<svg class=\"diagram\" data-visual=\"story-cast\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Maya uses Atlas Docs to find an API integration guide.\"><defs><marker id=\"arrow-1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><circle cx=\"200\" cy=\"135\" r=\"60\" fill=\"#2469e5\"/><text x=\"200\" y=\"144\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">M</text><text x=\"200\" y=\"260\" font-size=\"35\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Maya</text><text x=\"200\" y=\"310\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Developer</text><path d=\"M285 165L560 165\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-1)\"/><rect x=\"570\" y=\"75\" width=\"420\" height=\"180\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"780\" y=\"159\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">ATLAS DOCS</text><text x=\"780\" y=\"195\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">hypothetical docs service</text><path d=\"M1000 165L1110 165\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-1)\"/><rect x=\"1120\" y=\"75\" width=\"260\" height=\"180\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1250\" y=\"159\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">API guides</text><text x=\"1250\" y=\"195\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">our data</text></svg>",
    "notes": "Establish the cast before teaching protocol details. Atlas Docs is a fictional service that owns its example documentation and APIs. Maya is a developer at a fictional customer workspace called North. A second workspace, Harbor, will matter later when we introduce private documentation and tenant isolation. For now there is one public guide and no authentication requirement. The task is not to rotate a real key through MCP: it is to find instructions about key rotation. That distinction keeps credentials and account mutations out of the initial tool surface. We will deliberately evolve the same product rather than switch examples for every concept.",

    "title": "Register. Handle. Serve.",
    "subtitle": "SDK v2 shape · full starter in the notes.",
    "body": "<svg class=\"diagram\" data-visual=\"code-change\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"INSIDE serveStdio(() =&gt; { … })\"><defs><marker id=\"arrow-4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"65\" y=\"30\" width=\"1310\" height=\"370\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"100\" y=\"78\" font-size=\"20\" fill=\"#aac8f1\" text-anchor=\"start\" font-weight=\"550\">INSIDE serveStdio(() =&gt; { … })</text><text x=\"110\" y=\"140\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"27\" fill=\"#edf4ff\">const server = new McpServer({ name: 'atlas-docs', version: '0.1.0' });</text><text x=\"110\" y=\"190\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"27\" fill=\"#edf4ff\">server.registerTool('get_guide', config, async () =&gt; guideResult);</text><text x=\"110\" y=\"240\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"27\" fill=\"#edf4ff\">return server;</text></svg>",
    "notes": "This is a shortened SDK v2 code view. The full example lives in examples/01-basic/server.ts. It imports McpServer from @modelcontextprotocol/server, serveStdio from @modelcontextprotocol/server/stdio, and z from zod/v4. serveStdio receives a factory, which registers a tool with an empty z.object input schema, a clear description and accurate read-only hints, then returns the server. The handler returns a content array with a text item. The SDK owns protocol framing and validates declared inputs; the application still owns semantic validation and authorization as the product grows. This starter is stdio-only and uses fixture text; it is not a remote or production-ready server. Protocol support must be verified against target hosts.\n\nComplete S0 starter (TypeScript SDK v2):\n/** Atlas Docs S0: one public fixture tool, stdio only. No private data or writes. */\nimport { McpServer } from '@modelcontextprotocol/server';\nimport { serveStdio } from '@modelcontextprotocol/server/stdio';\nimport * as z from 'zod/v4';\n\nserveStdio(() => {\n  const server = new McpServer({ name: 'atlas-docs', version: '0.1.0' });\n  server.registerTool(\n    'get_guide',\n    {\n      title: 'Get the example Atlas guide',\n      description: 'Return the single public Atlas API v1 guide fixture. Does not search or provide v2 guidance.',\n      inputSchema: z.object({}),\n      annotations: { readOnlyHint: true, destructiveHint: false, openWorldHint: false }\n    },\n    async () => ({\n      content: [{ type: 'text', text: 'Atlas API v1 — key rotation fixture. Create a replacement key, update your application, then revoke the old key. This fictional fixture is not v2 guidance.' }]\n    })\n  );\n  return server;\n});\n",

    "notes": "The domain input is query, site, version and a small result limit. A schema constrains the shape, length and bounds. The handler validates whether that site and version are supported and will later resolve whether the caller may access them. A missing or ambiguous version should lead to an explicit clarification or documented fallback, not a silent default to whatever looks similar. In the current public-only stage, site is a catalog selector, not an arbitrary URL. This blocks the accidental expansion from “search our docs” to “fetch anything on the network.” The exact limit of three is a fixture choice, not a protocol requirement.",

    "notes": "The same tested search and evidence functions should power both adapters. Keep transport framing and authentication seams separate from application behavior. For this story, the hosted service exposes the same useful read tools rather than a new set of arbitrary endpoint wrappers. Pin the SDK major line and supported protocol revisions. Current SDK v2 and v1 use different package and transport APIs; the starter deliberately uses the v2 shape. A host that supports MCP is not necessarily compatible with every current extension or protocol revision. Test real hosted clients, discovery routes and the production proxy path instead of treating localhost success as enough.",

    "notes": "The requirement changes: Maya now needs a private guide containing North-specific integration instructions. The server must know who the caller is and which workspace they can access. Public and private content need explicit boundaries; adding a hidden “tenant” argument to the tool is not authentication. The public path can remain available without identity, but it must never fall through to private data. We introduce resource-bound OAuth access for the hosted service and test the target hosts’ supported registration and consent mechanisms. Keep the privacy policy and source documentation aligned with this new private-data capability.",

  {

    "title": "Add a resource-bound grant.",
    "subtitle": "Connect → discover → consent → call.",
    "body": "<svg class=\"diagram\" data-visual=\"request-sequence\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The same Atlas request proceeds through unauthenticated request, 401 + resource metadata, issuer discovery + consent, token for Atlas MCP, authenticated call\"><defs><marker id=\"arrow-14\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"100\" y=\"40\" font-size=\"24\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Maya’s host</text><path d=\"M100 65L100 420\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" /><text x=\"720\" y=\"40\" font-size=\"24\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Atlas MCP</text><path d=\"M720 65L720 420\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" /><text x=\"1340\" y=\"40\" font-size=\"24\" fill=\"#102d50\" text-anchor=\"end\" font-weight=\"550\">Issuer</text><path d=\"M1340 65L1340 420\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" /><path d=\"M100 115L720 115\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><text x=\"410\" y=\"100\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">unauthenticated request</text><path d=\"M720 181L100 181\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><text x=\"410\" y=\"166\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">401 + resource metadata</text><path d=\"M100 247L1340 247\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><text x=\"720\" y=\"232\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">issuer discovery + consent</text><path d=\"M1340 313L100 313\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><text x=\"720\" y=\"298\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">token for Atlas MCP</text><path d=\"M100 379L720 379\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><text x=\"410\" y=\"364\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">authenticated call</text></svg>",
    "notes": "This diagram explicitly separates the host, Atlas resource server and issuer. OAuth resource server and authorization server are separate roles even if deployed together. The MCP endpoint’s challenge points the host toward protected-resource metadata; the client discovers the issuer and performs its supported registration and PKCE-based authorization flow. The token is intended for Atlas MCP. Atlas validates it and then applies operation/object checks. Do not forward that token to an unrelated upstream API. Client ID metadata, pre-registration and compatibility dynamic registration need to be tested against the actual host.",

    "notes": "Introduce Harbor as the second fictional tenant. Maya’s authenticated identity maps to North on the server. A model-supplied document ID or workspace selector cannot grant access to Harbor. Filter the index by authorized scope before ranking or returning counts and snippets, then recheck returned objects to catch index ACL lag. Apply the same boundary to get_doc, pagination cursors, source URLs and caches. A token with a read scope authorizes an action category, not every document in every workspace. Test denial without leaking whether a forbidden private object exists. This is application policy, not automatic isolation supplied by MCP.",

    "body": "<svg class=\"diagram\" data-visual=\"request-checkpoint\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Maya asks about rotating a key in v2; current server outcome is North · v2 · source\"><defs><marker id=\"arrow-16\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"55\" y=\"40\" width=\"520\" height=\"290\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"90\" y=\"100\" font-size=\"21\" fill=\"#b7d0fa\" text-anchor=\"start\" font-weight=\"550\">MAYA ASKS</text><text x=\"90\" y=\"178\" font-size=\"37\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">How do I rotate</text><text x=\"90\" y=\"230\" font-size=\"37\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">an API key in v2?</text><path d=\"M585 185L780 185\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-16)\"/><rect x=\"790\" y=\"40\" width=\"600\" height=\"290\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1090\" y=\"179\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">North · v2 · source</text><text x=\"1090\" y=\"215\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">Identity + scope + object checks.</text></svg>",
    "notes": "Replay the question in the North workspace. Maya signs in and consents; the server resolves her identity and North grant, validates the v2 filter, searches only accessible documents, and returns the correct source. The host sees enough evidence to answer but not a raw token, broad conversation history or Harbor data. Summarize the first act: we evolved from a constant to versioned search, hosted the same core, and added identity plus authorization when the data required it. The result remains read-only. The next act requires a new explicit user request and editor permission; nothing about reading the guide silently authorizes a write.",

  {
    "stage": 4,
    "section": "02 OPERATE · NEW USER INTENT",
    "title": "“This guide is stale.<br>Can you fix and publish it?”",
    "subtitle": "S4: Maya is now an authorized North editor.",
    "body": "<svg class=\"diagram\" data-visual=\"intent-change\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The user explicitly changes from reading a guide to updating and publishing an owned document.\"><defs><marker id=\"arrow-17\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"120\" width=\"530\" height=\"190\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"315\" y=\"209\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">READ THE GUIDE</text><text x=\"315\" y=\"245\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">original request</text><path d=\"M590 215L840 215\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-17)\"/><rect x=\"850\" y=\"120\" width=\"530\" height=\"190\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1115\" y=\"209\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">PUBLISH AN UPDATE</text><text x=\"1115\" y=\"245\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">new intent + editor grant</text></svg>",
    "notes": "Make the change in authority explicit. Maya is now acting as an editor who has a North publishing grant, and she asks to fix and publish the stale guide. This is a different user intent from the opening retrieval question. We need write-specific contracts, appropriate annotation and a confirmation or approval model for the consequential action. A read token does not become a publish token just because a model notices a stale page. The example does not perform real publishing. The key teaching point is that expanding the tool surface should follow a legitimate workflow and be accompanied by stronger policy and reliability semantics.",

  {
    "stage": 4,
    "section": "02 OPERATE · WRITE CONTRACTS",
    "title": "Separate draft<br>from publish.",
    "subtitle": "The side effect becomes visible.",
    "body": "<svg class=\"diagram\" data-visual=\"toolbelt\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"get_doc, save_draft, publish_doc\"><defs><marker id=\"arrow-18\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"88\" y=\"65\" width=\"398.6666666666667\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"115\" y=\"125\" font-size=\"20\" fill=\"#06746e\" text-anchor=\"start\" font-weight=\"550\">READ</text><text x=\"115\" y=\"215\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">get_doc</text><text x=\"115\" y=\"285\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">inspect current content</text><rect x=\"514.6666666666667\" y=\"65\" width=\"398.6666666666667\" height=\"270\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"541.6666666666667\" y=\"125\" font-size=\"20\" fill=\"#aac8f1\" text-anchor=\"start\" font-weight=\"550\">WRITE</text><text x=\"541.6666666666667\" y=\"215\" font-size=\"27\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">save_draft</text><text x=\"541.6666666666667\" y=\"285\" font-size=\"20\" fill=\"#b7cfee\" text-anchor=\"start\" font-weight=\"550\">new revision</text><rect x=\"941.3333333333334\" y=\"65\" width=\"398.6666666666667\" height=\"270\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"968.3333333333334\" y=\"125\" font-size=\"20\" fill=\"#aac8f1\" text-anchor=\"start\" font-weight=\"550\">WRITE</text><text x=\"968.3333333333334\" y=\"215\" font-size=\"27\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">publish_doc</text><text x=\"968.3333333333334\" y=\"285\" font-size=\"20\" fill=\"#b7cfee\" text-anchor=\"start\" font-weight=\"550\">public state changes</text></svg>",
    "notes": "Keep read, draft and publish operations distinct. For this fictional product, save_draft creates or updates a revision inside North, while publish_doc changes the public version of an identified document. Their metadata must describe actual effects and limitations. Host annotation rules are platform-specific, so apply the current target requirements and do not assume an undo button makes an action harmless. Validate editor access and target ownership in every write handler. A generic api_request(method, body) tool would conceal precisely the boundary we need both the model and a reviewer to understand. Starting persistent workflows and writing artifacts are state changes too.",
    "refs": [
      "openai-policy",
      "claude-review"

    "theme": "light",

    "anchor": "atlas-20",
    "kind": "split-write-tools"

  {
    "stage": 4,
    "section": "02 OPERATE · APPROVAL",
    "title": "Approve this change<br>to this revision.",
    "subtitle": "Bind intent to target, content and current authority.",
    "body": "<svg class=\"diagram\" data-visual=\"approval-packet\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A publish approval identifies the document, base revision, proposed diff and authorized actor.\"><defs><marker id=\"arrow-19\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"130\" y=\"25\" width=\"1180\" height=\"360\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"175\" y=\"80\" font-size=\"22\" fill=\"#b7d0fa\" text-anchor=\"start\" font-weight=\"550\">PUBLISH INTENT</text><text x=\"180\" y=\"145\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"28\" fill=\"#edf4fc\">doc: north/key-rotation</text><text x=\"180\" y=\"206\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"28\" fill=\"#edf4fc\">base_revision: r17</text><text x=\"180\" y=\"267\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"28\" fill=\"#edf4fc\">proposed_revision: r18</text><text x=\"180\" y=\"328\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"28\" fill=\"#edf4fc\">actor: Maya · editor</text></svg>",
    "notes": "The approval or confirmation must identify the exact action, document and proposed content, not a vague permission to “fix docs.” Include the base revision or equivalent precondition so the server can reject a stale update if someone edits the document before execution. Recheck current permissions at the execution boundary. A host confirmation UI is useful but cannot replace backend authorization. If permissions are revoked while a long workflow waits, define how the eventual write is denied. The r17/r18 revision labels are fictional. This is a recommended application contract, not a universal MCP approval packet format.",

    ],

  {
    "stage": 4,
    "section": "02 OPERATE · CONCURRENCY",
    "title": "Another editor<br>published first.",
    "subtitle": "Reject the stale base revision.",
    "body": "<svg class=\"diagram\" data-visual=\"revision-race\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Maya edits revision r17 while another editor commits r18; Maya’s stale write is rejected.\"><defs><marker id=\"arrow-20\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><path d=\"M65 215L1380 215\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><circle cx=\"180\" cy=\"215\" r=\"40\" fill=\"#2469e5\"/><text x=\"180\" y=\"224\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">r17</text><circle cx=\"720\" cy=\"215\" r=\"40\" fill=\"#06746e\"/><text x=\"720\" y=\"224\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">r18</text><circle cx=\"1260\" cy=\"215\" r=\"40\" fill=\"#b44735\"/><text x=\"1260\" y=\"224\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">×</text><text x=\"180\" y=\"120\" font-size=\"29\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Maya starts</text><text x=\"720\" y=\"120\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Other editor publishes</text><text x=\"1260\" y=\"120\" font-size=\"29\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">Conflict</text><text x=\"720\" y=\"360\" font-size=\"30\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">Reload → review diff → approve again</text></svg>",
    "notes": "A safe write must cope with concurrency. Maya’s draft was based on r17, but another editor has already made r18 current. A base-revision precondition prevents overwriting the newer work. Return an actionable conflict rather than silently rebasing arbitrary content or treating the stale approval as valid for a different diff. The host can fetch the latest revision, explain the conflict and ask Maya to review a new proposal. An application-defined revision precondition is separate from idempotency, which will later handle repeating the same intended operation after an ambiguous response.",

    "visualKind": "optimistic-concurrency",
    "anchor": "atlas-22",
    "kind": "optimistic-concurrency"

  {
    "stage": 5,
    "section": "02 OPERATE · OBSERVABILITY",
    "title": "Maya says “it failed.”<br>HTTP says “200.”",

    "body": "<svg class=\"diagram\" data-visual=\"status-disagreement\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The HTTP exchange completes but the publish tool reports a revision conflict.\"><defs><marker id=\"arrow-21\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"60\" y=\"110\" width=\"550\" height=\"200\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"335\" y=\"204\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">HTTP 200</text><text x=\"335\" y=\"240\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">exchange completed</text><rect x=\"830\" y=\"110\" width=\"550\" height=\"200\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1105\" y=\"204\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">TOOL CONFLICT</text><text x=\"1105\" y=\"240\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">publish did not happen</text><text x=\"720\" y=\"235\" font-size=\"65\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">≠</text></svg>",

    "body": "<svg class=\"diagram\" data-visual=\"request-sequence\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The same Atlas request proceeds through reindex_site, persist job + enqueue, durable handle, poll status, completed + result\"><defs><marker id=\"arrow-26\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"100\" y=\"40\" font-size=\"24\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Maya’s host</text><path d=\"M100 65L100 420\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" /><text x=\"720\" y=\"40\" font-size=\"24\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Atlas MCP</text><path d=\"M720 65L720 420\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" /><text x=\"1340\" y=\"40\" font-size=\"24\" fill=\"#102d50\" text-anchor=\"end\" font-weight=\"550\">Atlas service</text><path d=\"M1340 65L1340 420\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" /><path d=\"M100 115L720 115\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-26)\"/><text x=\"410\" y=\"100\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">reindex_site</text><path d=\"M720 181L1340 181\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-26)\"/><text x=\"1030\" y=\"166\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">persist job + enqueue</text><path d=\"M720 247L100 247\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-26)\"/><text x=\"410\" y=\"232\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">durable handle</text><path d=\"M100 313L720 313\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-26)\"/><text x=\"410\" y=\"298\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">poll status</text><path d=\"M720 379L100 379\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-26)\"/><text x=\"410\" y=\"364\" font-size=\"23\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">completed + result</text></svg>",

    "body": "<svg class=\"diagram\" data-visual=\"ambiguous-commit\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A publish operation commits before its response is lost, so the caller has an unknown outcome.\"><defs><marker id=\"arrow-27\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><path d=\"M80 210L1370 210\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><circle cx=\"160\" cy=\"210\" r=\"31\" fill=\"#2469e5\"/><text x=\"160\" y=\"219\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">1</text><circle cx=\"550\" cy=\"210\" r=\"31\" fill=\"#06746e\"/><text x=\"550\" y=\"219\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">2</text><circle cx=\"950\" cy=\"210\" r=\"31\" fill=\"#b44735\"/><text x=\"950\" y=\"219\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">×</text><circle cx=\"1260\" cy=\"210\" r=\"31\" fill=\"#0b2546\"/><text x=\"1260\" y=\"219\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">?</text><text x=\"160\" y=\"120\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Request</text><text x=\"550\" y=\"120\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Commit r19</text><text x=\"950\" y=\"120\" font-size=\"28\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">Response lost</text><text x=\"1260\" y=\"120\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Retry?</text><text x=\"720\" y=\"365\" font-size=\"28\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">A second publish must not become a new revision.</text></svg>",

    "body": "<svg class=\"diagram\" data-visual=\"atlas-idempotency\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The publish key maps to the caller, payload hash, state and resulting revision r19.\"><defs><marker id=\"arrow-28\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"35\" y=\"130\" width=\"400\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"235\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">publish_key = p42</text><text x=\"235\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">same user intent</text><path d=\"M445 205L650 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-28)\"/><rect x=\"665\" y=\"30\" width=\"720\" height=\"360\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"705\" y=\"85\" font-size=\"21\" fill=\"#aac8f1\" text-anchor=\"start\" font-weight=\"550\">ATLAS OPERATION RECORD</text><text x=\"710\" y=\"150\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"27\" fill=\"#edf4fc\">actor: Maya / North</text><text x=\"710\" y=\"210\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"27\" fill=\"#edf4fc\">payload_hash: …</text><text x=\"710\" y=\"270\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"27\" fill=\"#edf4fc\">state: completed</text><text x=\"710\" y=\"330\" font-family=\"SFMono-Regular,Consolas,monospace\" font-size=\"27\" fill=\"#edf4fc\">result: revision r19</text></svg>",

    "body": "<svg class=\"diagram\" data-visual=\"atlas-outbox\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A transaction commits revision r19 and an outbox event; a worker then updates the search index.\"><defs><marker id=\"arrow-29\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"40\" width=\"780\" height=\"330\" rx=\"5\" fill=\"#e5edfa\" stroke=\"#b9cbe0\" stroke-width=\"2\"/><text x=\"85\" y=\"95\" font-size=\"22\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">ONE DATABASE TRANSACTION</text><rect x=\"90\" y=\"145\" width=\"300\" height=\"135\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"240\" y=\"206.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Revision r19</text><text x=\"240\" y=\"242.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">published state</text><rect x=\"455\" y=\"145\" width=\"315\" height=\"135\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"612.5\" y=\"206.5\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Outbox event</text><text x=\"612.5\" y=\"242.5\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">reindex r19</text><path d=\"M835 210L1035 210\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-29)\"/><rect x=\"1045\" y=\"145\" width=\"350\" height=\"135\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1220\" y=\"206.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Index worker</text><text x=\"1220\" y=\"242.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">dedupe + reconcile</text></svg>",
    "notes": "Atlas uses a local transaction to store the published revision and an outbox event for indexing. A worker processes committed events and updates the index. Delivery can repeat after a crash, so the worker must deduplicate or make applying a particular source revision idempotent. This design reduces the gap between a committed write and a lost job handoff; it does not make every external effect exactly-once or the index instantly consistent. Expose index freshness explicitly so Maya knows when r19 is searchable. Alternative workflow engines can provide a different durable handoff, but the application still needs defined failure and reconciliation behavior.",

    "subtitle": "The guide was published once; indexing catches up.",
    "body": "<svg class=\"diagram\" data-visual=\"recovery-storyboard\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Three panels show unknown outcome, operation lookup and the original successful publish result.\"><defs><marker id=\"arrow-30\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"65\" width=\"410\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"45\" y=\"65\" width=\"410\" height=\"45\" rx=\"5\" fill=\"#b44735\" stroke=\"none\" stroke-width=\"2\"/><text x=\"70\" y=\"97\" font-size=\"20\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">UNKNOWN</text><text x=\"250\" y=\"220\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Did it publish?</text><text x=\"250\" y=\"298\" font-size=\"22\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">lost response</text><rect x=\"515\" y=\"65\" width=\"410\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"515\" y=\"65\" width=\"410\" height=\"45\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"540\" y=\"97\" font-size=\"20\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">LOOKUP p42</text><text x=\"720\" y=\"220\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">completed</text><text x=\"720\" y=\"298\" font-size=\"22\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">stored outcome</text><rect x=\"985\" y=\"65\" width=\"410\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"985\" y=\"65\" width=\"410\" height=\"45\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1010\" y=\"97\" font-size=\"20\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">RECOVERED</text><text x=\"1190\" y=\"220\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">revision r19</text><text x=\"1190\" y=\"298\" font-size=\"22\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">no duplicate write</text></svg>",
    "notes": "Close the async/retry sequence using the same document, actor and revision. Maya’s retry carries p42. Atlas validates the current caller and operation relationship, recognizes the stored payload, and returns the original successful r19 outcome rather than creating another revision. The durable indexing event can also be retried until the index reflects r19. A failure in indexing is reported as that specific state, not as proof that the publish never happened. The audience should now be able to distinguish publication commit, response delivery, job execution and index freshness as separate events. We added complexity because they can fail independently.",

  {
    "stage": 7,
    "section": "02 OPERATE · GOVERNANCE",
    "title": "North gets busy.<br>Harbor needs service too.",
    "subtitle": "S7: bound the work each tenant can consume.",
    "body": "<svg class=\"diagram\" data-visual=\"atlas-fair-queue\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"North and Harbor queues feed a bounded worker pool.\"><defs><marker id=\"arrow-31\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"45\" y=\"140\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">NORTH</text><rect x=\"245\" y=\"95\" width=\"60\" height=\"70\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"335\" y=\"95\" width=\"60\" height=\"70\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"425\" y=\"95\" width=\"60\" height=\"70\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"515\" y=\"95\" width=\"60\" height=\"70\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><path d=\"M605 130L865 220\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-31)\"/><text x=\"45\" y=\"320\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">HARBOR</text><rect x=\"245\" y=\"275\" width=\"60\" height=\"70\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"335\" y=\"275\" width=\"60\" height=\"70\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"425\" y=\"275\" width=\"60\" height=\"70\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"515\" y=\"275\" width=\"60\" height=\"70\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><path d=\"M605 310L865 220\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-31)\"/><rect x=\"875\" y=\"130\" width=\"490\" height=\"180\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1120\" y=\"214\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">BOUNDED WORKERS</text><text x=\"1120\" y=\"250\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">quota · deadline · backpressure</text></svg>",
    "notes": "A working job system can still be exhausted by one tenant. Put limits on per-tenant concurrency, queue depth, request size, query cost and result size, along with global downstream budgets. Fair scheduling prevents North’s rebuilds from starving Harbor’s retrieval or indexing. Define whether overload rejects, defers or creates a job and return an actionable capacity response. Apply bounded retries with backoff and jitter for transient failures instead of synchronizing all clients into a retry storm. These are recommended service policies, not requirements imposed automatically by MCP. Keep operational metrics private and bounded.",

    "body": "<svg class=\"diagram\" data-visual=\"comparison\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"BEFORE / search North docs /  versus AFTER / search all workspaces / \"><defs><marker id=\"arrow-32\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"60\" width=\"620\" height=\"285\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"780\" y=\"60\" width=\"620\" height=\"285\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"75\" y=\"105\" font-size=\"19\" fill=\"#b44735\" text-anchor=\"start\" font-weight=\"550\">BEFORE</text><text x=\"815\" y=\"105\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"start\" font-weight=\"550\">AFTER</text><text x=\"350\" y=\"211\" font-size=\"38\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">search North docs</text><text x=\"1090\" y=\"211\" font-size=\"38\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">search all workspaces</text><text x=\"350\" y=\"270\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\"></text><text x=\"1090\" y=\"270\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\"></text><text x=\"720\" y=\"220\" font-size=\"54\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">→</text><text x=\"720\" y=\"410\" font-size=\"25\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">Scope changed. Review schema + prose + behavior.</text></svg>",
    "notes": "The team proposes changing the tool’s description from searching North’s authorized docs to searching all workspaces. That text can alter model triggering and implied capability even before a handler changes. Review description, input/output schema, annotations, policy and implementation as one contract. A publisher cannot fix unauthorized behavior merely by narrowing a sentence, nor expand access merely by broadening it. Maintain an inventory with a named owner, source rights, data classification and a disable path. For this story we reject the unbounded change and keep authorized tenant isolation. Later, directory scanning will add another contract gate to this internal release process.",

  {
    "stage": 7,
    "section": "02 OPERATE · SYSTEM CHECKPOINT",
    "title": "Atlas is now<br>a hosted product.",
    "subtitle": "Every new box answers a failure we saw.",
    "body": "<svg class=\"diagram\" data-visual=\"growing-system\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Atlas Docs architecture at stage 7\"><defs><marker id=\"arrow-33\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><path d=\"M310 230L390 230\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-33)\"/><path d=\"M640 215H680V125H725\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-33)\"/><path d=\"M975 125H1030V215H1090\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-33)\"/><path d=\"M855 190V290\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-33)\"/><path d=\"M975 355H1030V260H1090\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" marker-end=\"url(#arrow-33)\"/><rect x=\"70\" y=\"175\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"190\" y=\"238\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Host</text><rect x=\"400\" y=\"175\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"520\" y=\"238\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP</text><rect x=\"735\" y=\"70\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"855\" y=\"133\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Policy</text><rect x=\"1100\" y=\"175\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1220\" y=\"238\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Docs</text><rect x=\"735\" y=\"300\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"855\" y=\"363\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Worker</text></svg>",
    "notes": "Pause on the grown architecture and invite the audience to name each box’s purpose. The host chooses tools; Atlas validates and dispatches; policy resolves identity, tenant, scope and object; the docs service stores revisions and queries a versioned index; workers process durable indexing events with bounded capacity. Internal telemetry observes the path without copying raw chats. The picture is still a simplified conceptual map: the issuer, operation ledger, outbox and telemetry are details within these boundaries, not absent responsibilities. No directory has approved anything yet. We are finally ready to distribute the same working product, using its own regression scenarios as review evidence.",

\"1252.5\" y=\"189\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Check job</text><text x=\"1252.5\" y=\"225\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">sample data</text></svg>",

    "body": "<svg class=\"diagram\" data-visual=\"atlas-claude-path\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Atlas HTTPS endpoint is submitted as an MCP connector; an optional GitHub workflow bundle is a separate plugin submission.\"><defs><marker id=\"arrow-38\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"65\" width=\"440\" height=\"120\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"260\" y=\"133\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">ATLAS /mcp</text><path d=\"M490 125L750 125\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-38)\"/><rect x=\"760\" y=\"65\" width=\"640\" height=\"120\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080\" y=\"119\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP connector</text><text x=\"1080\" y=\"155\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">remote service</text><rect x=\"40\" y=\"285\" width=\"440\" height=\"120\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"260\" y=\"353\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Optional skills bundle</text><path d=\"M490 345L750 345\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-38)\"/><rect x=\"760\" y=\"285\" width=\"640\" height=\"120\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080\" y=\"339\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Plugin bundle</text><text x=\"1080\" y=\"375\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">GitHub source</text></svg>",
    "notes": "Use Claude’s developer portal and select MCP connector for Atlas’s remote HTTPS endpoint. Test every tool in the actual host, provide the required titles and appropriate hints, and supply documentation, privacy/support information and the reviewer fixture. If Atlas also packages a workflow as a plugin, submit that bundle through the separate GitHub-based plugin path and submit the owned remote connector too. Skills are not a standalone connector listing. Current dedicated documentation routes local servers through plugins rather than accepting the older standalone MCPB directory path. Keep the distinction between a working connector and any Community/Verified review label.",

  {
    "stage": 8,
    "section": "03 DISTRIBUTE · REJECTION AND REPAIR",
    "title": "Atlas exposed<br>a mixed read/write tool.",
    "subtitle": "A hypothetical review finding; split and retest.",
    "body": "<svg class=\"diagram\" data-visual=\"atlas-review-repair\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A hypothetical catch-all docs_request tool is replaced by explicit read and publish tools.\"><defs><marker id=\"arrow-39\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"120\" width=\"460\" height=\"180\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"275\" y=\"204\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">docs_request(method, …)</text><text x=\"275\" y=\"240\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">hidden action boundary</text><path d=\"M515 210H700V100H850\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-39)\"/><path d=\"M700 210V335H850\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-39)\"/><rect x=\"860\" y=\"40\" width=\"530\" height=\"120\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1125\" y=\"94\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">get_doc</text><text x=\"1125\" y=\"130\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">read</text><rect x=\"860\" y=\"275\" width=\"530\" height=\"120\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1125\" y=\"329\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">publish_doc</text><text x=\"1125\" y=\"365\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">explicit write</text></svg>",
    "notes": "Frame this as a hypothetical finding, not an actual Atlas or Docsalot rejection. Suppose the team accidentally reintroduced a catch-all docs_request operation in the submission package. Claude’s published checklist rejects tools that combine safe and unsafe HTTP methods. The fix is behavioral: expose meaningful read and write operations separately, give them accurate metadata, update the implementation and rerun the fixture scenarios. A new name for the same generic executor does not resolve the boundary. For any real review, use the exact feedback and the applicable current policy. Do not invent rejection percentages, guaranteed timelines or a claim that this repair guarantees acceptance.",

      "openai-policy"

  {
    "stage": 8,
    "section": "03 DISTRIBUTE · OTHER ROUTES",
    "title": "Same service.<br>Different installation contracts.",
    "subtitle": "Cursor, Copilot and the MCP Registry.",
    "body": "<svg class=\"diagram\" data-visual=\"atlas-other-distribution\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Atlas endpoint fans out to a Cursor plugin, Copilot configuration and metadata registry entry.\"><defs><marker id=\"arrow-40\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"145\" width=\"330\" height=\"150\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"210\" y=\"214\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">ATLAS MCP</text><text x=\"210\" y=\"250\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">same core</text><path d=\"M385 220H565V75H770\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-40)\"/><path d=\"M565 220H770\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-40)\"/><path d=\"M565 220V365H770\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-40)\"/><rect x=\"780\" y=\"25\" width=\"600\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080\" y=\"69\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Cursor</text><text x=\"1080\" y=\"105\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">public plugin repository</text><rect x=\"780\" y=\"170\" width=\"600\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080\" y=\"214\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Copilot / VS Code</text><text x=\"1080\" y=\"250\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">gallery or configuration</text><rect x=\"780\" y=\"315\" width=\"600\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1080\" y=\"359\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Official MCP Registry</text><text x=\"1080\" y=\"395\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">metadata + ownership proof</text></svg>",
    "notes": "Cursor offers direct MCP setup and a reviewed plugin marketplace route with supported manifest formats and a public repository submission. Copilot/VS Code can use supported registry/gallery installation or manual MCP configuration, subject to relevant organization policy and user trust. The official MCP Registry hosts metadata about the endpoint or package; it does not run Atlas or approve it for every host. Establish namespace and any package ownership proof for that route. Keep installation instructions specific to the host. A portable protocol does not mean identical packaging, shared review status or uniform extension support across these ecosystems.",

  {
    "stage": 9,
    "section": "03 DISTRIBUTE · AFTER APPROVAL",
    "title": "S9: the server changes<br>before the host’s schema does.",
    "subtitle": "Keep both live contracts working.",
    "body": "<svg class=\"diagram\" data-visual=\"atlas-rolling-contract\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A host still sends publish_doc(doc, revision), while the server accepts an optional expected_revision field without breaking old callers.\"><defs><marker id=\"arrow-41\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"110\" width=\"570\" height=\"200\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"325\" y=\"204\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">APPROVED INPUT</text><text x=\"325\" y=\"240\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">doc + revision</text><path d=\"M620 210L810 210\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-41)\"/><rect x=\"820\" y=\"110\" width=\"580\" height=\"200\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1110\" y=\"204\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">DEPLOYED SERVER</text><text x=\"1110\" y=\"240\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">old + compatible new</text><text x=\"720\" y=\"395\" font-size=\"29\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">Expand → scan → adopt → retire safely</text></svg>",
    "notes": "Distribution is not the last release. Suppose Atlas wants a new optional publishing input or a stronger conflict-reporting shape. Under continuous review, the host may retain the previously approved definition while Atlas’s implementation has already changed. Accept the old contract during that window, avoid making new fields required prematurely, and inspect the live metadata rather than assuming a server deployment updated the host. Preserve resource references as well as input compatibility. New or changed tools can have separate scan outcomes. Roll back a breaking implementation instead of waiting for review to fix runtime behavior. This ties internal schema governance directly to public distribution.",
    "refs": [
      "openai-review"
    ],
    "core": true,
    "theme": "light",
    "visualKind": "atlas-two-contract-rollout",
    "anchor": "atlas-43",
    "kind": "atlas-two-contract-rollout"
  },
  {
    "stage": 9,
    "section": "03 DISTRIBUTE · THE FULL JOURNEY",
    "title": "Follow Maya’s<br>request one last time.",
    "subtitle": "Each step now has an explicit responsibility.",
    "body": "<svg class=\"diagram\" data-visual=\"final-request-spine\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The final read request passes identity, object policy, versioned retrieval and evidence shaping.\"><defs><marker id=\"arrow-43\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><defs><marker id=\"arrow-42\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"146.4\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Maya</text><path d=\"M262.8 205L307.8 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"316.8\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"433.20000000000005\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Identity</text><path d=\"M549.6 205L594.6 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"603.6\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Policy</text><path d=\"M836.4000000000001 205L881.4000000000001 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"890.4000000000001\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1006.8000000000001\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">v2 index</text><path d=\"M1123.2 205L1168.2 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"1177.2\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1293.6000000000001\" y=\"213\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Evidence</text></svg>",
    "notes": "Use the exact opening question again. The host selects Atlas’s read tool. The endpoint accepts a supported protocol request, validates the resource-bound token if private data is needed, resolves Maya’s North permissions and checks the requested action and objects. The domain service filters the index by site/version and current access, then returns bounded evidence with provenance. Internal traces classify transport, tool and dependency behavior without collecting the raw chat. The host answers with the correct North v2 source. Durable jobs and publishing controls are not invoked merely because they exist; they serve the separate update workflow. Distribution made this capability installable but did not grant additional data access.",
    "refs": [
      "auth",
      "tools"
    ],
    "core": true,
    "theme": "light",
    "visualKind": "final-recurring-request",
    "anchor": "atlas-44",
    "kind": "final-recurring-request"
  },
  {
    "stage": 9,
    "section": "SYNTHESIS · WHAT CHANGED",
    "title": "Every layer<br>has a reason to exist.",
    "subtitle": "The architecture is a history of solved problems.",
    "body": "<svg class=\"diagram\" data-visual=\"problem-solution-map\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Wrong guide led to version filters; private data led to policy; ambiguity led to a ledger; discovery led to review.\"><defs><marker id=\"arrow-44\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"25\" width=\"510\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"300\" y=\"73\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Wrong guide</text><path d=\"M565 65L785 65\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-44)\"/><rect x=\"795\" y=\"25\" width=\"600\" height=\"80\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1095\" y=\"73\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Version + evidence</text><rect x=\"45\" y=\"127\" width=\"510\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"300\" y=\"175\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Private docs</text><path d=\"M565 167L785 167\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-44)\"/><rect x=\"795\" y=\"127\" width=\"600\" height=\"80\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1095\" y=\"175\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Identity + policy</text><rect x=\"45\" y=\"229\" width=\"510\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"300\" y=\"277\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Lost response</text><path d=\"M565 269L785 269\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-44)\"/><rect x=\"795\" y=\"229\" width=\"600\" height=\"80\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1095\" y=\"277\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Stored outcome</text><rect x=\"45\" y=\"331\" width=\"510\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"300\" y=\"379\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">New users</text><path d=\"M565 371L785 371\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-44)\"/><rect x=\"795\" y=\"331\" width=\"600\" height=\"80\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1095\" y=\"379\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Package + review</text></svg>",
    "notes": "Ask the audience to explain the right column before you name it. Wrong-version instructions required explicit retrieval constraints and provenance. Private docs required a user/resource grant and object authorization. New publishing intent required separate write tools, revision checks and approval semantics. Ambiguous completion required a durable operation outcome, while indexing needed a durable handoff. New users needed product-specific distribution evidence. The diagram condenses the narrative; it does not imply these are the only controls needed for production. The aim is that the final architecture no longer looks like an arbitrary pile of infrastructure. Each part should remind the audience of a concrete failure we already traced.",
    "refs": [],
    "core": true,
    "theme": "light",
    "visualKind": "causal-recap",
    "anchor": "atlas-45",
    "kind": "causal-recap"
  },
  {
    "stage": 9,
    "section": "SYNTHESIS · THE COMPLETE PRODUCT",
    "title": "We started<br>with a constant.",
    "subtitle": "Now we can explain the system.",
    "body": "<svg class=\"diagram\" data-visual=\"growing-system\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Atlas Docs architecture at stage 9\"><defs><marker id=\"arrow-45\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><path d=\"M310 230L390 230\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-45)\"/><path d=\"M640 215H680V125H725\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-45)\"/><path d=\"M975 125H1030V215H1090\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-45)\"/><path d=\"M855 190V290\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-45)\"/><path d=\"M975 355H1030V260H1090\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" marker-end=\"url(#arrow-45)\"/><rect x=\"70\" y=\"175\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"190\" y=\"238\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Host</text><rect x=\"400\" y=\"175\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"520\" y=\"238\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP</text><rect x=\"735\" y=\"70\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"855\" y=\"133\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Policy</text><rect x=\"1100\" y=\"175\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1220\" y=\"238\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Docs</text><rect x=\"735\" y=\"300\" width=\"240\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"855\" y=\"363\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Worker</text></svg>",
    "notes": "Compare this map with the stage-zero server. We still have the same basic idea: a host invokes a bounded capability over MCP and receives useful results. What grew is the product boundary around it: coherent retrieval, remote adapters, private access, explicit editor actions, observable execution, durable recovery, operational budgets and reviewable distribution. This is a conceptual final map, with the detailed ledger/outbox/issuer responsibilities explained earlier. Do not describe it as an audited Docsalot diagram. The test of understanding is whether someone can trace both Maya’s read request and her explicit publish/reindex workflow, including their denial and failure paths.",
    "refs": [],
    "core": true,
    "theme": "light",
    "visualKind": "final-system-map",
    "anchor": "atlas-46",
    "kind": "final-system-map"
  },
  {
    "stage": 9,
    "section": "CLOSING",
    "title": "One tool can be small.<br>A trustworthy product is deliberate.",
    "subtitle": "Build the contract. Operate the outcome. Prove the release.",
    "body": "<div class=\"closing-glyphs\"><div><span>01</span><b>BUILD</b></div><div><span>02</span><b>OPERATE</b></div><div><span>03</span><b>DISTRIBUTE</b></div></div><div class=\"contact\"><b>Faizan Khan</b><span>docsalot.dev</span></div>",
    "notes": "Close through the story instead of repeating a checklist in isolation. Atlas began with one fixed guide and ended with a system whose permissions, execution and distribution we can reason about. The important skill is not adding every possible component on day one; it is recognizing when a legitimate requirement creates a new boundary and implementing the smallest reliable response. Ask the audience to identify the next failure in their own integration and the evidence they would need to show it is solved. Mention Docsalot’s work as the experience behind the talk without suggesting Atlas is a shipped customer product or that the example has received any directory approval.",
    "refs": [],

    "theme": "navy",

    "kind": "closing-synthesis"
  },
  {
    "stage": 9,
    "section": "DISCUSSION",
    "title": "Where would<br>your request fail?",
    "subtitle": "Trace it through Atlas.",
    "body": "<div class=\"question-compass\"><a href=\"#atlas-auth\">AUTH</a><a href=\"#atlas-async\">ASYNC</a><a href=\"#atlas-openai\">OPENAI</a><a href=\"#atlas-claude\">CLAUDE</a><span>ONE<br>REQUEST</span></div>",
    "notes": "Invite a concrete question and stay with the same fictional system. Identify the actor, desired action, data boundary and observed failure before suggesting a new control. Use the links to revisit authorization, durable jobs or the platform submission routes. Distinguish what the server knows from what the host or user experiences. For a distribution question, locate the relevant submission artifact and current official source rather than suggesting a universal plugin format or approval transfer. There is no time target or required Q&A duration for this edition.",
    "refs": [],

  {
    "stage": 9,
    "section": "REFERENCES",

function indices(){return slides.map((_,i)=>i).filter(i=>route==='all'||slides[i].core)}
function replay(){const e=document.querySelector('.slide.active');e.classList.remove('replaying');void e.offsetWidth;e.classList.add('replaying');}
function fit(){const v=$('#viewport');document.documentElement.style.setProperty('--stage-scale',Math.min(v.clientWidth/1600,v.clientHeight/900));}
function go(i,updateHash=true){if(i<0||i>=slides.length)return;if(!slides[i].core&&route==='core'){route='all';$('#mode').value=route;}current=i;document.querySelectorAll('.slide').forEach((e,n)=>{e.classList.toggle('active',n===i);e.setAttribute('aria-hidden',n===i?'false':'true');e.classList.toggle('print-hide',route==='core'&&!slides[n].core)});const s=slides[i],list=indices();$('#counter').textContent=`${list.indexOf(i)+1} / ${list.length}`;$('#progress').style.width=`${(list.indexOf(i)+1)/list.length*100}%`;$('#notes').innerHTML=`<div class="note-meta">${s.section} · ATLAS STORY · S${s.stage}</div><h2>${plain(s.title)}</h2>${notesMarkup(s.notes)}<h3>Sources</h3>${s.refs.map(id=>`<p><a href="${sourceById[id].url}" target="_blank" rel="noopener">${sourceById[id].title}</a></p>`).join('')||'<p>Authored framing / engineering recommendation.</p>'}<h3>Next</h3><p>${plain(slides[list[list.indexOf(i)+1]]?.title||'End of route')}</p>`;if(updateHash)history.replaceState(null,'',`#${s.anchor||'slide-'+(i+1)}`);renderPresenter();if($('#overview').classList.contains('open'))overview();fit();}

function renderPresenter(){if(!presenterWindow||presenterWindow.closed)return;const d=presenterWindow.document,s=slides[current],a=indices();d.querySelector('#meta').textContent=`${current+1} · ${s.section} · Atlas story · S${s.stage}`;d.querySelector('#title').textContent=plain(s.title);d.querySelector('#script').innerHTML=notesMarkup(s.notes);d.querySelector('#nextTitle').textContent=plain(slides[a[a.indexOf(current)+1]]?.title||'End of route');d.querySelector('#sources').innerHTML=s.refs.map(id=>`<p><a target="_blank" rel="noopener" href="${sourceById[id].url}">${sourceById[id].title} ↗</a></p>`).join('');d.querySelector('#time').textContent=$('#clock').textContent;}

$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#notesButton').onclick=toggleNotes;$('#overviewButton').onclick=()=>{overview();$('#overview').classList.toggle('open')};$('#mode').onchange=e=>{route=e.target.value;if(route==='core'&&!slides[current].core)current=0;go(current)};$('#presenterButton').onclick=openPresenter;$('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};$('#timerButton').onclick=()=>{timerRunning=!timerRunning;lastTick=performance.now();$('#timerButton').textContent=timerRunning?'Pause':'Start'};$('#resetButton').onclick=()=>{elapsed=0;lastTick=performance.now();$('#clock').textContent='00:00';renderPresenter()};setInterval(()=>{if(timerRunning){const now=performance.now();elapsed+=now-lastTick;lastTick=now;}const s=Math.floor(elapsed/1000);$('#clock').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;renderPresenter()},500);$('#printButton').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key.toLowerCase()==='r')replay();if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='o')$('#overviewButton').click();if(e.key.toLowerCase()==='f')$('#fullscreen').click();if(e.key==='Home')go(indices()[0]);if(e.key==='End')go(indices().at(-1));if(e.key==='Escape'){$('#overview').classList.remove('open');if($('#notes').classList.contains('open'))toggleNotes();}});function fromHash(){const h=decodeURIComponent(location.hash.slice(1));const i=slides.findIndex((s,n)=>(s.anchor||`slide-${n+1}`)===h);if(i>=0)go(i,false);else go(0,false)}window.addEventListener('hashchange',fromHash);window.addEventListener('resize',fit);document.addEventListener('click',e=>{const a=e.target.closest('a[
