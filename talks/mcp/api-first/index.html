uto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"55\" y=\"25\" width=\"1170\" height=\"190\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"95\" y=\"75\" font-size=\"18\" fill=\"#b9d0f2\" text-anchor=\"start\" font-weight=\"450\">MAYA ASKS<\/text><text x=\"95\" y=\"132\" font-size=\"34\" fill=\"#faf9f5\" text-anchor=\"start\" font-weight=\"600\">Find me a blue carry-on backpack under $100<\/text><text x=\"95\" y=\"178\" font-size=\"34\" fill=\"#faf9f5\" text-anchor=\"start\" font-weight=\"600\">that arrives by Friday.<\/text><rect x=\"95\" y=\"260\" width=\"315\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"252.5\" y=\"308.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Blue + carry-on<\/text><rect x=\"485\" y=\"260\" width=\"315\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"642.5\" y=\"308.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Under $100 total<\/text><rect x=\"875\" y=\"260\" width=\"315\" height=\"80\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1032.5\" y=\"308.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Arrives by Friday<\/text><\/svg>", "notes": "Maya asks her AI: find me a blue carry-on backpack under a hundred dollars, delivered by Friday. She is not opening our storefront and clicking through product pages. Her assistant needs to discover a real item, get a delivery quote, explain the total and ask before committing the purchase. Our store still owns its inventory and orders. The address and delivery providers know other parts of the answer. Let’s assume MCP does not exist and start with the simplest useful thing: expose the services as ordinary APIs. We will keep Maya’s identity, the quoted price and the eventual order consistent as the design grows.", "group": 0, "label": "", "timed": true, "point": null, "number": 2, "step": 1}, {"title": "Expose four services.<br>There is no storefront to click.", "sub": "The interface is an API. Maya’s AI is the customer’s entry point.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Expose four services. There is no storefront to click.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"0\" width=\"610\" height=\"155\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"35\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">STORE CATALOG<\/text><text x=\"34\" y=\"83\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">GET /products<\/text><text x=\"34\" y=\"121\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">product + price + stock<\/text><rect x=\"660\" y=\"0\" width=\"610\" height=\"155\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"684\" y=\"35\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">GEOROUTE<\/text><text x=\"684\" y=\"83\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">POST /routes<\/text><text x=\"684\" y=\"121\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">destination → distance<\/text><rect x=\"10\" y=\"175\" width=\"610\" height=\"155\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"210\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">PARCELQUOTE<\/text><text x=\"34\" y=\"258\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">POST /delivery-quotes<\/text><text x=\"34\" y=\"296\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">route → price + arrival<\/text><rect x=\"660\" y=\"175\" width=\"610\" height=\"155\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"684\" y=\"210\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">STORE ORDERS<\/text><text x=\"684\" y=\"258\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">POST /orders<\/text><text x=\"684\" y=\"296\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">POST /orders/{id}/cancel<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">HTTP APIs are enough to expose the business capabilities.<\/text><\/svg>", "notes": "We begin with a headless store: no shopping dashboard is available to the assistant. The catalog API finds products. GeoRoute resolves an authorized destination and calculates the warehouse distance. ParcelQuote estimates delivery from route and parcel information. The orders API creates or cancels an order. These are invented endpoint names for our example, not a proposed industry API specification. A service has multiple operations, so four services does not mean only four endpoints. The store owns catalog and orders; the other two are independent providers. Exposing an API is already a useful design. The next challenge is making those capabilities usable from Maya’s AI application.", "group": 0, "label": "", "timed": true, "point": null, "number": 3, "step": 2}, {"title": "With a fixed application,<br>we can write the flow ourselves.", "sub": "The API-only path works. Let’s make one successful request.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"With a fixed application, we can write the flow ourselves.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"130\" width=\"260\" height=\"100\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"140.0\" y=\"180.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Catalog<\/text><text x=\"140.0\" y=\"210.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">$79 backpack<\/text><path d=\"M278 180.0L325 180.0\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"335\" y=\"130\" width=\"260\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"465.0\" y=\"180.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">GeoRoute<\/text><text x=\"465.0\" y=\"210.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">12 km route<\/text><path d=\"M603 180.0L650 180.0\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"660\" y=\"130\" width=\"260\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"790.0\" y=\"180.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ParcelQuote<\/text><text x=\"790.0\" y=\"210.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">$12 · Friday<\/text><path d=\"M928 180.0L975 180.0\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"985\" y=\"130\" width=\"260\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1115.0\" y=\"180.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Order draft<\/text><text x=\"1115.0\" y=\"210.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">$91 total<\/text><text x=\"20\" y=\"50\" font-size=\"18\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">A DEVELOPER CAN WRITE THIS FLOW TODAY<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">Search → resolve destination → quote delivery → prepare checkout<\/text><\/svg>", "notes": "If I were building a conventional application, I would write this sequence myself. Search the catalog, resolve the destination, ask the delivery provider for a quote and prepare an order draft. Our fictional item costs seventy-nine dollars, the route is twelve kilometres and shipping is twelve dollars with an estimated Friday arrival. The fixture total is ninety-one dollars, including tax and shipping. Nothing here requires MCP. Shared libraries, good API documentation and an OpenAPI description can already reduce the work. What changes in our story is that Maya is speaking freely to an AI, rather than following a fixed interface that I designed in advance. Now somebody has to connect that conversation to the right operations.", "group": 0, "label": "", "timed": true, "point": null, "number": 4, "step": 3}, {"title": "Who turns Maya’s sentence<br>into the right API request?", "sub": "An endpoint URL does not describe how an AI should use it.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Who turns Maya’s sentence into the right API request?\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"40\" width=\"555\" height=\"235\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"75\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">FIXED APPLICATION<\/text><text x=\"34\" y=\"123\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">Developer picks the sequence<\/text><text x=\"34\" y=\"161\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Buttons map to known requests<\/text><text x=\"34\" y=\"199\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Code already knows the API<\/text><rect x=\"715\" y=\"40\" width=\"555\" height=\"235\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"739\" y=\"75\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">MAYA’S AI APPLICATION<\/text><text x=\"739\" y=\"123\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">“Find it. Buy it. Actually, cancel.”<\/text><text x=\"739\" y=\"161\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Choose an operation from intent<\/text><text x=\"739\" y=\"199\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Use the right inputs each time<\/text><path d=\"M590 157L690 157\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">The new integration work sits between conversation and capability.<\/text><\/svg>", "notes": "Maya might ask for a backpack, change the destination or cancel an order in the next message. The model needs a menu of things it is allowed to request and enough detail to choose among them. It also needs results that make the next decision possible. Giving it an API hostname is not the same as connecting an executable capability. The application must supply descriptions, schemas, credentials and execution machinery. Some of this is ordinary integration engineering; what makes this boundary particular to an LLM application is that the model chooses its next request from the conversation. We can build that boundary ourselves, and we are going to do exactly that.", "group": 0, "label": "", "timed": true, "point": null, "number": 5, "step": 4}, {"title": "First, teach ChatGPT<br>what the store can do.", "sub": "An API-only route: a Custom GPT action with an OpenAPI schema.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"First, teach ChatGPT what the store can do.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"35\" width=\"650\" height=\"260\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"70\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">OPENAPI ACTION · ABBREVIATED<\/text><text x=\"34\" y=\"118\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">operationId: search_products<\/text><text x=\"34\" y=\"156\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">description: Search store inventory<\/text><text x=\"34\" y=\"194\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">inputs: query, color, max_price<\/text><text x=\"34\" y=\"232\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">response: products[]<\/text><path d=\"M675 165L815 165\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"835\" y=\"80\" width=\"430\" height=\"170\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1050.0\" y=\"165.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">ChatGPT action menu<\/text><text x=\"1050.0\" y=\"195.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">Search the catalog<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">Describe an operation + its inputs + its result. Then connect an executor.<\/text><\/svg>", "notes": "For the ChatGPT version, an API-only route is a Custom GPT action described with OpenAPI and configured authentication. We describe our store-facing gateway operation: search products, what it means, which arguments it accepts and what it returns. The diagram is a shortened description, not a complete uploadable schema. ChatGPT can then map Maya’s request to the described action. A custom GPT-backed application using the OpenAI API would instead supply function definitions and its own execution loop; that is a different host implementation, not the ChatGPT product itself. Both illustrate the same boundary: describe a callable operation and arrange for something to execute it. Actual host eligibility and commerce policies must be checked before a real launch.", "group": 0, "label": "", "timed": true, "point": null, "number": 6, "step": 5}, {"title": "The model proposes.<br>Our adapter does the work.", "sub": "A tool is simply a function the AI application can request.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"The model proposes. Our adapter does the work.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"105\" width=\"290\" height=\"120\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"155.0\" y=\"165.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">ChatGPT host<\/text><text x=\"155.0\" y=\"195.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">model proposes a call<\/text><path d=\"M315 165L470 165\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"490\" y=\"105\" width=\"300\" height=\"120\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"640.0\" y=\"165.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Store adapter<\/text><text x=\"640.0\" y=\"195.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">validate + execute<\/text><path d=\"M805 165L960 165\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"980\" y=\"105\" width=\"290\" height=\"120\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1125.0\" y=\"165.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Catalog API<\/text><text x=\"1125.0\" y=\"195.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">search real stock<\/text><path d=\"M1115 240V295H155V240\" fill=\"none\" stroke=\"#26715a\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><text x=\"640\" y=\"327\" font-size=\"23\" fill=\"#26715a\" text-anchor=\"middle\" font-weight=\"450\">Product result returns to the host → model → Maya<\/text><text x=\"640\" y=\"45\" font-size=\"25\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"550\">search_products(query=&quot;carry-on&quot;, color=&quot;blue&quot;)<\/text><\/svg>", "notes": "Now we have a real call path. The model proposes search products with a query and color. The ChatGPT host sends the described action request. Our store adapter validates the inputs, calls the catalog API and returns a result. The model can use that result to answer Maya or request the next operation. This is what developers mean by a tool: a named, callable function with a purpose and defined inputs. It can read information, so a search counts as a tool. It can also change state, as placing an order does. The model is not running our backend code and is not holding our provider credentials. In a custom API host, our own application would implement the surrounding model-call loop.", "group": 0, "label": "", "timed": true, "point": null, "number": 7, "step": 6}, {"title": "Maya’s identity<br>cannot be a prompt parameter.", "sub": "The assistant needs delegated access, not a store-wide secret.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Maya’s identity cannot be a prompt parameter.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"335\" y=\"0\" width=\"555\" height=\"320\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"610\" y=\"35\" font-size=\"18\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">TRUSTED STORE BOUNDARY<\/text><rect x=\"15\" y=\"112\" width=\"250\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"140.0\" y=\"162.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Maya<\/text><text x=\"140.0\" y=\"192.0\" font-size=\"17.28395061728395\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">signs in + grants access<\/text><path d=\"M280 162L355 162\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"375\" y=\"82\" width=\"475\" height=\"160\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"612.5\" y=\"162.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Store adapter<\/text><text x=\"612.5\" y=\"192.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">verified customer + scopes<\/text><path d=\"M905 162L1000 162\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"1020\" y=\"82\" width=\"245\" height=\"160\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1142.5\" y=\"162.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Providers<\/text><text x=\"1142.5\" y=\"192.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">service credentials<\/text><text x=\"610\" y=\"278\" font-size=\"23\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">Share only the destination data needed.<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">Identity comes from verified credentials—not a customer_id suggested by the model.<\/text><\/svg>", "notes": "Before quoting a saved address or reading an order, I need to know whose data this is. Maya signs in and grants the intended access. The adapter derives her customer identity from verified credentials rather than trusting a customer identifier generated by the model. It checks whether the token permits the operation. Our server keeps its GeoRoute and ParcelQuote credentials on the trusted side and sends only the data those providers need. This is not a new problem invented by AI, and MCP will not make it disappear. But an assistant taking action on someone’s behalf makes the trust boundary especially important. A tool definition is a description of a capability; it is never proof that Maya authorized the action.", "group": 1, "label": "", "timed": true, "point": null, "number": 8, "step": 7}, {"title": "A quote is information.<br>A purchase is a commitment.", "sub": "Bind the confirmation to the actual product, total and destination.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"A quote is information. A purchase is a commitment.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"10\" width=\"490\" height=\"300\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"45\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">QUOTE Q-42<\/text><text x=\"34\" y=\"93\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">Blue carry-on backpack      $79<\/text><text x=\"34\" y=\"131\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Delivery by Friday             $12<\/text><text x=\"34\" y=\"169\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Total, including tax           $91<\/text><text x=\"34\" y=\"207\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Expires in 120 seconds<\/text><rect x=\"635\" y=\"10\" width=\"625\" height=\"70\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"947.5\" y=\"53.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Maya reviews and confirms<\/text><path d=\"M947 92L947 125\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"635\" y=\"135\" width=\"625\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"947.5\" y=\"178.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Adapter verifies quote + customer<\/text><path d=\"M947 217L947 250\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"635\" y=\"260\" width=\"625\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"947.5\" y=\"303.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">POST /orders → order 12345<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">No order is placed just because the model found a product.<\/text><\/svg>", "notes": "We found a product and shipping estimate. That does not authorize a purchase. I present the ninety-one-dollar quote with the item, destination and validity period. Maya explicitly confirms that specific checkout. The adapter verifies that the quote still exists, has not expired, belongs to Maya and matches what she confirmed. Only then does it request order creation. In this example, confirmation is a trusted host interaction linked to the quote; a model-generated confirmed equals true flag would not prove consent. We are illustrating order creation, not processing real payments. The exact checkout and consent experience depends on the host and its policies. The important design step is to separate reading a quote from committing an order.", "group": 1, "label": "", "timed": true, "point": null, "number": 9, "step": 8}, {"title": "Then Maya says:<br>“Actually, cancel it.”", "sub": "Conversation changes. Ownership and order state still govern the action.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Then Maya says: “Actually, cancel it.”\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"135\" width=\"290\" height=\"95\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"155.0\" y=\"190.5\" font-size=\"25.793650793650787\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">“Cancel my order.”<\/text><path d=\"M315 182L465 182\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"485\" y=\"135\" width=\"300\" height=\"95\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"635.0\" y=\"182.5\" font-size=\"28.36134453781512\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Check order 12345<\/text><text x=\"635.0\" y=\"212.5\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">owner + current state<\/text><path d=\"M800 182H850V65H915\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"930\" y=\"20\" width=\"340\" height=\"90\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1100.0\" y=\"65.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Not dispatched<\/text><text x=\"1100.0\" y=\"95.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">cancel once<\/text><path d=\"M800 182H850V285H915\" fill=\"none\" stroke=\"#a76524\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"930\" y=\"240\" width=\"340\" height=\"90\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1100.0\" y=\"285.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Already dispatched<\/text><text x=\"1100.0\" y=\"315.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">explain next option<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">A retried operation must not create another order or another cancellation.<\/text><\/svg>", "notes": "Maya’s follow-up gives us two more requirements. The host needs to resolve it to the right order using the conversation and verified customer context. The server then checks ownership and the current fulfilment state. Our fictional policy permits cancellation before dispatch. Once dispatched, it returns a clear refusal or next option rather than pretending cancellation succeeded. We also need retry-safe operations. If a network response is lost, repeating purchase creation with the same operation key should not buy a second backpack. A protocol request identifier alone is not a business idempotency guarantee. Cancellation status and payment reversal status must remain separate. These rules belong in the store backend regardless of how an AI calls it.", "group": 1, "label": "", "timed": true, "point": null, "number": 10, "step": 9}, {"title": "Give the model<br>a result it can use.", "sub": "Concise facts, explicit units and a clear business outcome.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Give the model a result it can use.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"30\" width=\"510\" height=\"265\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"65\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">RAW PROVIDER PAYLOAD<\/text><text x=\"34\" y=\"113\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">internal_route_ref: …<\/text><text x=\"34\" y=\"151\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">service_flags: …<\/text><text x=\"34\" y=\"189\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">debug_metadata: …<\/text><text x=\"34\" y=\"227\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Many fields Maya never needs<\/text><path d=\"M535 160L695 160\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"715\" y=\"30\" width=\"555\" height=\"265\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"739\" y=\"65\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">OUR ADAPTER RETURNS<\/text><text x=\"739\" y=\"113\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">quote_id: Q-42<\/text><text x=\"739\" y=\"151\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">total: 91 USD · tax included<\/text><text x=\"739\" y=\"189\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">arrival: Friday (estimate)<\/text><text x=\"739\" y=\"227\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">expires_in: 120 seconds<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">Relevant results help the next model decision. The adapter shapes them.<\/text><\/svg>", "notes": "An API may return a perfectly valid payload that is awkward to use in a conversation. We map provider-specific fields into the facts Maya needs: the quote identifier, currency, total, estimated arrival and expiry. We preserve the details required for the next operation rather than returning a vague success message. Failures also need meaning: quote expired, unknown address and order already dispatched should not all become something went wrong. The protocol can define a response envelope, but it cannot infer our business semantics or automatically remove irrelevant fields. We write that translation in the adapter. Treat external text as data, not as instructions that can change the assistant’s permissions or purchase rules.", "group": 1, "label": "", "timed": true, "point": null, "number": 11, "step": 10}, {"title": "Our ChatGPT integration works.<br>Now add two more AI apps.", "sub": "Three applications × four services: repeated mapping and maintenance.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Our ChatGPT integration works. Now add two more AI apps.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><path d=\"M260 95 C470 95 760 60 1005 60\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 95 C470 95 760 140 1005 140\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 95 C470 95 760 220 1005 220\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 95 C470 95 760 300 1005 300\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 195 C470 195 760 60 1005 60\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 195 C470 195 760 140 1005 140\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 195 C470 195 760 220 1005 220\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 195 C470 195 760 300 1005 300\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 295 C470 295 760 60 1005 60\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 295 C470 295 760 140 1005 140\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 295 C470 295 760 220 1005 220\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><path d=\"M260 295 C470 295 760 300 1005 300\" fill=\"none\" stroke=\"#91a7bf\" stroke-width=\"3\" stroke-dasharray=\"7 7\" /><rect x=\"5\" y=\"65\" width=\"255\" height=\"60\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"132.5\" y=\"103.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ChatGPT app<\/text><rect x=\"5\" y=\"165\" width=\"255\" height=\"60\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"132.5\" y=\"203.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Claude app<\/text><rect x=\"5\" y=\"265\" width=\"255\" height=\"60\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"132.5\" y=\"303.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Gemini app<\/text><rect x=\"1005\" y=\"30\" width=\"270\" height=\"60\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1140.0\" y=\"68.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Store catalog<\/text><rect x=\"1005\" y=\"110\" width=\"270\" height=\"60\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1140.0\" y=\"148.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">GeoRoute<\/text><rect x=\"1005\" y=\"190\" width=\"270\" height=\"60\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1140.0\" y=\"228.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ParcelQuote<\/text><rect x=\"1005\" y=\"270\" width=\"270\" height=\"60\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1140.0\" y=\"308.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Store orders<\/text><rect x=\"385\" y=\"122\" width=\"490\" height=\"90\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"630\" y=\"159\" font-size=\"25\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"550\">3 applications × 4 services<\/text><text x=\"630\" y=\"193\" font-size=\"28\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">12 custom integration paths<\/text><text x=\"640\" y=\"365\" font-size=\"23\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">Different schemas · authentication · error handling<\/text><\/svg>", "notes": "At this point we have made the API-only version work. Now a Claude-based application and a Gemini-based application want the same store operations. Each host has its own way of exposing functions, managing context and handling results or approvals. Without a shared AI-facing contract, we write or configure mappings again. The twelve paths are a simplified view of three applications reaching four services; shared gateways, OpenAPI and libraries can reduce duplication, so this is not a claim that twelve independent codebases are unavoidable. It is also a product of two counts, not exponential growth. The maintenance question is still real: how many host-specific places must change when we rename an operation, add an input or expose another capability?", "group": 1, "label": "", "timed": true, "point": null, "number": 12, "step": 11}, {"title": "Extract what every<br>AI application keeps rebuilding.", "sub": "Agree on the boundary. Keep the business implementation.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Extract what every AI application keeps rebuilding.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"10\" width=\"565\" height=\"62\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"292.5\" y=\"49.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Describe available operations<\/text><path d=\"M590 41L675 41\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"695\" y=\"10\" width=\"575\" height=\"62\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"982.5\" y=\"49.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">A common capability catalog<\/text><rect x=\"10\" y=\"88\" width=\"565\" height=\"62\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"292.5\" y=\"127.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Map call arguments to execution<\/text><path d=\"M590 119L675 119\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"695\" y=\"88\" width=\"575\" height=\"62\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"982.5\" y=\"127.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">A common call format<\/text><rect x=\"10\" y=\"166\" width=\"565\" height=\"62\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"292.5\" y=\"205.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Interpret success and failure<\/text><path d=\"M590 197L675 197\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"695\" y=\"166\" width=\"575\" height=\"62\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"982.5\" y=\"205.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">A common result envelope<\/text><rect x=\"10\" y=\"266\" width=\"1260\" height=\"70\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"640\" y=\"310\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"550\">Keep product rules, credentials and provider adapters in the store.<\/text><\/svg>", "notes": "Here is the first-principles move. We do not standardize how every shop stores inventory or how every courier prices a parcel. We standardize the things an AI application needs at the boundary. How does it find available capabilities? How does it learn their inputs? How does it invoke one and understand the result? We can give those questions a shared answer while keeping the underlying APIs. Good API schemas and reusable integration libraries remain useful; our goal is to reuse the AI-facing contract across compatible hosts. Agreeing that we need a protocol does not derive every detail of MCP mathematically. It explains why a protocol of this kind is useful. Now we can compare our requirements with the existing standard.", "group": 1, "label": "", "timed": true, "point": null, "number": 13, "step": 12}, {"title": "First agreement:<br>ask for the capability menu.", "sub": "MCP calls this tool discovery.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"First agreement: ask for the capability menu.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"105\" width=\"310\" height=\"130\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"165.0\" y=\"170.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">AI application<\/text><text x=\"165.0\" y=\"200.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">What can this store do?<\/text><path d=\"M335 170L535 170\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"555\" y=\"0\" width=\"715\" height=\"310\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"579\" y=\"35\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">SERVER-OWNED CAPABILITY CATALOG<\/text><text x=\"579\" y=\"83\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">search_products · quote_delivery<\/text><text x=\"579\" y=\"121\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">place_order · cancel_order<\/text><text x=\"579\" y=\"159\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Each: name + description + input schema<\/text><text x=\"579\" y=\"197\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Discovery method: tools/list<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">A connected client asks for the menu; the host supplies useful definitions to the model.<\/text><\/svg>", "notes": "The first agreement is discovery. A connected MCP client can ask the server for its available tools using tools slash list. Each tool provides a name, description and input schema, so the application has a defined way to obtain the menu. The host chooses which tools to make available to the model and may transform their definitions into the model provider’s format. The server must still filter or authorize capabilities appropriately, and a listed tool does not grant permission to use it. Discovery is a protocol operation, not the model guessing API URLs and not a marketplace search. Connection and capability details depend on the protocol version and host. We are focusing on the common discovery and execution concepts rather than implementing a wire protocol by hand.", "group": 2, "label": "", "timed": true, "point": null, "number": 14, "step": 13}, {"title": "Second agreement:<br>one way to request a function.", "sub": "MCP uses tools/call; the store translates the request into its APIs.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Second agreement: one way to request a function.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"25\" width=\"455\" height=\"270\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"60\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">ILLUSTRATIVE CALL FRAGMENT<\/text><text x=\"34\" y=\"108\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">method: tools/call<\/text><text x=\"34\" y=\"146\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">name: quote_delivery<\/text><text x=\"34\" y=\"184\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">arguments:<\/text><text x=\"34\" y=\"222\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">  product_id: BP-79<\/text><text x=\"34\" y=\"260\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">  destination_ref: home<\/text><path d=\"M480 160L580 160\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"600\" y=\"90\" width=\"265\" height=\"145\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"732.5\" y=\"162.5\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Store adapter<\/text><text x=\"732.5\" y=\"192.5\" font-size=\"18.441358024691358\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">calls existing HTTP APIs<\/text><path d=\"M880 160L975 160\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"995\" y=\"25\" width=\"275\" height=\"270\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1019\" y=\"60\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">RESULT FACTS<\/text><text x=\"1019\" y=\"108\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">Q-42<\/text><text x=\"1019\" y=\"146\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">$91 total<\/text><text x=\"1019\" y=\"184\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Friday estimate<\/text><text x=\"1019\" y=\"222\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">120s validity<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">The common message reaches store-specific code. The APIs remain underneath.<\/text><\/svg>", "notes": "The next agreement is invocation. The host’s MCP client sends a tools slash call request with the tool name and arguments. This is an illustrative fragment, not a complete JSON-RPC message or SDK example. Our server receives quote delivery, validates the request and calls the same catalog, routing and delivery APIs we already had. It then returns an MCP result containing the relevant quote information. A common envelope makes transport and parsing more reusable, but the store defines the actual quote fields and business errors. Request IDs associate protocol messages; our checkout idempotency key solves a different business problem. Notice that the model still proposes operations through its host. It is not directly opening a network connection to the MCP server.", "group": 2, "label": "", "timed": true, "point": null, "number": 15, "step": 14}, {"title": "That reusable boundary<br>is the MCP server.", "sub": "Different AI applications can speak the same protocol to our store.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"That reusable boundary is the MCP server.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"20\" width=\"245\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"132.5\" y=\"63.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ChatGPT<\/text><path d=\"M270 55H345V175H425\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"10\" y=\"140\" width=\"245\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"132.5\" y=\"183.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Claude app<\/text><path d=\"M270 175H345V175H425\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"10\" y=\"260\" width=\"245\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"132.5\" y=\"303.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Gemini app<\/text><path d=\"M270 295H345V175H425\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"440\" y=\"80\" width=\"365\" height=\"190\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"622.5\" y=\"175.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Store MCP server<\/text><text x=\"622.5\" y=\"205.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">shared AI-facing interface<\/text><path d=\"M820 175H900V40H995\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"1010\" y=\"5\" width=\"260\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1140.0\" y=\"48.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Catalog API<\/text><path d=\"M820 175H900V130H995\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"1010\" y=\"95\" width=\"260\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1140.0\" y=\"138.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">GeoRoute API<\/text><path d=\"M820 175H900V220H995\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"1010\" y=\"185\" width=\"260\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1140.0\" y=\"228.0\" font-size=\"27.38095238095238\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">ParcelQuote API<\/text><path d=\"M820 175H900V310H995\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"1010\" y=\"275\" width=\"260\" height=\"70\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1140.0\" y=\"318.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Orders API<\/text><text x=\"625\" y=\"320\" font-size=\"23\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"550\">Each host has an MCP client.<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">MCP is the agreement between clients and servers—not a central cloud hub.<\/text><\/svg>", "notes": "Now the label has a reason to exist. The store MCP server publishes a shared AI-facing interface over the capabilities we already built. A host is the AI application Maya uses. Its MCP client communicates with our server. Our server executes the store operation through existing adapters and APIs. ChatGPT and the other applications still have their own product behavior, permissions and supported features. The diagram assumes each host has an appropriate MCP connection configured; deployment and listing are separate tasks. In this example the store aggregates its four services behind one server. Another design could expose multiple servers. There is no universal MCP hub in the middle and no requirement that the model itself understand or speak the wire protocol.", "group": 2, "label": "", "timed": true, "point": null, "number": 16, "step": 15}, {"title": "The same agreement can<br>carry context and starting points.", "sub": "Tools, resources and prompts fit around the same conversation.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"The same agreement can carry context and starting points.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"25\" width=\"410\" height=\"200\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"60\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">PROMPTS<\/text><text x=\"34\" y=\"108\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">A saved starting request<\/text><text x=\"34\" y=\"146\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">“Help me choose a backpack”<\/text><path d=\"M215 238V265H640V285\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"435\" y=\"25\" width=\"410\" height=\"200\" rx=\"4\" fill=\"#eef0e6\" stroke=\"none\" stroke-width=\"2\"/><text x=\"459\" y=\"60\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">RESOURCES<\/text><text x=\"459\" y=\"108\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">Information to read<\/text><text x=\"459\" y=\"146\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Return policy + size guide<\/text><path d=\"M640 238V265H640V285\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"860\" y=\"25\" width=\"410\" height=\"200\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"884\" y=\"60\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">TOOLS<\/text><text x=\"884\" y=\"108\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">Functions to request<\/text><text x=\"884\" y=\"146\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Search · quote · buy · cancel<\/text><path d=\"M1065 238V265H640V285\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" /><rect x=\"350\" y=\"285\" width=\"580\" height=\"55\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"640.0\" y=\"320.5\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">One shopping conversation<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">User selects a prompt · host loads context · model proposes tool calls<\/text><\/svg>", "notes": "Our derivation began with callable functions because Maya wanted something done. MCP also lets a server expose resources and prompts. A resource is readable context, such as the return policy or size guide, which the application can load for the model. A prompt is a reusable message template the user can choose, such as help me choose a backpack. Tools perform requested functions, including read-only searches and state-changing actions. These are complementary capabilities; this picture is not a mandatory pipeline. A server can expose just tools, and host support for resources and prompts differs. We should verify the target host before relying on them. The host controls how context reaches its model and how the user experiences these capabilities.", "group": 2, "label": "", "timed": true, "point": null, "number": 17, "step": 16}, {"title": "Replay Maya’s purchase.<br>Only the connection has changed.", "sub": "The business facts and the safety checks are still ours.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"Replay Maya’s purchase. Only the connection has changed.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"122\" y=\"40\" font-size=\"28\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">01<\/text><rect x=\"10\" y=\"80\" width=\"235\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"127.5\" y=\"130.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Discover<\/text><text x=\"127.5\" y=\"160.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">tool menu<\/text><path d=\"M248 130L263 130\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><text x=\"378\" y=\"40\" font-size=\"28\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">02<\/text><rect x=\"266\" y=\"80\" width=\"235\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"383.5\" y=\"130.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Find + quote<\/text><text x=\"383.5\" y=\"160.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">$91 · Friday<\/text><path d=\"M504 130L519 130\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><text x=\"634\" y=\"40\" font-size=\"28\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">03<\/text><rect x=\"522\" y=\"80\" width=\"235\" height=\"100\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"639.5\" y=\"130.0\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Confirm<\/text><text x=\"639.5\" y=\"160.0\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">Maya approves<\/text><path d=\"M760 130L775 130\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><text x=\"890\" y=\"40\" font-size=\"28\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">04<\/text><rect x=\"778\" y=\"80\" width=\"235\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"895.5\" y=\"130.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Place order<\/text><text x=\"895.5\" y=\"160.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">#12345<\/text><path d=\"M1016 130L1031 130\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><text x=\"1146\" y=\"40\" font-size=\"28\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">05<\/text><rect x=\"1034\" y=\"80\" width=\"235\" height=\"100\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1151.5\" y=\"130.0\" font-size=\"29\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Cancel<\/text><text x=\"1151.5\" y=\"160.0\" font-size=\"21\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">state checked<\/text><rect x=\"10\" y=\"235\" width=\"1260\" height=\"75\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"640\" y=\"282\" font-size=\"27\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"550\">Host → MCP client → store server → existing APIs → result<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">Same customer journey. The AI-facing interface is reusable.<\/text><\/svg>", "notes": "Let’s replay the whole story through the common interface. The host learns the tool menu. It requests a product and delivery quote. Maya sees ninety-one dollars with an estimated Friday delivery and confirms that quote. The store creates order twelve-three-four-five after verifying identity, validity and consent. When she asks to cancel, the host identifies that order and the server checks that it belongs to her and has not dispatched. These are the same business operations we built in the API-only version. What changed is the reusable client-server interface for exposing and invoking them. The assistant still needs conversation context, and the backend still needs durable state and audit records. MCP itself is not the memory of Maya’s order.", "group": 2, "label": "", "timed": true, "point": null, "number": 18, "step": 17}, {"title": "We did not replace the APIs.<br>We extracted a shared interface.", "sub": "Expose capabilities → make them callable → reuse the contract.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"We did not replace the APIs. We extracted a shared interface.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"10\" width=\"610\" height=\"280\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"34\" y=\"45\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">MCP STANDARDIZES<\/text><text x=\"34\" y=\"93\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">Capability discovery<\/text><text x=\"34\" y=\"131\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Callable request + result formats<\/text><text x=\"34\" y=\"169\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Client ↔ server communication<\/text><rect x=\"660\" y=\"10\" width=\"610\" height=\"280\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"684\" y=\"45\" font-size=\"17\" fill=\"#195bca\" text-anchor=\"start\" font-weight=\"650\">WE STILL IMPLEMENT<\/text><text x=\"684\" y=\"93\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"550\">Service adapters + useful results<\/text><text x=\"684\" y=\"131\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Identity, consent + order rules<\/text><text x=\"684\" y=\"169\" font-size=\"25\" fill=\"#102d4b\" text-anchor=\"start\" font-weight=\"450\">Retries, monitoring + operations<\/text><text x=\"640\" y=\"365\" font-size=\"22\" fill=\"#526b85\" text-anchor=\"middle\" font-weight=\"450\">APIs expose the store. MCP makes its capabilities reusable across AI hosts.<\/text><\/svg>", "notes": "The APIs were never the mistake. They are how the store exposes its operations. We first made those operations usable by one AI application, and that required descriptions, execution, result mapping and access control. Repeating the work across hosts gave us a reason for a shared protocol. MCP standardizes a useful part of that boundary. It does not automatically make checkout safe, provider schemas consistent or every host feature identical. We still own consent, authorization, idempotency, business semantics and operations. We should measure tool latency, validation failures, provider errors and resulting order states while avoiding sensitive data in logs. For a single tightly controlled application, direct functions or an OpenAPI action may be enough. The case for MCP grows when reusable integration across compatible hosts matters.", "group": 2, "label": "", "timed": true, "point": null, "number": 19, "step": 18}, {"title": "MCP gives AI apps<br>one way to use our store.", "sub": "Discover what is available. Request a function. Receive a useful result.", "visual": "<svg viewBox=\"0 0 1280 380\" role=\"img\" aria-label=\"MCP gives AI apps one way to use our store.\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0 0L7 3L0 6\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"1.5\"/><\/marker><\/defs><rect x=\"10\" y=\"85\" width=\"310\" height=\"145\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"165.0\" y=\"157.5\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">AI applications<\/text><text x=\"165.0\" y=\"187.5\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">choose the next function<\/text><path d=\"M335 157L460 157\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"480\" y=\"85\" width=\"320\" height=\"145\" rx=\"4\" fill=\"#102d4b\" stroke=\"none\" stroke-width=\"2\"/><text x=\"640.0\" y=\"157.5\" font-size=\"29\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"650\">Store MCP server<\/text><text x=\"640.0\" y=\"187.5\" font-size=\"21\" fill=\"#faf9f5\" text-anchor=\"middle\" font-weight=\"450\">describes + routes calls<\/text><path d=\"M815 157L940 157\" fill=\"none\" stroke=\"#195bca\" stroke-width=\"3\" marker-end=\"url(#arr)\" /><rect x=\"960\" y=\"85\" width=\"310\" height=\"145\" rx=\"4\" fill=\"#e7eef8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1115.0\" y=\"157.5\" font-size=\"26.31578947368421\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"650\">Existing store APIs<\/text><text x=\"1115.0\" y=\"187.5\" font-size=\"18.13537675606641\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"450\">search · quote · buy · cancel<\/text><text x=\"165\" y=\"45\" font-size=\"18\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">MAYA’S CONVERSATION<\/text><text x=\"640\" y=\"45\" font-size=\"18\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">THE SHARED INTERFACE<\/text><text x=\"1115\" y=\"45\" font-size=\"18\" fill=\"#195bca\" text-anchor=\"middle\" font-weight=\"650\">THE BUSINESS OPERATIONS<\/text><rect x=\"10\" y=\"285\" width=\"1260\" height=\"60\" rx=\"4\" fill=\"#f4e9dc\" stroke=\"none\" stroke-width=\"2\"/><text x=\"640\" y=\"323\" font-size=\"24\" fill=\"#102d4b\" text-anchor=\"middle\" font-weight=\"550\">The store still checks identity, purchase consent and cancellation rules.<\/text><\/svg>", "notes": "We started with Maya asking her AI to buy a backpack. Our APIs already knew how to search, quote delivery, create an order and cancel one. To make that useful to an AI application, we added descriptions, defined inputs, execution code and results the model could use. When we wanted other AI apps to connect, we needed a shared interface for that work. That is where MCP fits: the host can discover the store’s capabilities and request them through a common protocol. Our existing APIs still perform the business operations. Our store still verifies who Maya is, what purchase she approved and whether her order can be cancelled. That is the takeaway: keep the store’s business logic, expose clear capabilities, and use MCP to make those capabilities available to compatible AI applications. What questions do you have?", "group": null, "label": "RECAP · QUESTIONS", "timed": false, "point": null, "number": 20, "step": null}],groups=['Expose the APIs','Make the AI work','Extract the protocol'];let current=0;const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
