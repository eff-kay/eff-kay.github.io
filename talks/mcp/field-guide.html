    "section": "03 DISTRIBUTE · CLAUDE",
    "title": "A quality label<br>is not an auth mode.",
    "subtitle": "Connection behavior and review labels are separate.",
    "body": "<svg class=\"diagram\" data-visual=\"community-verified\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Community and Verified directory labels sit above the same authenticated connector boundary.\"><defs><marker id=\"arrow-57\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"90\" y=\"45\" width=\"530\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"355\" y=\"94\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">COMMUNITY</text><text x=\"355\" y=\"130\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">directory label</text><rect x=\"820\" y=\"45\" width=\"530\" height=\"110\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1085\" y=\"94\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">VERIFIED</text><text x=\"1085\" y=\"130\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">higher-touch review</text><path d=\"M355 165V225H720V270\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-57)\"/><path d=\"M1085 165V225H720\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><rect x=\"355\" y=\"280\" width=\"730\" height=\"115\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"331.5\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">SAME CONNECTOR BOUNDARY</text><text x=\"720\" y=\"367.5\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">auth + permissions + service behavior</text></svg>",
    "notes": "Current Claude documentation distinguishes directory labels from how a connector authenticates and runs. The higher-touch verification path is assessed separately from simply connecting a working server, and the docs do not establish a guaranteed schedule. Do not promise that receiving a label changes OAuth requirements, grants extra runtime permissions or means every future version is safe. Maintain the connector regardless of its label. The exact classification process is time-sensitive; recheck the linked review documentation before presenting a definitive current-flow claim.",

  {
    "section": "03 DISTRIBUTE · CLAUDE",
    "title": "Audit what<br>the tool really does.",
    "subtitle": "Names, hints and behavior must agree.",
    "body": "<svg class=\"diagram\" data-visual=\"claude-audit-gates\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Split actions → Honest hints → Useful errors → Test in host\"><defs><marker id=\"arrow-26\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"182.25\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Split actions</text><path d=\"M334.5 205L379.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-26)\"/><rect x=\"388.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"540.75\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Honest hints</text><path d=\"M693 205L738 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-26)\"/><rect x=\"747\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"899.25\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Useful errors</text><path d=\"M1051.5 205L1096.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-26)\"/><rect x=\"1105.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1257.75\" y=\"213\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Test in host</text></svg>",
    "notes": "Current Claude checklist requires tool titles and applicable hints, and tool names no longer than sixty-four characters. It uses a conservative destructive hint for tools that modify or delete data. Interpret hints against each host's current rules rather than blindly copying labels from another platform. For custom query tools, name or link the target API. Check the actual implementation, not just metadata. All these conditions can be checked before submission. Community and Verified are different labels; current docs describe automated policy scans and selective higher-touch verification, not an approval speed guarantee.\n\nDetailed reference from the first draft: Separate reads and writes. Do not combine GET and DELETE behind one method argument. \nDescribe capability, not model behavior. No hidden instructions, favoritism or unrelated software calls. \nReturn useful failures. Validate inputs; avoid generic errors and oversized responses. \nProve every tool in Claude. Inspector + custom connector; populated reviewer account.",
    "refs": [
      "claude-review"
    ],

  {
    "section": "03 DISTRIBUTE · CLAUDE",
    "title": "The commit<br>is the release input.",
    "subtitle": "Validate the exact source that will be scanned.",
    "body": "<svg class=\"diagram\" data-visual=\"commit-release-pipeline\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A git commit passes validation, scanning, review and publication.\"><defs><marker id=\"arrow-27\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><path d=\"M90 220L1360 220\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><circle cx=\"150\" cy=\"220\" r=\"42\" fill=\"#2469e5\"/><text x=\"150\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">a1</text><circle cx=\"510\" cy=\"220\" r=\"42\" fill=\"#2469e5\"/><text x=\"510\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">b2</text><circle cx=\"870\" cy=\"220\" r=\"42\" fill=\"#2469e5\"/><text x=\"870\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">c3</text><circle cx=\"1230\" cy=\"220\" r=\"42\" fill=\"#06746e\"/><text x=\"1230\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">d4</text><text x=\"150\" y=\"130\" font-size=\"31\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Source</text><text x=\"510\" y=\"130\" font-size=\"31\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Validate</text><text x=\"870\" y=\"130\" font-size=\"31\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Scan</text><text x=\"1230\" y=\"130\" font-size=\"31\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Publish</text><rect x=\"410\" y=\"295\" width=\"200\" height=\"55\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"510\" y=\"333\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">one commit</text><rect x=\"760\" y=\"295\" width=\"220\" height=\"55\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"870\" y=\"333\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">one outcome</text></svg>",
    "notes": "A plugin folder is its own submission. The connected GitHub account must have push access, and validation applies to one commit. After a push, validate again. The source may remain private during validation/review with the required access and source-upload consent, but must become public before the directory listing goes live. Do not include confidential code accidentally. The default publication path involves an Anthropic reviewer even after checks pass; auto-publish behavior depends on the setting Anthropic applies. Maintain source, version, README, license and transparent data handling.\n\nDetailed reference from the first draft: 01 Repository Manifest + components \n→ 02 Local check claude plugin validate \n→ 03 Portal Source + data handling \n→ 04 Scan Per-commit findings \n→ 05 Publish According to review setting \n\nPassing checks does not automatically mean live. Publish settings and reviewer holds still apply.",
    "refs": [
      "claude-plugin"
    ],

  {
    "section": "03 DISTRIBUTE · CURSOR",
    "title": "Cursor: source<br>to marketplace.",

    "body": "<svg class=\"diagram\" data-visual=\"cursor-submission-road\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A valid manifest, public repository, local test and submitted URL lead to Cursor review.\"><defs><marker id=\"arrow-59\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><defs><marker id=\"arrow-58\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"182.25\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Manifest</text><path d=\"M334.5 205L379.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-58)\"/><rect x=\"388.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"540.75\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Public repo</text><path d=\"M693 205L738 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-58)\"/><rect x=\"747\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"899.25\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Local test</text><path d=\"M1051.5 205L1096.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-58)\"/><rect x=\"1105.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1257.75\" y=\"213\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Submit URL</text></svg>",
    "notes": "Cursor documents supported plugin formats, including an Agent Plugins root manifest and the Cursor-specific manifest location. Use the format that matches the components you need, keep referenced paths valid and test locally. The submission portal accepts the public repository link and the Cursor team reviews the plugin. Include a clear README and configuration guidance. Direct MCP installation and a reviewed marketplace listing are separate routes. For a multi-plugin repository or variable-based setup, follow the current reference rather than assuming a package from another host imports unchanged.",

  {
    "section": "03 DISTRIBUTE · COPILOT",

    "body": "<svg class=\"diagram\" data-visual=\"enterprise-install-boundary\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A gallery or manual configuration crosses organization policy and user trust before the server is enabled.\"><defs><marker id=\"arrow-61\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"150\" width=\"310\" height=\"130\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"195\" y=\"223\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Gallery / config</text><path d=\"M360 215L530 215\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-61)\"/><rect x=\"545\" y=\"35\" width=\"370\" height=\"365\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"730\" y=\"125\" font-size=\"24\" fill=\"#b7d0fa\" text-anchor=\"middle\" font-weight=\"550\">ORGANIZATION</text><text x=\"730\" y=\"220\" font-size=\"41\" fill=\"#edf4fc\" text-anchor=\"middle\" font-weight=\"550\">POLICY</text><text x=\"730\" y=\"315\" font-size=\"22\" fill=\"#b7d0fa\" text-anchor=\"middle\" font-weight=\"550\">enabled + permitted</text><path d=\"M925 215L1090 215\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-61)\"/><rect x=\"1100\" y=\"150\" width=\"300\" height=\"130\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1250\" y=\"209\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">User trust</text><text x=\"1250\" y=\"245\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">install + connect</text></svg>",
    "notes": "For GitHub Copilot, MCP can be configured through supported registry/gallery routes or manually, and organization-managed subscriptions have relevant policy controls. A server can be discoverable yet unusable for someone whose organization has disabled or restricted MCP. Keep this different from server-side authorization: an administrator allowing an integration does not give every user access to every downstream object. Document both the installation prerequisite and the expected sign-in flow. Verify the exact supported IDE surface and current policy setting rather than making a universal statement about all Copilot environments.",

    "title": "Choose the route<br>your users can adopt.",
    "subtitle": "Direct install, marketplace and registry serve different jobs.",
    "body": "<svg class=\"diagram\" data-visual=\"distribution-map\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"One server branches to IDE direct setup, a reviewed marketplace and registry metadata.\"><defs><marker id=\"arrow-28\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"155\" width=\"300\" height=\"130\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"200\" y=\"214\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">YOUR MCP</text><text x=\"200\" y=\"250\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">stable endpoint</text><path d=\"M360 220H520V80H700\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-28)\"/><path d=\"M520 220H700\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-28)\"/><path d=\"M520 220V360H700\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-28)\"/><rect x=\"710\" y=\"35\" width=\"650\" height=\"90\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1035\" y=\"74\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Direct configuration</text><text x=\"1035\" y=\"110\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">known users</text><rect x=\"710\" y=\"175\" width=\"650\" height=\"90\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1035\" y=\"214\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Reviewed marketplace</text><text x=\"1035\" y=\"250\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">discovery + trust</text><rect x=\"710\" y=\"315\" width=\"650\" height=\"90\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1035\" y=\"354\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Registry metadata</text><text x=\"1035\" y=\"390\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">machine-readable catalog</text></svg>",
    "notes": "For Cursor, choose the supported Agent Plugins or Cursor-specific format, test locally and submit a public repository. For Copilot, separate the GitHub MCP Registry gallery from manual setup and enterprise enablement. For the official MCP Registry, hosted remote-only servers publish endpoint metadata; packaged servers also need package ownership verification. A self-hosted Claude marketplace is a distribution route for an audience that already trusts you; it is different from Anthropic directory listing. Keep install instructions host-specific and avoid a single universal configuration blob.\n\nDetailed reference from the first draft: Route How to ship What it does not imply \nCursor marketplace Valid plugin manifest + public repo; submit at marketplace/publish Direct MCP config is not marketplace approval \nCopilot / VS Code Registry discovery or manual MCP configuration Organization policy may still block usage \nOfficial MCP Registry Publish server.json; prove namespace/package ownership Metadata hosting is not host approval \nYour own marketplace Publish a host-supported catalog + install docs No automatic listing in an official directory",

    "section": "03 DISTRIBUTE · REGISTRY",
    "title": "Publish the metadata.",
    "subtitle": "Operate the service yourself.",
    "body": "<svg class=\"diagram\" data-visual=\"registry-publishing\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The package registry stores code; the MCP registry stores metadata; your host runs the service.\"><defs><marker id=\"arrow-29\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"130\" width=\"350\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"225\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Package registry</text><text x=\"225\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">artifact</text><rect x=\"545\" y=\"130\" width=\"350\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"199\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP Registry</text><text x=\"720\" y=\"235\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">metadata</text><rect x=\"1040\" y=\"130\" width=\"350\" height=\"150\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1215\" y=\"199\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Your service</text><text x=\"1215\" y=\"235\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">runtime</text><path d=\"M410 205L535 205\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-29)\"/><path d=\"M905 205L1030 205\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-29)\"/><text x=\"720\" y=\"375\" font-size=\"27\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">server.json + ownership proof</text></svg>",
    "notes": "Explain that these commands are reference material, not commands the deck executes. The CLI reads its target registry from the login context. Namespace authentication and artifact ownership are separate checks. For an npm package, the quickstart uses mcpName in package metadata; other artifact types have their own proof. Never publish tokens in server.json. Remote-only metadata avoids an unnecessary package but does not remove the need to run a reliable service. The official Registry remains documented as preview at research time.\n\nDetailed reference from the first draft: # Generate and inspect server.json\nmcp-publisher init\n\n# Authenticate for your namespace\nmcp-publisher login github\n\n# Validate and publish metadata\nmcp-publisher publish \nPackaged Verify the artifact\nPublish to npm/PyPI/etc.; add the package-specific ownership proof.\n\n\nRemote-only Verify the identity\nUse your authorized namespace and stable remote endpoint metadata.\n\n\n\nInspect generated configuration and current schema first. No registry publication was performed for this talk.",
    "refs": [

      "registry-cli"
    ],

  {
    "section": "03 DISTRIBUTE · REGISTRY",
    "title": "Prove two<br>different identities.",
    "subtitle": "Namespace ownership and artifact ownership.",
    "body": "<svg class=\"diagram\" data-visual=\"ownership-dual-proof\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Namespace proof and package proof are distinct inputs to registry publication.\"><defs><marker id=\"arrow-60\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><circle cx=\"300\" cy=\"170\" r=\"80\" fill=\"#2469e5\"/><text x=\"300\" y=\"179\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">NAME</text><circle cx=\"1140\" cy=\"170\" r=\"80\" fill=\"#06746e\"/><text x=\"1140\" y=\"179\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">CODE</text><text x=\"300\" y=\"310\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Namespace proof</text><text x=\"1140\" y=\"310\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Artifact proof</text><path d=\"M390 170L600 170\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-60)\"/><path d=\"M1050 170L840 170\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-60)\"/><rect x=\"610\" y=\"110\" width=\"220\" height=\"120\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"164\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">PUBLISH</text><text x=\"720\" y=\"200\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">metadata</text><text x=\"720\" y=\"415\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Remote-only servers publish endpoint metadata.</text></svg>",
    "notes": "Separate permission to publish under a registry namespace from proof that the referenced package belongs to that publisher. The exact verification mechanism depends on the namespace and artifact ecosystem. The npm quickstart uses a package metadata claim tied to the MCP registry name; other package types use their documented mechanism. A remote-only server does not need a package artifact just to publish its endpoint metadata, but still needs an authorized namespace and a functioning service. Registry metadata publication is not a security endorsement or public listing approval from every host.",

    "section": "03 DISTRIBUTE · OWNERSHIP",
    "title": "Access is not<br>redistribution permission.",
    "subtitle": "Explain whose content and APIs your product serves.",
    "body": "<svg class=\"diagram\" data-visual=\"rights-provenance\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Public source content crosses an authorization and rights checkpoint before appearing in a product tool.\"><defs><marker id=\"arrow-62\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"135\" width=\"360\" height=\"160\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"220\" y=\"209\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">PUBLIC DOCS</text><text x=\"220\" y=\"245\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">available to read</text><path d=\"M410 215L605 215\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-62)\"/><rect x=\"615\" y=\"90\" width=\"330\" height=\"250\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"780\" y=\"209\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">RIGHTS</text><text x=\"780\" y=\"245\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">authorized use</text><path d=\"M955 215L1085 215\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-62)\"/><rect x=\"1095\" y=\"135\" width=\"310\" height=\"160\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1250\" y=\"209\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">YOUR TOOL</text><text x=\"1250\" y=\"245\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">first-party value</text></svg>",
    "notes": "For a documentation integration, public availability is not enough to establish every right to copy, index, redistribute or proxy content. Explain the product’s first-party value, how source permissions are obtained and which source policies apply. The current OpenAI guidelines reject integrations that primarily function as unofficial third-party pass-through connectors, so do this analysis before building a broad aggregator. Claude also expects owned or legitimately proxied APIs and appropriate service identity. Do not turn the supplied 300+ site count into a claim that all source permissions or every directory approval have been independently audited here.",
    "refs": [
      "openai-policy",
      "claude-review"
    ],

  {
    "section": "03 DISTRIBUTE · ACTIVATION",
    "title": "Distribution ends<br>at useful work.",
    "subtitle": "Approval and activation are different outcomes.",
    "body": "<div class=\"funnel v-funnel\"><div style=\"width:100%\"><b>DISCOVER</b><span>clear promise</span></div><div style=\"width:86%\"><b>CONNECT</b><span>working consent</span></div><div style=\"width:72%\"><b>FIRST VALUE</b><span>useful evidence</span></div><div style=\"width:58%\"><b>RETURN</b><span>reliable results</span></div></div>",
    "notes": "This funnel is an original recommendation, not a platform analytics feature claim. A listing gives a distribution opportunity, not guaranteed discovery. Use task-specific example prompts and direct installation documentation. Instrument your own connection and tool boundaries with disclosed, minimized telemetry. You may not see every directory impression or final host answer. Look for successful activation using agreed definitions and controlled feedback, not raw call volume. Test the empty workspace and first consent flow. Keep public docs and status/support paths current after launch.\n\nDetailed reference from the first draft: DISCOVER Clear listing + specific prompts \nCONNECT OAuth completion + useful empty state \nFIRST VALUE One successful, evidenced workflow \nRETURN Reliable results + current source data \n\nApproval ≠ placement ≠ installation ≠ useful work. Keep these metrics separate.",

  {
    "section": "SYNTHESIS",
    "title": "Keep the insight.<br>Refresh the mechanics.",
    "subtitle": "From the May blog to the current protocol and portals.",
    "body": "<svg class=\"diagram\" data-visual=\"blog-delta\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The blog thesis remains; protocol lifecycle, registration and distribution details change.\"><defs><marker id=\"arrow-31\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"115\" width=\"400\" height=\"180\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"245\" y=\"199\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">THE INSIGHT</text><text x=\"245\" y=\"235\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">hard work surrounds the handler</text><path d=\"M455 205L645 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-31)\"/><rect x=\"655\" y=\"35\" width=\"730\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1020\" y=\"76.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Protocol lifecycle</text><text x=\"1020\" y=\"112.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">connection → request</text><rect x=\"655\" y=\"175\" width=\"730\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1020\" y=\"216.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Client registration</text><text x=\"1020\" y=\"252.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">test supported mechanisms</text><rect x=\"655\" y=\"315\" width=\"730\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1020\" y=\"356.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Distribution</text><text x=\"1020\" y=\"392.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">follow current portal contracts</text></svg>",
    "notes": "The word tokenless describes onboarding UX, not a cryptographic design with no tokens. The existing blog has a strong product and operations narrative. Its transport and registration details need explicit version context now. This slide makes that editorial decision transparent. We have not edited the blog or the SEO worktree. Before the talk, refresh high-change facts: submission packaging, supported authentication, local-server distribution paths, verification labels and supported host protocol versions. Avoid attaching a review-time promise to this deck.\n\nDetailed reference from the first draft: May 2026 blog framing Current treatment in this talk \nRemote hosting reduces setup friction Retained as the narrative foundation \ninitialize / optional session example Earlier protocol era; current core is stateless \nDynamic registration for onboarding Check CIMD, pre-registration and DCR compatibility \nServer works through a public tunnel Necessary integration evidence, not directory acceptance \nTokenless onboarding No manual token paste; access tokens still exist \nResearch checked November 1, 2026. Recheck portal and host behavior before presenting.",

      "release",
      "auth"
    ],

  {
    "section": "SYNTHESIS",
    "title": "Read-only still needs<br>a trust model.",
    "subtitle": "Docsalot’s documentation example.",
    "body": "<svg class=\"diagram\" data-visual=\"docs-provenance-pipeline\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Sources → Ingestion → Tools → Answer\"><defs><marker id=\"arrow-10\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"182.25\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Sources</text><text x=\"182.25\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">rights + version</text><path d=\"M334.5 205L379.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-10)\"/><rect x=\"388.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"540.75\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Ingestion</text><text x=\"540.75\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">parse + index</text><path d=\"M693 205L738 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-10)\"/><rect x=\"747\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"899.25\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Tools</text><text x=\"899.25\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">search + fetch</text><path d=\"M1051.5 205L1096.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-10)\"/><rect x=\"1105.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1257.75\" y=\"199\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Answer</text><text x=\"1257.75\" y=\"235\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">citable evidence</text></svg><p class=\"visual-takeaway\">Isolation · freshness · provenance</p>",
    "notes": "Use this section to reconnecting the three topics to my work. Read-only lowers mutation risk; it does not remove data leakage, stale documentation, prompt injection in retrieved content, or redistribution obligations. Show an example failure: the tool returns version-one authentication instructions for a version-two question. Every transport span is green, but the workflow failed. The response needs source provenance and an unambiguous version. Ingestion and tool serving are separate operational systems. We should use this case to show judgment without claiming directory approvals, customer counts, or measured reliability we have not established.\n\nDetailed reference from the first draft: 01 Sources Authorized docs + versions \n→ 02 Ingestion Fetch → parse → index \n→ 03 MCP tools Search → fetch source \n→ 04 AI host Answer with evidence \n\nGovernance Per-site isolation; source rights; bounded fetch.\nObservability Index age; empty results; citation correctness.\nDistribution One clear workflow; honest data ownership.\n\nRead-only still requires source rights, isolation, freshness and provenance.",
    "refs": [],

    "subtitle": "Useful → safe → operable → reviewable.",
    "body": "<svg class=\"diagram\" data-visual=\"release-staircase\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Four ascending release gates.\"><defs><marker id=\"arrow-11\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"80\" y=\"280\" width=\"310\" height=\"115\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"105\" y=\"324\" font-size=\"22\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">01</text><text x=\"105\" y=\"366\" font-size=\"34\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Useful</text><path d=\"M390 338L410 270\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-11)\"/><rect x=\"415\" y=\"215\" width=\"310\" height=\"115\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"440\" y=\"259\" font-size=\"22\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">02</text><text x=\"440\" y=\"301\" font-size=\"34\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Safe</text><path d=\"M725 273L745 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-11)\"/><rect x=\"750\" y=\"150\" width=\"310\" height=\"115\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"775\" y=\"194\" font-size=\"22\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">03</text><text x=\"775\" y=\"236\" font-size=\"34\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Operable</text><path d=\"M1060 208L1080 140\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-11)\"/><rect x=\"1085\" y=\"85\" width=\"310\" height=\"115\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1110\" y=\"129\" font-size=\"22\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">04</text><text x=\"1110\" y=\"171\" font-size=\"34\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Reviewable</text></svg>",
    "notes": "This is the practical closing checklist, not a platform-mandated process. First prove usefulness with a small workflow. Second prove the boundary with denial and cross-tenant tests. Third prove operation by observing a deliberately injected downstream failure and rolling back a release. Fourth prove reviewability in the target host using a clean account and the exact release package. A local success is not hosted auth success; hosted success is not host compatibility; host compatibility is not directory approval. Teams can do some work in parallel, but none of these gates disappears because the server generated quickly.\n\nDetailed reference from the first draft: 01 Useful\nOne real workflow. Small schema. Bounded result.\n\n02 Safe\nTenant checks. Least privilege. Failure and retry semantics.\n\n03 Operable\nTrace. Evaluate. Alert. Owner and rollback.\n\n04 Reviewable\nFixtures. Credentials. Platform package and evidence.\n\n\nLOCAL PROOF → HOSTED PROOF → HOST PROOF → DIRECTORY PROOF",

function indices(){return slides.map((_,i)=>i).filter(i=>route==='all'||slides[i].core)}
function replay(){const e=document.querySelector('.slide.active');e.classList.remove('replaying');void e.offsetWidth;e.classList.add('replaying');}
function fit(){const v=$('#viewport');document.documentElement.style.setProperty('--stage-scale',Math.min(v.clientWidth/1600,v.clientHeight/900));}
function go(i,updateHash=true){if(i<0||i>=slides.length)return;if(!slides[i].core&&route==='core'){route='all';$('#mode').value=route;}current=i;document.querySelectorAll('.slide').forEach((e,n)=>{e.classList.toggle('active',n===i);e.setAttribute('aria-hidden',n===i?'false':'true');e.classList.toggle('print-hide',route==='core'&&!slides[n].core)});const s=slides[i],list=indices();$('#counter').textContent=`${list.indexOf(i)+1} / ${list.length}`;$('#progress').style.width=`${(list.indexOf(i)+1)/list.length*100}%`;$('#notes').innerHTML=`<div class="note-meta">${s.section} · EXPANDED EDITION</div><h2>${plain(s.title)}</h2>${notesMarkup(s.notes)}<h3>Sources</h3>${s.refs.map(id=>`<p><a href="${sourceById[id].url}" target="_blank" rel="noopener">${sourceById[id].title}</a></p>`).join('')||'<p>Authored framing / engineering recommendation.</p>'}<h3>Next</h3><p>${plain(slides[list[list.indexOf(i)+1]]?.title||'End of route')}</p>`;if(updateHash)history.replaceState(null,'',`#${s.anchor||'slide-'+(i+1)}`);renderPresenter();if($('#overview').classList.contains('open'))overview();fit();}
function move(d){const a=indices();go(a[Math.max(0,Math.min(a.length-1,a.indexOf(current)+d))]);}
function overview(){const o=$('#overview');o.innerHTML=`<h2>${route==='core'?'Essential story · '+indices().length+' slides':'Expanded visual deck · '+slides.length+' slides'}</h2><div class="overview-grid">${indices().map(i=>`<button data-go="${i}" class="${i===current?'selected':''}"><small>${String(i+1).padStart(2,'0')} · ${slides[i].section}</small><strong>${plain(slides[i].title)}</strong><span class="appendix-tag">${slides[i].visualKind.replaceAll('-',' ').toUpperCase()}</span></button>`).join('')}</div>`;o.querySelectorAll('button').forEach(b=>b.onclick=()=>{o.classList.remove('open');go(+b.dataset.go)});}
function toggleNotes(){$('#notes').classList.toggle('open');document.body.classList.toggle('with-notes');fit();}
function openPresenter(){presenterWindow=window.open('','mcp-talk-presenter','width=1150,height=850');if(!presenterWindow){$('#notes').classList.add('open');document.body.classList.add('with-notes');fit();return;}presenterWindow.document.write(`<!doctype html><html><head><title>MCP talk · Presenter</title><style>body{margin:0;padding:36px;background:#edf2f8;color:#102d50;font:19px/1.6 'Avenir Next',sans-serif}h1{font-size:38px;line-height:1.15}h2{font-size:21px}#meta{color:#2469e5;font-size:15px}#time{float:right;font-size:28px;font-variant-numeric:tabular-nums}button{padding:12px 22px;font:inherit;background:#102d50;color:#edf2f8;border:0;margin-right:10px;border-radius:3px}#nextTitle{color:#56708a}a{color:#2469e5}.hint{font-size:14px;color:#56708a}</style></head><body><span id="time">00:00</span><div id="meta"></div><h1 id="title"></h1><div id="script"></div><h2>Next slide</h2><p id="nextTitle"></p><div id="sources"></div><button id="pPrev">← Previous</button><button id="pNext">Next →</button><p class="hint">Keep this window on your laptop. Present the slide window to the audience.</p></body></html>`);presenterWindow.document.close();presenterWindow.document.querySelector('#pPrev').onclick=()=>move(-1);presenterWindow.document.querySelector('#pNext').onclick=()=>move(1);presenterWindow.onkeydown=e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1)}if(e.key==='ArrowLeft')move(-1)};renderPresenter();}
function renderPresenter(){if(!presenterWindow||presenterWindow.closed)return;const d=presenterWindow.document,s=slides[current],a=indices();d.querySelector('#meta').textContent=`${current+1} · ${s.section} · expanded edition`;d.querySelector('#title').textContent=plain(s.title);d.querySelector('#script').innerHTML=notesMarkup(s.notes);d.querySelector('#nextTitle').textContent=plain(slides[a[a.indexOf(current)+1]]?.title||'End of route');d.querySelector('#sources').innerHTML=s.refs.map(id=>`<p><a target="_blank" rel="noopener" href="${sourceById[id].url}">${sourceById[id].title} ↗</a></p>`).join('');d.querySelector('#time').textContent=$('#clock').textContent;}
$('#replayButton').onclick=replay;
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#notesButton').onclick=toggleNotes;$('#overviewButton').onclick=()=>{overview();$('#overview').classList.toggle('open')};$('#mode').onchange=e=>{route=e.target.value;if(route==='core'&&!slides[current].core)current=0;go(current)};$('#presenterButton').onclick=openPresenter;$('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};$('#timerButton').onclick=()=>{timerRunning=!timerRunning;lastTick=performance.now();$('#timerButton').textContent=timerRunning?'Pause':'Start'};$('#resetButton').onclick=()=>{elapsed=0;lastTick=performance.now();$('#clock').textContent='00:00';renderPresenter()};setInterval(()=>{if(timerRunning){const now=performance.now();elapsed+=now-lastTick;lastTick=now;}const s=Math.floor(elapsed/1000);$('#clock').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;renderPresenter()},500);$('#printButton').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key.toLowerCase()==='r')replay();if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='o')$('#overviewButton').click();if(e.key.toLowerCase()==='f')$('#fullscreen').click();if(e.key==='Home')go(indices()[0]);if(e.key==='End')go(indices().at(-1));if(e.key==='Escape'){$('#overview').classList.remove('open');if($('#notes').classList.contains('open'))toggleNotes();}});function fromHash(){const h=decodeURIComponent(location.hash.slice(1));const i=slides.findIndex((s,n)=>(s.anchor||`slide-${n+1}`)===h);if(i>=0)go(i,false);else go(0,false)}window.addEventListener('hashchange',fromHash);window.addEventListener('resize',fit);document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const target=slides.findIndex(s=>s.anchor===a.hash.slice(1));if(target>=0)go(target)}});fromHash();fit();window.addEventListener('beforeprint',()=>{document.querySelectorAll('.only-print').forEach(e=>e.style.display=document.body.classList.contains('print-notes')&&(route==='all'||slides[+e.dataset.slide].core)?'block':'none')});
</script></body></html>
