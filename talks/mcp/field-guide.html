  {
    "section": "02 OPERATE · GOVERNANCE",
    "title": "Approval can<br>become stale.",
    "subtitle": "Check authority at execution time.",
    "body": "<svg class=\"diagram\" data-visual=\"revocation-race\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Approval occurs, permissions are revoked before execution, and the final check denies the action.\"><defs><marker id=\"arrow-52\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><path d=\"M90 220L1360 220\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><circle cx=\"180\" cy=\"220\" r=\"38\" fill=\"#06746e\"/><text x=\"180\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">✓</text><circle cx=\"720\" cy=\"220\" r=\"38\" fill=\"#bb7c14\"/><text x=\"720\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">−</text><circle cx=\"1260\" cy=\"220\" r=\"38\" fill=\"#b44735\"/><text x=\"1260\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">×</text><text x=\"180\" y=\"130\" font-size=\"32\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Approved</text><text x=\"720\" y=\"130\" font-size=\"32\" fill=\"#bb7c14\" text-anchor=\"middle\" font-weight=\"550\">Access revoked</text><text x=\"1260\" y=\"130\" font-size=\"30\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">Recheck → deny</text><rect x=\"150\" y=\"310\" width=\"1140\" height=\"65\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"353\" font-size=\"28\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">Bind approval to action + target + current authority.</text></svg>",
    "notes": "A confirmation is not a forever grant. Between preview, approval and execution, a document can move, a user can lose access or a job can resume much later. Bind approvals to the exact intended action and target and re-evaluate current authorization before sensitive execution. For durable jobs, define whether permission is checked at admission, at each step and at result read, based on the threat model. Do not blindly replay a captured approval token after scope changes. This slide shows a recommended time-of-check/time-of-use safeguard, not a protocol-provided transaction guarantee.",

    "section": "02 OPERATE",
    "title": "Observe the whole operation.",
    "subtitle": "Example timings · not production measurements.",
    "body": "<div class=\"trace v-trace\"><div class=\"trace-title\">Request → result <span>980 ms</span></div><div class=\"trace-row\"><span>Auth</span><div class=\"track\"><div style=\"margin-left:0%;width:14%\">140 ms</div></div></div><div class=\"trace-row\"><span>Policy</span><div class=\"track\"><div style=\"margin-left:14%;width:8%\">80 ms</div></div></div><div class=\"trace-row\"><span>Index</span><div class=\"track\"><div style=\"margin-left:22%;width:59%\">580 ms</div></div></div><div class=\"trace-row\"><span>Shape</span><div class=\"track\"><div style=\"margin-left:81%;width:19%\">180 ms</div></div></div></div><p class=\"visual-takeaway\">Separate transport, tool and workflow outcomes.</p>",
    "notes": "These timings are an illustration, not Docsalot measurements. Use a server trace that follows the request through policy, downstream calls and response shaping. Record protocol/client version, tool name, schema version, duration and outcome where appropriate; redact secrets and avoid logging raw prompts by default. Keep internal trace IDs in your telemetry, not model-visible tool results. Track transport failure separately from a tool-level isError and a semantically wrong answer. You cannot infer final user satisfaction from server logs alone; use controlled end-to-end evaluations and privacy-respecting feedback. Bound metric-label cardinality.\n\nDetailed reference from the first draft: Illustrative request waterfall 980 ms total \nEdge + auth 140 ms\n\n\nPolicy + validation 80 ms\n\n\nSearch index 580 ms\n\n\nResult shaping 180 ms\n\n\n\nTransport status · latency · timeouts Tool isError · validation · retries Outcome right source · freshness · completion",

  {
    "section": "02 OPERATE · OBSERVABILITY",
    "title": "Three meanings<br>of “success.”",
    "subtitle": "They answer different questions.",
    "body": "<svg class=\"diagram\" data-visual=\"success-nesting\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Transport success, tool success, and workflow success are separate checks.\"><defs><marker id=\"arrow-19\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"30\" width=\"1350\" height=\"370\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"90\" y=\"90\" font-size=\"25\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">TRANSPORT</text><rect x=\"365\" y=\"125\" width=\"970\" height=\"230\" rx=\"5\" fill=\"#cedef5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"410\" y=\"185\" font-size=\"25\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">TOOL</text><rect x=\"755\" y=\"220\" width=\"520\" height=\"90\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1015\" y=\"275\" font-size=\"29\" fill=\"#eaf2fc\" text-anchor=\"middle\" font-weight=\"550\">WORKFLOW</text><text x=\"110\" y=\"325\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Did it arrive?</text><text x=\"415\" y=\"320\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Did it execute?</text><text x=\"1015\" y=\"378\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Was it useful?</text></svg>",
    "notes": "Do not multiply percentages as if the layers were independent. Define denominators and exclusions before setting SLOs. A no-results response may be correct for an unsupported query, so interpret no-hit rate with test cases and query categories. Keep high-cardinality tenant and request identifiers out of metric labels; use access-controlled traces for investigation. Sample responsibly and retain only what your policy discloses. Trace context may be absent across a third-party host boundary; start a server trace when needed rather than inventing end-to-end visibility.\n\nDetailed reference from the first draft: Layer Question Measure \nTransport Did the exchange complete? Timeouts, HTTP failures, protocol failures \nTool Did this operation complete correctly? isError, dependency failure, validation errors \nWorkflow Did the user get the intended result? Curated eval success, provenance, feedback \nWatch Reliability\np95/p99 latency; auth-loop rate; dependency error rate.\n\n\nWatch Retrieval quality\nNo-hit rate; source freshness; wrong-version citations.\n\n\n\nServer-only telemetry cannot observe an entire host conversation. Use explicit evaluations for end-to-end claims.\n\nVisual walkthrough: The nesting is conceptual; it does not encode measured probabilities or statistical independence. A transport exchange can succeed while the tool returns an error. A tool can succeed while a retrieved document answers the wrong version.",

    ],

    "section": "02 OPERATE · OBSERVABILITY",
    "title": "Find the failing layer.",
    "subtitle": "Start with the symptom, then branch.",
    "body": "<svg class=\"diagram\" data-visual=\"triage-tree\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Failure triage branches into connection, tool execution or result quality.\"><defs><marker id=\"arrow-45\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"530\" y=\"20\" width=\"380\" height=\"85\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"70.5\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">BAD USER OUTCOME</text><path d=\"M720 115V165H240V220\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-45)\"/><path d=\"M720 165V220\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-45)\"/><path d=\"M720 165H1200V220\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-45)\"/><rect x=\"55\" y=\"230\" width=\"370\" height=\"100\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"240\" y=\"274\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">No exchange</text><text x=\"240\" y=\"310\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">transport / auth</text><rect x=\"535\" y=\"230\" width=\"370\" height=\"100\" rx=\"5\" fill=\"#f4ead6\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"274\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Call failed</text><text x=\"720\" y=\"310\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">validation / dependency</text><rect x=\"1015\" y=\"230\" width=\"370\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1200\" y=\"274\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Wrong answer</text><text x=\"1200\" y=\"310\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">source / version / relevance</text><text x=\"240\" y=\"400\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Network evidence</text><text x=\"720\" y=\"400\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Server trace</text><text x=\"1200\" y=\"400\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Workflow evaluation</text></svg>",
    "notes": "Use this tree to prevent an HTTP-only diagnosis. First determine whether a request reached the service and whether auth discovery completed. Then inspect whether tool execution returned an application error, timed out or failed downstream. If execution succeeded but the answer is wrong, inspect source version, freshness, retrieval quality and the host’s interpretation through a controlled evaluation. The server cannot observe the full host conversation by default. Correlate evidence only where safely available and avoid logging raw conversations just to make debugging convenient. Record denominators and expected behavior before calling an error-rate chart meaningful.",

    ],

    "section": "02 OPERATE · OBSERVABILITY",
    "title": "Observe without<br>copying the conversation.",
    "subtitle": "Minimize telemetry at collection time.",
    "body": "<svg class=\"diagram\" data-visual=\"telemetry-sieve\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A privacy filter drops secrets and raw conversation data while retaining bounded operational signals.\"><defs><marker id=\"arrow-46\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"60\" width=\"360\" height=\"135\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"225\" y=\"121.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">REQUEST</text><text x=\"225\" y=\"157.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">sensitive context possible</text><path d=\"M415 125L625 125\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-46)\"/><path d=\"M640 40H935L855 210V315H720V210Z\" fill=\"#0b2546\"/><text x=\"787\" y=\"125\" font-size=\"30\" fill=\"#edf4fc\" text-anchor=\"middle\" font-weight=\"550\">FILTER</text><path d=\"M950 125L1070 125\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-46)\"/><rect x=\"1080\" y=\"60\" width=\"320\" height=\"135\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1240\" y=\"121.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">TELEMETRY</text><text x=\"1240\" y=\"157.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">tool · duration · outcome</text><path d=\"M785 325L785 365\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\"  marker-end=\"url(#arrow-46)\"/><text x=\"785\" y=\"405\" font-size=\"24\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">DROP SECRETS + RAW CHAT</text></svg>",
    "notes": "Define allowed telemetry fields before capture. Prefer tool name, deployment/schema version, duration, a bounded error category and operational outcome; add caller context only where necessary, disclosed and access-controlled. Do not log access tokens, authorization codes, credentials or raw conversation history. An internal trace identifier can help your own investigation, but it usually does not belong in model-visible results. Set retention, sampling and access controls. These are recommended observability practices; they do not mean a specific host forwards trace context or that the server can observe model reasoning.",

    "section": "02 OPERATE · RELIABILITY",
    "title": "Protect the service<br>from one noisy tenant.",
    "subtitle": "Admission and fairness come before exhaustion.",
    "body": "<svg class=\"diagram\" data-visual=\"fair-queue\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Separate tenant queues feed a bounded worker pool.\"><defs><marker id=\"arrow-47\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"40\" y=\"95\" font-size=\"22\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">TENANT A</text><rect x=\"215\" y=\"55\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"310\" y=\"55\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"405\" y=\"55\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"500\" y=\"55\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><path d=\"M600 87L850 215\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-47)\"/><text x=\"40\" y=\"220\" font-size=\"22\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">TENANT B</text><rect x=\"215\" y=\"180\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"310\" y=\"180\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"405\" y=\"180\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"500\" y=\"180\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><path d=\"M600 212L850 215\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-47)\"/><text x=\"40\" y=\"345\" font-size=\"22\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">TENANT C</text><rect x=\"215\" y=\"305\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#779acb\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"310\" y=\"305\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#779acb\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"405\" y=\"305\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#779acb\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"500\" y=\"305\" width=\"65\" height=\"65\" rx=\"5\" fill=\"#779acb\" stroke=\"none\" stroke-width=\"2\"/><path d=\"M600 337L850 215\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-47)\"/><rect x=\"865\" y=\"140\" width=\"500\" height=\"150\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1115\" y=\"209\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">BOUNDED WORKERS</text><text x=\"1115\" y=\"245\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">quota + deadline + backpressure</text></svg>",
    "notes": "A small read-only tool can still generate expensive queries or a thundering herd. Bound input size, per-tenant concurrency, queue depth, execution time and output size. Fair scheduling is an application choice; this queue diagram is a recommended pattern rather than protocol behavior. Decide whether excess work is rejected, delayed or routed to an async job. Return actionable capacity errors and apply retry backoff rather than encouraging all clients to retry immediately. Track queue wait separately from execution latency. Protect a shared downstream dependency with a global budget as well as tenant-level limits.",

  {
    "section": "02 OPERATE",
    "title": "Timeout means<br>“outcome unknown.”",
    "subtitle": "Recover state before repeating work.",
    "body": "<svg class=\"diagram\" data-visual=\"async-state-machine\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Accepted to working to completed; input, failure or cancellation are possible branches.\"><defs><marker id=\"arrow-6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"110\" width=\"300\" height=\"120\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"180\" y=\"164\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">ACCEPTED</text><text x=\"180\" y=\"200\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">durable handle</text><path d=\"M330 170L530 170\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-6)\"/><rect x=\"540\" y=\"110\" width=\"320\" height=\"120\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"700\" y=\"164\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">WORKING</text><text x=\"700\" y=\"200\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">owned + bounded</text><path d=\"M860 170L1080 170\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-6)\"/><rect x=\"1090\" y=\"110\" width=\"320\" height=\"120\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1250\" y=\"164\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">COMPLETED</text><text x=\"1250\" y=\"200\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">stored result</text><path d=\"M700 230L700 330\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-6)\"/><rect x=\"220\" y=\"335\" width=\"300\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"370\" y=\"380.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">INPUT REQUIRED</text><rect x=\"570\" y=\"335\" width=\"260\" height=\"75\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"700\" y=\"380.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">FAILED</text><rect x=\"880\" y=\"335\" width=\"300\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1030\" y=\"380.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">CANCELLED</text><path d=\"M700 300H370V330\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-6)\"/><path d=\"M700 300H1030V330\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-6)\"/></svg>",
    "notes": "Imagine publish_docs committed but the response disappeared. A blind retry can publish twice. Use an application-defined idempotency key scoped to actor, operation and payload; return the stored outcome for the same request. Persist long work before acknowledging acceptance. The current Tasks extension lets an opted-in client poll a durable handle, and cancellation is cooperative. Hosts without it need a deliberately designed job interface. Enforce ownership on every status and result read. Put bounded retries with jitter around transient failures, not validation errors. A disconnected HTTP stream is not evidence that business work rolled back.\n\nDetailed reference from the first draft: ACCEPTED persist job + dedupe key \n→ WORKING deadline + worker lease \n→ COMPLETED persist result \n↳ INPUT REQUIRED &nbsp;&nbsp; ↳ FAILED &nbsp;&nbsp; ↳ CANCELLED\n\nA Extension-aware host\nUse MCP Tasks only when supported; poll the durable handle.\n\n\nB Compatible fallback\nExpose explicit start / status / result tools; treat starting work as a write.\n\n\n\nApp-defined idempotency ≠ JSON-RPC request ID. Cancellation does not undo a committed side effect.",
    "refs": [
      "tasks"
    ],

  {
    "section": "02 OPERATE · ASYNC",
    "title": "The response vanished.<br>Did the write commit?",
    "subtitle": "Look up the outcome before retrying.",
    "body": "<svg class=\"diagram\" data-visual=\"unknown-outcome-timeline\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A write commits before the response is lost; deduplication resolves the uncertainty.\"><defs><marker id=\"arrow-20\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><path d=\"M80 220L1370 220\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><circle cx=\"160\" cy=\"220\" r=\"27\" fill=\"#2469e5\"/><text x=\"160\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">1</text><circle cx=\"500\" cy=\"220\" r=\"27\" fill=\"#06746e\"/><text x=\"500\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">2</text><circle cx=\"840\" cy=\"220\" r=\"27\" fill=\"#b44735\"/><text x=\"840\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">3</text><circle cx=\"1210\" cy=\"220\" r=\"27\" fill=\"#2469e5\"/><text x=\"1210\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">4</text><text x=\"160\" y=\"145\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Request</text><text x=\"500\" y=\"145\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Commit</text><text x=\"840\" y=\"145\" font-size=\"28\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">Response lost</text><text x=\"1210\" y=\"145\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Lookup</text><path d=\"M850 290Q1030 410 1210 290\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-20)\"/><text x=\"1040\" y=\"395\" font-size=\"24\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">Same operation key</text></svg>",
    "notes": "This is an application reliability pattern. Exactly-once side effects are not supplied by JSON-RPC IDs or a task handle. A deduplication record needs an atomic relationship with the business write where possible; otherwise use a transactional outbox or reconciliation strategy. Define retention for keys so late retries are understood. A read may be retry-safe but expensive, so rate limits still matter. A write may be naturally idempotent, but a publish/send operation generally needs stronger safeguards. Retries must fit the overall deadline.\n\nDetailed reference from the first draft: What happened What you know Safe next move \nTimeout before response Commit status unknown Look up idempotency record / job status \n429 or transient upstream failure Capacity or temporary dependency problem Bounded retry with backoff + jitter \nInvalid arguments / denied access Request cannot run as supplied Return actionable error; do not retry unchanged \nCancel requested Stop requested, not rollback proven Report actual state; reconcile side effects \nWorker crash after commit Ack may be missing Deduplicate; persist outcome; reconcile \nBind a dedupe key to principal + operation + payload hash. Reject conflicting reuse.",

    "section": "02 OPERATE · ASYNC",
    "title": "Choose the execution model.",
    "subtitle": "Duration and host support decide the path.",
    "body": "<svg class=\"diagram\" data-visual=\"async-decision-tree\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Short work returns a result; long work uses supported Tasks or an explicit job interface.\"><defs><marker id=\"arrow-48\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><polygon points=\"720,20 935,110 720,200 505,110\" fill=\"#0b2546\"/><text x=\"720\" y=\"119\" font-size=\"28\" fill=\"#edf4fc\" text-anchor=\"middle\" font-weight=\"550\">LONG WORK?</text><path d=\"M505 110H240V245\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-48)\"/><path d=\"M935 110H1190V245\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-48)\"/><text x=\"360\" y=\"95\" font-size=\"20\" fill=\"#06746e\" text-anchor=\"start\" font-weight=\"550\">NO</text><text x=\"1050\" y=\"95\" font-size=\"20\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">YES</text><rect x=\"50\" y=\"255\" width=\"380\" height=\"125\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"240\" y=\"311.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Return result</text><text x=\"240\" y=\"347.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">bounded synchronous call</text><rect x=\"1000\" y=\"255\" width=\"380\" height=\"125\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1190\" y=\"311.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Tasks supported?</text><text x=\"1190\" y=\"347.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">extension or job tools</text><path d=\"M995 315H750\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-48)\"/><text x=\"730\" y=\"305\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"end\" font-weight=\"550\">Negotiate</text><text x=\"730\" y=\"345\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"end\" font-weight=\"550\">then choose</text></svg>",
    "notes": "Do not choose async solely because the server can implement it. First estimate execution and intermediary deadlines. Bounded fast retrieval can return synchronously. If work can outlive a request, check the actual host’s extension support and use a durable task handle only through a compatible contract. Otherwise define explicit application job tools for start, status and result, with accurate side-effect annotations. Starting persistent work is a write even when the eventual artifact is a read-like report. Enforce job ownership, TTL, quotas and cancellation semantics independently of the transport.",
    "refs": [

    ],

  {
    "section": "02 OPERATE · ASYNC",
    "title": "Return a durable handle.",
    "subtitle": "Async work outlives the connection.",
    "body": "<svg class=\"sequence\" viewBox=\"0 0 1100 370\" role=\"img\" aria-label=\"Sequence diagram: Call + capability; Persist + enqueue; Task handle; Poll status; Result when terminal\"><defs><marker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"50\" y=\"24\" text-anchor=\"start\" class=\"lane-title\">Host</text><line x1=\"50\" y1=\"45\" x2=\"50\" y2=\"360\" class=\"lifeline\"/><text x=\"550\" y=\"24\" text-anchor=\"middle\" class=\"lane-title\">MCP server</text><line x1=\"550\" y1=\"45\" x2=\"550\" y2=\"360\" class=\"lifeline\"/><text x=\"1050\" y=\"24\" text-anchor=\"end\" class=\"lane-title\">Worker / store</text><line x1=\"1050\" y1=\"45\" x2=\"1050\" y2=\"360\" class=\"lifeline\"/><g class=\"event\" style=\"--order:0\"><line x1=\"50\" y1=\"83\" x2=\"550\" y2=\"83\" marker-end=\"url(#arrowhead)\"/><rect x=\"220.3\" y=\"59\" width=\"159.39999999999998\" height=\"23\" rx=\"3\"/><text x=\"300\" y=\"76\" text-anchor=\"middle\">Call + capability</text></g><g class=\"event\" style=\"--order:1\"><line x1=\"550\" y1=\"136\" x2=\"1050\" y2=\"136\" marker-end=\"url(#arrowhead)\"/><rect x=\"720.3\" y=\"112\" width=\"159.39999999999998\" height=\"23\" rx=\"3\"/><text x=\"800\" y=\"129\" text-anchor=\"middle\">Persist + enqueue</text></g><g class=\"event\" style=\"--order:2\"><line x1=\"550\" y1=\"189\" x2=\"50\" y2=\"189\" marker-end=\"url(#arrowhead)\"/><rect x=\"244.9\" y=\"165\" width=\"110.19999999999999\" height=\"23\" rx=\"3\"/><text x=\"300\" y=\"182\" text-anchor=\"middle\">Task handle</text></g><g class=\"event\" style=\"--order:3\"><line x1=\"50\" y1=\"242\" x2=\"550\" y2=\"242\" marker-end=\"url(#arrowhead)\"/><rect x=\"244.9\" y=\"218\" width=\"110.19999999999999\" height=\"23\" rx=\"3\"/><text x=\"300\" y=\"235\" text-anchor=\"middle\">Poll status</text></g><g class=\"event\" style=\"--order:4\"><line x1=\"550\" y1=\"295\" x2=\"50\" y2=\"295\" marker-end=\"url(#arrowhead)\"/><rect x=\"208\" y=\"271\" width=\"184\" height=\"23\" rx=\"3\"/><text x=\"300\" y=\"288\" text-anchor=\"middle\">Result when terminal</text></g></svg>",
    "notes": "Tasks in the July-era spec are an extension, not a feature every client must implement. The host opts in through per-request capability metadata and the server advertises support. A server decides whether to return a task. Polling retrieves terminal results; input_required can pause for input. Do not assume older tasks/result APIs are the current shape. A fallback start/status/result API is your own tool design and its state machine must be documented. Protect task status and result access with the same principal/tenant checks as the initiating operation.\n\nDetailed reference from the first draft: [Sequence diagram] Authorize task IDs. Enforce TTL and quotas. Cooperative cancellation may arrive after a side effect.\n\nVisual walkthrough: Use the current Tasks extension only when both client and server support it. The stored application job and authorization checks remain your responsibility.",

      "tasks"
    ],

  {
    "section": "02 OPERATE · ASYNC",
    "title": "Store the outcome<br>behind the operation key.",
    "subtitle": "A retry should find the same work.",
    "body": "<svg class=\"diagram\" data-visual=\"idempotency-ledger\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A repeated operation key and matching payload returns the stored outcome; conflicting payload is rejected.\"><defs><marker id=\"arrow-49\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"35\" y=\"60\" width=\"400\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"235\" y=\"118\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">operation key + payload</text><path d=\"M445 110L635 110\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-49)\"/><rect x=\"650\" y=\"30\" width=\"740\" height=\"340\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"690\" y=\"90\" font-size=\"21\" fill=\"#b8cfee\" text-anchor=\"start\" font-weight=\"550\">IDEMPOTENCY RECORD</text><text x=\"695\" y=\"155\" font-size=\"29\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">principal + operation</text><text x=\"695\" y=\"220\" font-size=\"29\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">payload hash</text><text x=\"695\" y=\"285\" font-size=\"29\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">state + stored result</text><path d=\"M1070 385H240V180\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-49)\"/><text x=\"620\" y=\"420\" font-size=\"27\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">Same request → same outcome</text></svg>",
    "notes": "The key is application-defined and should be scoped to the authenticated principal and operation. Store a canonical payload hash so accidental reuse with different arguments produces a conflict instead of the wrong result. Record in-progress and terminal states; concurrent duplicate requests need an atomic claim or equivalent coordination. For writes, relate the record atomically to the business action where possible. Define retention and late-retry behavior. A request ID only correlates wire messages and does not supply these semantics. The diagram is a recommended reliability design, not a complete transaction implementation.",

  {
    "section": "02 OPERATE · ASYNC",
    "title": "Commit the handoff<br>with the business write.",
    "subtitle": "A transactional outbox reduces the crash gap.",
    "body": "<svg class=\"diagram\" data-visual=\"transactional-outbox\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A database transaction contains the business row and outbox event; a worker processes the durable event.\"><defs><marker id=\"arrow-50\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"55\" y=\"40\" width=\"735\" height=\"330\" rx=\"5\" fill=\"#e5edfa\" stroke=\"#b9cbe0\" stroke-width=\"2\"/><text x=\"95\" y=\"90\" font-size=\"23\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">ONE DATABASE TRANSACTION</text><rect x=\"100\" y=\"145\" width=\"290\" height=\"135\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"245\" y=\"206.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Business row</text><text x=\"245\" y=\"242.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">committed state</text><rect x=\"450\" y=\"145\" width=\"290\" height=\"135\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"595\" y=\"206.5\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Outbox event</text><text x=\"595\" y=\"242.5\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">durable handoff</text><path d=\"M800 210L1015 210\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-50)\"/><rect x=\"1025\" y=\"145\" width=\"350\" height=\"135\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1200\" y=\"206.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Worker</text><text x=\"1200\" y=\"242.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">retry + deduplicate</text><text x=\"720\" y=\"420\" font-size=\"25\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">At-least-once delivery still needs idempotent effects.</text></svg>",
    "notes": "This is a standard application reliability pattern recommended for the gap between a committed database write and external job delivery. Save the business change and an outbox event in the same local database transaction. A worker then reads committed events and dispatches or processes them. Crashes can still cause repeated delivery, so downstream effects need deduplication or idempotency. Do not label this exactly-once execution. Some systems use a different durable queue or workflow engine; choose a design that fits the actual consistency and transaction boundaries. Retain reconciliation for effects that cannot be included in a transaction.",

  {
    "section": "02 OPERATE · RELIABILITY",
    "title": "Stop amplifying<br>a failing dependency.",
    "subtitle": "Bound retries; probe recovery.",
    "body": "<svg class=\"diagram\" data-visual=\"circuit-breaker\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Circuit breaker moves from closed to open on repeated failures, then probes in half-open state.\"><defs><marker id=\"arrow-51\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><circle cx=\"250\" cy=\"205\" r=\"105\" fill=\"#06746e\"/><text x=\"250\" y=\"214\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">CLOSED</text><circle cx=\"720\" cy=\"205\" r=\"105\" fill=\"#b44735\"/><text x=\"720\" y=\"214\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">OPEN</text><circle cx=\"1190\" cy=\"205\" r=\"105\" fill=\"#0b2546\"/><text x=\"1190\" y=\"214\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">HALF-OPEN</text><path d=\"M365 205L600 205\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\"  marker-end=\"url(#arrow-51)\"/><path d=\"M835 205L1070 205\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-51)\"/><text x=\"485\" y=\"145\" font-size=\"23\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">failures</text><text x=\"960\" y=\"145\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">cooldown</text><path d=\"M1190 90Q720 -15 250 90\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-51)\"/><text x=\"720\" y=\"45\" font-size=\"22\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">successful probe</text><path d=\"M1190 325Q955 440 720 325\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\"  marker-end=\"url(#arrow-51)\"/><text x=\"955\" y=\"425\" font-size=\"22\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">failed probe</text></svg>",
    "notes": "This diagram is a recommended protection pattern around a flaky downstream service. Closed means normal requests flow while failures are tracked; open means fail fast for a bounded interval; half-open allows limited probes to see whether recovery is real. Combine the breaker with timeouts, bounded exponential backoff and concurrency limits. A breaker is not a replacement for capacity planning or a permission check. Do not retry malformed requests or denied access. Choose thresholds and cooldowns from observed behavior rather than copying arbitrary numbers from a slide. Report degraded service clearly and preserve useful partial or cached results only where the contract permits them.",
    "refs": [],

    "title": "Show the failure<br>and the recovery.",
    "subtitle": "A fixture-based demo is easier to trust.",
    "body": "<svg class=\"diagram\" data-visual=\"failure-demo-storyboard\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Three storyboard panels: a request succeeds, a dependency fails, recovery returns a result.\"><defs><marker id=\"arrow-30\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"65\" width=\"410\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"45\" y=\"65\" width=\"410\" height=\"40\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"69\" y=\"95\" font-size=\"19\" fill=\"#f0f5ff\" text-anchor=\"start\" font-weight=\"550\">01  REQUEST</text><circle cx=\"250\" cy=\"205\" r=\"52\" fill=\"#2469e5\"/><text x=\"250\" y=\"214\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">→</text><text x=\"250\" y=\"300\" font-size=\"26\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Known fixture</text><rect x=\"515\" y=\"65\" width=\"410\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"515\" y=\"65\" width=\"410\" height=\"40\" rx=\"5\" fill=\"#b44735\" stroke=\"none\" stroke-width=\"2\"/><text x=\"539\" y=\"95\" font-size=\"19\" fill=\"#f0f5ff\" text-anchor=\"start\" font-weight=\"550\">02  FAILURE</text><circle cx=\"720\" cy=\"205\" r=\"52\" fill=\"#b44735\"/><text x=\"720\" y=\"214\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">×</text><text x=\"720\" y=\"300\" font-size=\"26\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Injected timeout</text><rect x=\"985\" y=\"65\" width=\"410\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"985\" y=\"65\" width=\"410\" height=\"40\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1009\" y=\"95\" font-size=\"19\" fill=\"#f0f5ff\" text-anchor=\"start\" font-weight=\"550\">03  RECOVERY</text><circle cx=\"1190\" cy=\"205\" r=\"52\" fill=\"#06746e\"/><text x=\"1190\" y=\"214\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">✓</text><text x=\"1190\" y=\"300\" font-size=\"26\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Stored outcome</text></svg>",
    "notes": "This is an optional demo plan, not an implemented MCP demo bundled with the deck. To add it later, build a local mock service and run the same three prompts against a pinned host/client. Show the trace and final result side by side. Make a dependency fail on purpose; do not disable security controls to create a smoother performance. A fixture-based recording can show the failure and recovery without depending on an unpredictable live OAuth flow. The current deck's diagrams are explanatory, not captured production traffic.\n\nDetailed reference from the first draft: 01 Fixture Small authorized docs set \n→ 02 Happy path Find correct v2 guide \n→ 03 Injected failure Index timeout / expired token \n→ 04 Recovery Typed error + bounded retry \n→ 05 Evidence Trace + expected result \n\nUse a recording or a local fixture. Never put reviewer credentials or real user documents on screen.",

    "section": "03 DISTRIBUTE",
    "title": "One endpoint.<br>Many distribution contracts.",
    "subtitle": "Connection, listing and approval are separate.",
    "body": "<svg class=\"diagram\" data-visual=\"ecosystem-orbit\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"MCP connects to OpenAI, Claude, Cursor, Copilot, Registry\"><defs><marker id=\"arrow-7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><path d=\"M634.4049135334362 195.27864045000422L358.5985238078416 184.46304564688106\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><path d=\"M667.0993272936774 284.7213595499958L496.64160412886025 313.036954353119\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><path d=\"M772.9006727063226 284.7213595499958L943.3583958711398 313.036954353119\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><path d=\"M805.5950864665638 195.27864045000422L1081.4014761921585 184.46304564688103\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><path d=\"M720 140L720 105\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><circle cx=\"720\" cy=\"220\" r=\"87\" fill=\"#2469e5\"/><text x=\"720\" y=\"229\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP</text><rect x=\"595\" y=\"23\" width=\"250\" height=\"84\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"73\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">OpenAI</text><rect x=\"1046.751845240198\" y=\"130.10236587188314\" width=\"250\" height=\"84\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1171.751845240198\" y=\"180.10236587188314\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Claude</text><rect x=\"874.1979948389247\" y=\"303.39763412811686\" width=\"250\" height=\"84\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"999.1979948389247\" y=\"353.39763412811686\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Cursor</text><rect x=\"315.80200516107533\" y=\"303.39763412811686\" width=\"250\" height=\"84\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"440.80200516107533\" y=\"353.39763412811686\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Copilot</text><rect x=\"143.248154759802\" y=\"130.10236587188317\" width=\"250\" height=\"84\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"268.248154759802\" y=\"180.10236587188317\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Registry</text></svg>",
    "notes": "The practical distinction is between connecting and being discoverable. A user can often connect directly before any public directory listing exists, subject to host and organization policy. OpenAI publishes plugins for ChatGPT and Codex. Claude treats a remote connector and a workflow plugin as distinct submissions; submit your own remote server separately even if a plugin references it. Cursor has reviewed plugins and direct MCP configuration. Copilot can use registry entries or manual configuration. The official MCP Registry publishes metadata; it is not universal product approval. Never call your listing “approved everywhere.”\n\nDetailed reference from the first draft: MCP your stable endpoint \nChatGPT / Codex Plugin package → OpenAI review \nClaude Connector + optional plugin bundle \nCursor Plugin repository or direct configuration \nCopilot / VS Code Registry discovery or manual setup \nOfficial MCP Registry Metadata publication + namespace proof",

  {
    "section": "03 DISTRIBUTE · LANDSCAPE",
    "title": "Connect first.<br>Earn discovery separately.",
    "subtitle": "Installation and listing are different paths.",
    "body": "<svg class=\"diagram\" data-visual=\"parallel-distribution-lanes\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A direct connection lane and a reviewed directory lane both lead to a usable integration.\"><defs><marker id=\"arrow-53\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"55\" y=\"75\" font-size=\"22\" fill=\"#06746e\" text-anchor=\"start\" font-weight=\"550\">DIRECT</text><rect x=\"55\" y=\"125\" width=\"310\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"210\" y=\"188\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Install URL</text><path d=\"M375 180L540 180\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-53)\"/><rect x=\"550\" y=\"125\" width=\"310\" height=\"110\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"705\" y=\"188\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Authenticate</text><path d=\"M870 180L1050 180\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-53)\"/><rect x=\"1060\" y=\"125\" width=\"330\" height=\"110\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1225\" y=\"188\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Use capability</text><text x=\"55\" y=\"310\" font-size=\"22\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">DIRECTORY</text><rect x=\"55\" y=\"345\" width=\"310\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"210\" y=\"390.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Package</text><path d=\"M375 382L540 382\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-53)\"/><rect x=\"550\" y=\"345\" width=\"310\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"705\" y=\"390.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Review</text><path d=\"M870 382L1050 382\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-53)\"/><rect x=\"1060\" y=\"345\" width=\"330\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1225\" y=\"390.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Discover</text></svg>",
    "notes": "Direct configuration lets a known user connect a compatible service, subject to host eligibility and organization policy. A public listing adds a discovery and trust route, with platform-specific requirements. It does not make the underlying service more authorized or more compatible by itself. Test the direct workflow early so review is not the first time someone signs in from a clean environment. Then prepare distribution-specific packaging and evidence. A self-hosted marketplace can serve a known audience without official directory placement, but it does not transfer an official approval signal.",
    "refs": [

      "claude-code"
    ],

  {
    "section": "03 DISTRIBUTE · OPENAI",
    "title": "OpenAI: package to publish.",
    "subtitle": "Each stage produces reviewable evidence.",
    "body": "<svg class=\"diagram\" data-visual=\"openai-submission-track\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Identity → ZIP → MCP scan → Review → Publish\"><defs><marker id=\"arrow-21\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"146.4\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Identity</text><path d=\"M262.8 205L307.8 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-21)\"/><rect x=\"316.8\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"433.20000000000005\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">ZIP</text><path d=\"M549.6 205L594.6 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-21)\"/><rect x=\"603.6\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">MCP scan</text><path d=\"M836.4000000000001 205L881.4000000000001 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-21)\"/><rect x=\"890.4000000000001\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1006.8000000000001\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Review</text><path d=\"M1123.2 205L1168.2 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-21)\"/><rect x=\"1177.2\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1293.6000000000001\" y=\"213\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Publish</text></svg>",
    "notes": "Use the current Plugins portal at platform.openai.com/plugins. Confirm the owning organization and project, verification and Apps Management Write. Include the MCP in the initial package rather than starting a skills-only listing and expecting to attach it later. Keep all secrets out of the archive. Complete the public HTTPS connection and portal-specified domain challenge. Resolve required validation/setup failures, supply reviewer access and test evidence, then submit. Approval is separate from publishing. The portal's current behavior and requirements win over a screenshot in this talk.\n\nDetailed reference from the first draft: 01 Prepare Verified identity + access \n→ 02 Upload ZIP Manifest + MCP config \n→ 03 Connect + scan HTTPS + domain proof \n→ 04 Review Cases + credentials + video \n→ 05 Publish After approval \n\nPackage changes Metadata and skills need a new ZIP.\nHosted tool changes Continuously scanned; preserve the live contract.",

    ],

    "section": "03 DISTRIBUTE · OPENAI",
    "title": "The package<br>declares the capability.",
    "subtitle": "Keep configuration and secrets separate.",
    "body": "<svg class=\"diagram\" data-visual=\"package-exploded-view\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A plugin archive contains metadata, MCP connection configuration, optional skills and assets; credentials stay outside.\"><defs><marker id=\"arrow-54\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"55\" y=\"155\" width=\"330\" height=\"130\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"220\" y=\"214\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">PLUGIN ZIP</text><text x=\"220\" y=\"250\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">reviewable package</text><path d=\"M395 220L580 220\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-54)\"/><rect x=\"640\" y=\"30\" width=\"650\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"965\" y=\"75.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Manifest</text><rect x=\"672\" y=\"125\" width=\"650\" height=\"75\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"997\" y=\"170.5\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP configuration</text><rect x=\"704\" y=\"220\" width=\"650\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1029\" y=\"265.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Optional skills</text><rect x=\"736\" y=\"315\" width=\"650\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1061\" y=\"360.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Brand assets</text><text x=\"120\" y=\"390\" font-size=\"30\" fill=\"#b44735\" text-anchor=\"start\" font-weight=\"550\">No secrets.</text></svg>",
    "notes": "Use the package structure and schema required by the current OpenAI guide. This exploded view is a conceptual inventory rather than a manifest file reference. Include the intended MCP connection in the initial package and keep reusable source under version control. Public metadata, assets and skills should match the product being reviewed. Reviewer credentials belong in private review details, not configuration headers or the archive. Validate all referenced paths and avoid undeclared local dependencies. Hosted server changes and package metadata changes can follow different update checks, so keep their release evidence distinguishable.",

  {
    "section": "03 DISTRIBUTE · OPENAI",
    "title": "Check blockers early.",
    "subtitle": "Policy, auth and ownership shape the implementation.",
    "body": "<svg class=\"diagram\" data-visual=\"submission-checkpoints\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Four constraints surround the release candidate.\"><defs><marker id=\"arrow-23\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"510\" y=\"155\" width=\"420\" height=\"130\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"214\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">RELEASE CANDIDATE</text><text x=\"720\" y=\"250\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">one reproducible workflow</text><rect x=\"70\" y=\"45\" width=\"320\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"230\" y=\"100.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Metadata</text><rect x=\"1050\" y=\"45\" width=\"320\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1210\" y=\"100.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Authentication</text><rect x=\"70\" y=\"300\" width=\"320\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"230\" y=\"355.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Data handling</text><rect x=\"1050\" y=\"300\" width=\"320\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1210\" y=\"355.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">API ownership</text><path d=\"M390 100L500 185\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-23)\"/><path d=\"M1050 100L940 185\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-23)\"/><path d=\"M390 345L500 255\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-23)\"/><path d=\"M1050 345L940 255\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-23)\"/></svg>",
    "notes": "OpenAI's current guidelines say annotation justifications are no longer required; old forum posts may say otherwise. Distinguish that from the requirement that the values themselves be accurate. Do not configure a protected server as unauthenticated or embed a bearer header to evade a portal limitation. The current portal rejects nonempty server headers for public submission. A schema accepting an API-key declaration does not mean the submission UI can complete that authentication. These constraints are a reason to investigate distribution before finalizing an API surface.\n\nDetailed reference from the first draft: Area Current guidance Engineering response \nAnnotations Explicit readOnly, destructive and openWorld booleans Audit behavior; avoid optimistic labels \nAPI ownership Unofficial third-party pass-through connectors not accepted Establish first-party value and legitimate rights \nAuthentication Portal supports no-auth / OAuth / mixed; no API-key input flow Confirm supported auth before packaging \nPrivacy Minimize collection; published policy and user controls Keep raw chats and secrets out of tools \nReview access Dedicated working test account and realistic data Keep credentials private and usable",
    "refs": [
      "openai-policy",
      "openai-submit"
    ],

  {
    "section": "03 DISTRIBUTE",
    "title": "Review the contract<br>before the submission.",
    "subtitle": "Three recurring failure classes.",
    "body": "<svg class=\"diagram\" data-visual=\"failure-triad\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Hidden capability, broken replay and untrusted behavior.\"><defs><marker id=\"arrow-9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><circle cx=\"250\" cy=\"130\" r=\"53\" fill=\"#b44735\"/><text x=\"250\" y=\"139\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">!</text><text x=\"250\" y=\"260\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Hidden capability</text><text x=\"250\" y=\"320\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">generic executor</text><circle cx=\"715\" cy=\"130\" r=\"53\" fill=\"#bb7c14\"/><text x=\"715\" y=\"139\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">×</text><text x=\"715\" y=\"260\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Broken replay</text><text x=\"715\" y=\"320\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">auth + empty fixtures</text><circle cx=\"1180\" cy=\"130\" r=\"53\" fill=\"#0b2546\"/><text x=\"1180\" y=\"139\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">?</text><text x=\"1180\" y=\"260\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Untrusted behavior</text><text x=\"1180\" y=\"320\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">instructions + data flow</text></svg>",
    "notes": "Separate a documented rejection rule from our engineering prediction. Claude explicitly rejects catch-all tools that combine safe and unsafe HTTP methods. Both ecosystems expect accurate behavior and no model-manipulating descriptions. OpenAI rejects unofficial third-party pass-through connectors under its current guidelines; ownership and authorization deserve attention when your product retrieves other people's docs. For Docsalot, public availability alone does not establish permission to distribute third-party content. Explain the first-party product value and source rights. There is no rejection-rate dataset here and no guaranteed review time. Fix the exact finding rather than renaming the same capability.\n\nDetailed reference from the first draft: 01 Hidden capability Generic executor, mixed read/write, misleading hints.\n\n02 Broken replay Unusable account, empty fixtures, auth or discovery failure.\n\n03 Untrusted behavior Prompt manipulation, undisclosed data transfer, unclear API rights.\n\n\nFIX BEHAVIOR → UPDATE METADATA → RE-RUN SCENARIOS → RESCAN → RESUBMIT",
    "refs": [
      "claude-review",
      "openai-policy"
    ],
    "seconds": 0,
    "appendix": false,
    "theme": "light",
    "visualKind": "failure-triad",
    "core": true,
    "edition": "visual",
    "anchor": "scene-47"
  },
  {
    "section": "03 DISTRIBUTE · EVIDENCE",
    "title": "The test case<br>is the review unit.",
    "subtitle": "Prompt → expected tool → expected outcome.",
    "body": "<svg class=\"diagram\" data-visual=\"test-scenario-board\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Positive examples prove supported behavior; negative cases prove boundaries.\"><defs><marker id=\"arrow-22\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"30\" width=\"630\" height=\"340\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"770\" y=\"30\" width=\"630\" height=\"340\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"80\" y=\"85\" font-size=\"20\" fill=\"#06746e\" text-anchor=\"start\" font-weight=\"550\">POSITIVE</text><text x=\"810\" y=\"85\" font-size=\"20\" fill=\"#b44735\" text-anchor=\"start\" font-weight=\"550\">NEGATIVE</text><text x=\"90\" y=\"160\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">✓  Find v2 guide</text><text x=\"90\" y=\"232\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">✓  Fetch source</text><text x=\"90\" y=\"304\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">✓  Valid no-match</text><text x=\"820\" y=\"160\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">×  Private site</text><text x=\"820\" y=\"232\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">×  Internal URL</text><text x=\"820\" y=\"304\" font-size=\"30\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">×  Delete request</text></svg>",
    "notes": "Do not pad a submission with features the product does not have. Expand positive scenarios using actual supported inputs: version disambiguation, site disambiguation, fetching, pagination if supported, and a valid no-match result. The three positives on screen illustrate format rather than satisfying the full five-case requirement. Include expected tool names and expected results, not only a vague “works.” Separate negative test expectations from a model's free-form answer: the server must deny forbidden operations regardless of model behavior. Record a video against the same fixture and release.\n\nDetailed reference from the first draft: Case type Prompt / scenario Expected behavior \nPositive Find v2 authentication guide search_docs; correct version and source \nPositive Fetch the selected document get_doc; bounded canonical content \nPositive No matching guide exists Clear no-match result; no invented document \nNegative Read a private site without permission Deny before retrieval; no existence leak \nNegative Fetch an arbitrary internal-network URL Reject unsupported destination \nNegative Delete the documentation site No destructive capability on read-only surface \nThese are illustrative cases. OpenAI’s five positive cases still need five distinct, supported workflows or scenarios.\n\nVisual walkthrough: These examples illustrate a review format. Preserve the detailed test-case requirements and additional scenarios in notes; do not imply this board alone meets a portal’s complete submission requirements.",
    "refs": [
      "openai-submit"
    ],

  {
    "section": "03 DISTRIBUTE · EVIDENCE",
    "title": "Walk in as<br>a brand-new user.",
    "subtitle": "The reviewer journey is a product test.",
    "body": "<svg class=\"diagram\" data-visual=\"reviewer-journey\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A clean reviewer account signs in, selects a populated fixture, runs a prompt and verifies evidence.\"><defs><marker id=\"arrow-55\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"75\" width=\"285\" height=\"255\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><circle cx=\"187\" cy=\"145\" r=\"34\" fill=\"#2469e5\"/><text x=\"187\" y=\"154\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">1</text><text x=\"187\" y=\"235\" font-size=\"32\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Sign in</text><path d=\"M335 205L390 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-55)\"/><rect x=\"400\" y=\"75\" width=\"285\" height=\"255\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><circle cx=\"542\" cy=\"145\" r=\"34\" fill=\"#2469e5\"/><text x=\"542\" y=\"154\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">2</text><text x=\"542\" y=\"235\" font-size=\"32\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Fixture</text><path d=\"M690 205L745 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-55)\"/><rect x=\"755\" y=\"75\" width=\"285\" height=\"255\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><circle cx=\"897\" cy=\"145\" r=\"34\" fill=\"#2469e5\"/><text x=\"897\" y=\"154\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">3</text><text x=\"897\" y=\"235\" font-size=\"32\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Prompt</text><path d=\"M1045 205L1100 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-55)\"/><rect x=\"1110\" y=\"75\" width=\"285\" height=\"255\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><circle cx=\"1252\" cy=\"145\" r=\"34\" fill=\"#2469e5\"/><text x=\"1252\" y=\"154\" font-size=\"28\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">4</text><text x=\"1252\" y=\"235\" font-size=\"32\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Verify</text><text x=\"720\" y=\"410\" font-size=\"28\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">No hidden setup. No real customer data.</text></svg>",
    "notes": "Re-run the workflow using a dedicated account with exactly the permissions and sample data a reviewer will receive. Start from a clean host session to reveal remembered-consent and cached-credential assumptions. Ensure login does not wait on your personal MFA approval or an expiring magic link. Provide deterministic prompts, expected tool names and verifiable outcomes. A populated fixture should cover multiple supported scenarios, permission denial and valid no-result behavior. Use sample data rather than a real customer account. The point is to remove uncertainty about setup, not to hide normal product limitations.",
    "refs": [
      "openai-submit",
      "claude-submit"
    ],

    "section": "03 DISTRIBUTE · RELEASES",
    "title": "Two contracts<br>can be live at once.",
    "subtitle": "Deploy compatibly while metadata catches up.",
    "body": "<svg class=\"diagram\" data-visual=\"two-contract-window\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The host sees the approved schema while the server supports both old and new forms.\"><defs><marker id=\"arrow-24\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"60\" y=\"70\" font-size=\"20\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">HOST</text><rect x=\"60\" y=\"110\" width=\"500\" height=\"130\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"310\" y=\"169\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">search(query)</text><text x=\"310\" y=\"205\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">approved definition</text><text x=\"880\" y=\"70\" font-size=\"20\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">SERVER</text><rect x=\"880\" y=\"110\" width=\"500\" height=\"130\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1130\" y=\"169\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">search(query, folder?)</text><text x=\"1130\" y=\"205\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">accepts old + new</text><path d=\"M570 175L870 175\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-24)\"/><path d=\"M1130 270V340H310V270\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" marker-end=\"url(#arrow-24)\"/><text x=\"720\" y=\"395\" font-size=\"26\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Retire old behavior after adoption.</text></svg>",
    "notes": "This is the most operationally important distribution lesson. If you make a new field required before the host adopts the schema, users break even though the scan system retained the approved definition. Keep old parameters and resource URIs working while the new contract is held. Per-tool outcomes can differ: a new tool can pass while another update is held. Roll back a breaking server deployment rather than waiting for review. The submission and review pages currently differ on some MCP URL-change details; confirm with the portal/support instead of promising an in-place endpoint migration.\n\nDetailed reference from the first draft: HOST STILL SEES search(query)\nPreviously approved schema\n\n≠ SERVER NOW EXPECTS search(query, folder)\nBreaking deployment\n\n\n01 Expand Accept old + new \n→ 02 Deploy Maintain compatibility \n→ 03 Rescan Inspect live definition \n→ 04 Migrate Remove old only safely \n\nOpenAI retains the definition, not a frozen copy of your implementation.",
    "refs": [
      "openai-review"
    ],
    "seconds": 0,
    "appendix": false,
    "theme": "light",
    "visualKind": "two-contract-window",
    "core": false,
    "edition": "visual",

  {
    "section": "03 DISTRIBUTE · RELEASES",
    "title": "Align the<br>two release lanes.",
    "subtitle": "Backend behavior and host metadata must remain compatible.",
    "body": "<svg class=\"diagram\" data-visual=\"release-swimlane\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The server deployment lane expands compatibility before the directory lane adopts the new contract.\"><defs><marker id=\"arrow-56\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"45\" y=\"85\" font-size=\"22\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">SERVER</text><text x=\"45\" y=\"285\" font-size=\"22\" fill=\"#06746e\" text-anchor=\"start\" font-weight=\"550\">HOST</text><path d=\"M220 125L1370 125\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><path d=\"M220 325L1370 325\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  /><rect x=\"250\" y=\"75\" width=\"270\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"385\" y=\"119\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Accept both</text><text x=\"385\" y=\"155\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">old + new</text><rect x=\"680\" y=\"75\" width=\"270\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"815\" y=\"133\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Deploy</text><rect x=\"680\" y=\"275\" width=\"270\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"815\" y=\"319\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Rescan</text><text x=\"815\" y=\"355\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">held or approved</text><rect x=\"1110\" y=\"275\" width=\"270\" height=\"100\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1245\" y=\"333\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Adopt new</text><path d=\"M815 185L815 265\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" marker-end=\"url(#arrow-56)\"/><path d=\"M1245 265V205H1380V125\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-56)\"/></svg>",
    "notes": "Expand the implementation before migrating the published contract. During review, users can still call the approved old schema against the newly deployed server. Keep old parameters, response shapes and resource references working. Rescan and inspect the definition the host is actually allowed to use; do not infer adoption from deployment success. Different tools can pass checks independently. Once the relevant clients have safely adopted a replacement and migration policy permits it, retire old behavior deliberately. The swimlane is a recommended rollout strategy derived from continuous-review behavior, not a claim that a portal controls your live deployment.",
    "refs": [
      "openai-review"
    ],

  {
    "section": "03 DISTRIBUTE · CLAUDE",
    "title": "Claude has<br>two submission paths.",
    "subtitle": "Pair your remote connector with a workflow plugin when needed.",
    "body": "<svg class=\"diagram\" data-visual=\"claude-dual-path\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Remote endpoint goes to connector submission; GitHub bundle goes to plugin submission.\"><defs><marker id=\"arrow-25\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"80\" width=\"400\" height=\"120\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"230\" y=\"134\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">HTTPS endpoint</text><text x=\"230\" y=\"170\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">remote capability</text><path d=\"M440 140L700 140\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-25)\"/><rect x=\"710\" y=\"80\" width=\"690\" height=\"120\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1055\" y=\"134\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP connector</text><text x=\"1055\" y=\"170\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">server + authentication</text><rect x=\"30\" y=\"280\" width=\"400\" height=\"120\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"230\" y=\"334\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">GitHub bundle</text><text x=\"230\" y=\"370\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">workflow package</text><path d=\"M440 340L700 340\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-25)\"/><rect x=\"710\" y=\"280\" width=\"690\" height=\"120\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1055\" y=\"334\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Plugin bundle</text><text x=\"1055\" y=\"370\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">skills + components</text></svg>",
    "notes": "Use claude.ai/directory/manage and choose the submission type. Current connector guidance accepts remote HTTPS endpoints; public data can be unauthenticated, and authenticated user services use OAuth. It now says standalone local MCPB directory submissions are deprecated: include a local server in a plugin instead. For plugins, connect GitHub and prove repository push access; the repository must be public before listing goes live. These are current documented flows, not the older form-based workflow or a promise of instant approval.\n\nDetailed reference from the first draft: REMOTE CONNECTOR\nHTTPS MCP endpoint\nDeveloper portal → MCP connector. Tool titles, annotations, auth, listing materials and reviewer access.\n\nPLUGIN BUNDLE\nGitHub source\nDeveloper portal → Plugin bundle. Validate source, permissions, data handling and release settings.\n\n\nIf your plugin points to your own remote MCP server, submit the connector separately too.",
    "refs": [

      "claude-plugin"
    ],
