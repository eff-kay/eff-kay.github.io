    "notes": "Introduce yourself through the problem you work on, not a résumé tour. “At Docsalot, we create and host MCP servers. We have created a read-only MCP surface for more than three hundred documentation sites.” This number is supplied by me for this talk; it does not mean three hundred independent public-directory approvals or active customers. Explain the useful contrast: public documentation retrieval versus an authenticated dashboard with write capabilities. The same brand can have very different trust boundaries. Photo is from my public Sessionize profile because LinkedIn required sign-in.\n\nDetailed reference from the first draft: Documentation systems. Agent tooling. MCP infrastructure.\nPreviously: open-source developer tools at Plotly. Two first-author papers in IEEE TSE.\n300+ documentation sites with a read-only MCP surface Searchable documentation, delivered directly to AI clients.\n\nVisual walkthrough: Use the supplied 300+ scope as experience, without converting it to approval or usage claims.",

    "body": "<svg class=\"diagram\" data-visual=\"nested-system-layers\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"The user workflow contains a host, a plugin package, an MCP connection and service capabilities.\"><defs><marker id=\"arrow-33\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"45\" y=\"25\" width=\"1350\" height=\"380\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"80\" y=\"80\" font-size=\"23\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">USER WORKFLOW</text><rect x=\"235\" y=\"105\" width=\"1100\" height=\"255\" rx=\"5\" fill=\"#d3e1f7\" stroke=\"none\" stroke-width=\"2\"/><text x=\"270\" y=\"155\" font-size=\"23\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">HOST + MODEL</text><rect x=\"470\" y=\"185\" width=\"800\" height=\"125\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"505\" y=\"230\" font-size=\"25\" fill=\"#eaf3ff\" text-anchor=\"start\" font-weight=\"550\">PLUGIN / CONNECTOR</text><text x=\"505\" y=\"280\" font-size=\"28\" fill=\"#b7d0fa\" text-anchor=\"start\" font-weight=\"550\">MCP → SERVICE</text></svg>",
    "notes": "Use the nested diagram to distinguish a user experience from a protocol integration. The host controls model orchestration and permissions UX. A package can carry tools, instructions or other supported components depending on the ecosystem. A connector describes the remote service connection. MCP describes structured interaction with the server. These are conceptual layers, not a claim that every host uses an identical internal architecture. A server can be connected directly without a public listing; a listing helps discovery but does not supply application authorization. Ask the audience which layer they actually need to ship.",

    "body": "<svg class=\"diagram\" data-visual=\"request-path\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Host → Boundary → Index → Evidence\"><defs><marker id=\"arrow-1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"182.25\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Host</text><text x=\"182.25\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">chooses tool</text><path d=\"M334.5 205L379.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-1)\"/><rect x=\"388.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"540.75\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Boundary</text><text x=\"540.75\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">checks access</text><path d=\"M693 205L738 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-1)\"/><rect x=\"747\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"899.25\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Index</text><text x=\"899.25\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">filters version</text><path d=\"M1051.5 205L1096.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-1)\"/><rect x=\"1105.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1257.75\" y=\"199\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Evidence</text><text x=\"1257.75\" y=\"235\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">source + excerpt</text></svg>",
    "notes": "Walk left to right. The host owns the model loop and client behavior. The MCP server owns its tool boundary and downstream credentials. The index owns source data and freshness. A successful RPC is not yet a correct answer: a result from the wrong product version is still a failure. Now generalize: a plugin packages how users discover and install the capability; a connector names the remote integration in a host; MCP is the wire contract. These layers are related but they are not interchangeable.\n\nDetailed reference from the first draft: 01 Host + model Chooses search_docs \n→ 02 MCP boundary Validates identity + input \n→ 03 Docs index Filters site + version \n→ 04 Result Evidence + source URL \n\nContract Operations Distribution",

    "title": "The host owns the loop.",
    "subtitle": "The server owns its boundary.",
    "body": "<svg class=\"diagram\" data-visual=\"agent-loop\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"User asks, host selects a tool, server returns evidence, host forms the answer.\"><defs><marker id=\"arrow-34\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"145\" width=\"260\" height=\"120\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"180\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">USER</text><text x=\"180\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">intent</text><rect x=\"515\" y=\"55\" width=\"420\" height=\"110\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"725\" y=\"104\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">HOST + MODEL</text><text x=\"725\" y=\"140\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">tool selection</text><rect x=\"515\" y=\"285\" width=\"420\" height=\"110\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"725\" y=\"334\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP SERVER</text><text x=\"725\" y=\"370\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">bounded execution</text><rect x=\"1140\" y=\"145\" width=\"260\" height=\"120\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1270\" y=\"199\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">ANSWER</text><text x=\"1270\" y=\"235\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">evidence</text><path d=\"M320 205H405V110H505\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-34)\"/><path d=\"M725 175V275\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-34)\"/><path d=\"M945 340H1030V205H1130\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-34)\"/><path d=\"M505 340H410V150H505\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\" stroke-dasharray=\"7 8\" marker-end=\"url(#arrow-34)\"/><text x=\"350\" y=\"395\" font-size=\"21\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">result</text></svg>",
    "notes": "Start at the user’s intent. The host decides whether and when to invoke a tool and constructs its arguments. Your server validates those arguments and enforces access regardless of how good the model seems. Return evidence that is useful for the host’s answer. Do not claim the server can observe all reasoning or the final conversation; it sees only the inputs and context provided through its interface. The loop is conceptual and omits host-specific implementation details. This distinction explains why server logs alone cannot prove user success.",
    "refs": [
      "tools"
    ],

  {
    "section": "ORIENTATION",
    "title": "Three layers to ship.",
    "subtitle": "A technical field guide.",
    "body": "<svg class=\"diagram\" data-visual=\"three-chapter-roadmap\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Build, operate, distribute.\"><defs><marker id=\"arrow-2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"60\" y=\"80\" width=\"420\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"88\" y=\"133\" font-size=\"23\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">01</text><text x=\"88\" y=\"225\" font-size=\"42\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">BUILD</text><text x=\"88\" y=\"295\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">Contract · auth · runtime</text><rect x=\"525\" y=\"80\" width=\"420\" height=\"270\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"553\" y=\"133\" font-size=\"23\" fill=\"#b9d2ff\" text-anchor=\"start\" font-weight=\"550\">02</text><text x=\"553\" y=\"225\" font-size=\"42\" fill=\"#eff4fc\" text-anchor=\"start\" font-weight=\"550\">OPERATE</text><text x=\"553\" y=\"295\" font-size=\"23\" fill=\"#b9d2ff\" text-anchor=\"start\" font-weight=\"550\">Policy · traces · recovery</text><rect x=\"990\" y=\"80\" width=\"420\" height=\"270\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1018\" y=\"133\" font-size=\"23\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">03</text><text x=\"1018\" y=\"225\" font-size=\"42\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">DISTRIBUTE</text><text x=\"1018\" y=\"295\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">Package · prove · publish</text></svg>",
    "notes": "Introduce the three main topics. Build a safe contract: tool semantics, authorization and runtime compatibility. Operate it: policy enforcement, privacy-conscious observability and durable async recovery. Distribute it: platform packages, evidence and ongoing review. The time limit has been removed, so this edition is a sequenced field guide, not a twenty-minute script. Each slide deliberately carries a small amount of visible text; use the notes to supply technical explanation and examples.",

  {
    "section": "01 BUILD · CONTRACT",
    "title": "Start with the service.",
    "subtitle": "Add transport after the workflow is coherent.",
    "body": "<svg class=\"diagram\" data-visual=\"build-ladder\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Workflow → Domain service → Tool contract → SDK adapter\"><defs><marker id=\"arrow-12\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"182.25\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Workflow</text><path d=\"M334.5 205L379.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-12)\"/><rect x=\"388.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"540.75\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Domain service</text><path d=\"M693 205L738 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-12)\"/><rect x=\"747\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"899.25\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Tool contract</text><path d=\"M1051.5 205L1096.5 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-12)\"/><rect x=\"1105.5\" y=\"130\" width=\"304.5\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1257.75\" y=\"213\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">SDK adapter</text></svg>",
    "notes": "This is our implementation recommendation. Begin with a typed domain service and a small test fixture. Do not begin by scaffolding OAuth and a hundred tools. The retrieval function should accept only validated fields and a server-created principal. A public site identifier can select an authorized catalog entry; it must not become an arbitrary URL fetch. When moving to authenticated documents, apply tenant filtering before retrieval and recheck each returned record. Pin the SDK and use its supported transport implementation instead of writing raw JSON-RPC from memory. Examples in these notes are design blueprints, not a compiled server.\n\nDetailed reference from the first draft: 1 Choose the boundary\nPublic docs search or authenticated tenant docs? Decide explicitly.\n\n2 Define two operations\nsearch_docs returns bounded hits; get_doc returns a canonical source.\n\n3 Implement the service layer\nValidate site/version; authorize document; return structured evidence.\n\n4 Attach a supported SDK\nRegister tools; add tested stdio/HTTP adapter; pin supported protocol versions.\n\n\nKeep policy and retrieval outside transport handlers so every adapter calls the same business logic.\n\nVisual walkthrough: The service owns validation, authorization and business behavior. Transport wraps that service. The SDK handles protocol details; it does not invent application security.",
    "refs": [],

    "appendix": false,

    "visualKind": "build-ladder",

    "anchor": "scene-7"

  {
    "section": "01 BUILD · CONTRACT",
    "title": "Keep the core<br>outside the transport.",
    "subtitle": "One service. Multiple tested adapters.",
    "body": "<svg class=\"diagram\" data-visual=\"hexagonal-adapters\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Stdio and HTTP adapters call the same domain service, which enforces policy before reaching the data.\"><defs><marker id=\"arrow-35\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"55\" width=\"310\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"195\" y=\"113\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">stdio</text><rect x=\"40\" y=\"285\" width=\"310\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"195\" y=\"343\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">HTTP</text><path d=\"M360 105H460V220H545\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-35)\"/><path d=\"M360 335H460V220H545\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-35)\"/><polygon points=\"620,90 820,90 910,220 820,350 620,350 530,220\" fill=\"#0b2546\"/><text x=\"720\" y=\"210\" font-size=\"34\" fill=\"#eaf3ff\" text-anchor=\"middle\" font-weight=\"550\">DOMAIN</text><text x=\"720\" y=\"255\" font-size=\"34\" fill=\"#eaf3ff\" text-anchor=\"middle\" font-weight=\"550\">SERVICE</text><path d=\"M920 220L1085 220\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-35)\"/><rect x=\"1095\" y=\"155\" width=\"310\" height=\"130\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1250\" y=\"214\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Data + APIs</text><text x=\"1250\" y=\"250\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">policy checked</text></svg>",
    "notes": "Recommended architecture: define a domain service with explicit typed inputs and a server-created request context. Place authentication, object access and output projection in predictable layers. A stdio adapter and a hosted HTTP adapter should not independently implement different authorization policies. Use your pinned SDK’s supported transports and error mapping. This diagram does not mean local and remote auth models are interchangeable: resolve the caller appropriately at each adapter, then hand a validated context to the same service. Test the domain behavior separately from wire compatibility.",

      "transport"
    ],

  {
    "section": "01 BUILD",
    "title": "Constrain the capability.",
    "subtitle": "One useful workflow per tool.",
    "body": "<svg class=\"diagram\" data-visual=\"comparison\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"TOO BROAD / api_request / method · URL · body versus BOUNDED / search_docs / site · version · query\"><defs><marker id=\"arrow-3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"60\" width=\"620\" height=\"285\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"780\" y=\"60\" width=\"620\" height=\"285\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"75\" y=\"105\" font-size=\"19\" fill=\"#b44735\" text-anchor=\"start\" font-weight=\"550\">TOO BROAD</text><text x=\"815\" y=\"105\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"start\" font-weight=\"550\">BOUNDED</text><text x=\"350\" y=\"211\" font-size=\"38\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">api_request</text><text x=\"1090\" y=\"211\" font-size=\"38\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">search_docs</text><text x=\"350\" y=\"270\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">method · URL · body</text><text x=\"1090\" y=\"270\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">site · version · query</text><text x=\"720\" y=\"220\" font-size=\"54\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">→</text></svg>",
    "notes": "Start with one workflow: find a guide and fetch its source. Resist generating an MCP tool for every internal endpoint. Make names, descriptions, inputs and output schemas say the same thing. Enforce maximum result count and input lengths in code, not just prose. Derive tenant identity from validated authentication, never from a model-supplied tenant ID. Separate reads from writes. An annotation helps a host choose safeguards; it cannot enforce your authorization. Test confusing prompts as well as direct prompts.\n\nDetailed reference from the first draft: BROAD SURFACE\napi_request({\nmethod, url, body\n}) \nThe model chooses the operation, destination and payload.\n\nBOUNDED WORKFLOW\nsearch_docs({\nquery, site_id, version, limit\n}) \nThe server owns destinations, permissions and query limits.\n\n\nValidate input → authorize object → execute → validate output. An annotation is a hint, not a permission.\n\nVisual walkthrough: Compare who chooses the destination and operation. The right side constrains both before execution.",
    "refs": [
      "tools",
      "openai-policy"
    ],
    "seconds": 0,
    "appendix": false,
    "theme": "light",
    "visualKind": "comparison",
    "core": true,
    "edition": "visual",
    "anchor": "scene-9"
  },
  {
    "section": "01 BUILD · CONTRACT",
    "title": "Split the actions.",
    "subtitle": "Different effects need different tool contracts.",
    "body": "<svg class=\"diagram\" data-visual=\"tool-decomposition\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A generic request tool is decomposed into read, create and delete tools.\"><defs><marker id=\"arrow-36\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"140\" width=\"460\" height=\"140\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"280\" y=\"204\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">api_request(method, …)</text><text x=\"280\" y=\"240\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">one mixed capability</text><path d=\"M520 210H650V75H875\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-36)\"/><path d=\"M650 210H875\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-36)\"/><path d=\"M650 210V345H875\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-36)\"/><rect x=\"885\" y=\"30\" width=\"500\" height=\"90\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1135\" y=\"69\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">get_document</text><text x=\"1135\" y=\"105\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">read</text><rect x=\"885\" y=\"165\" width=\"500\" height=\"90\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1135\" y=\"204\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">create_document</text><text x=\"1135\" y=\"240\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">additive write</text><rect x=\"885\" y=\"300\" width=\"500\" height=\"90\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1135\" y=\"339\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">delete_document</text><text x=\"1135\" y=\"375\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">destructive</text></svg>",
    "notes": "The shape of the tool list affects review, permission prompts and model behavior. A catch-all request tool obscures action boundaries; documenting the difference in prose does not fix a mixed safe/unsafe contract. Split tools by meaningful operation, then give each an accurate name, schema and side-effect annotations. A read-only hint must match the implementation: starting a persistent job or writing an artifact is still a state change even if the output looks like a preview. Clients apply their own safeguards, so review the target host’s annotation requirements rather than assuming one universal confirmation policy.",
    "refs": [
      "claude-review",
      "openai-policy"
    ],
    "seconds": 0,
    "appendix": false,
    "theme": "light",

    "anchor": "scene-10"

  {
    "section": "01 BUILD · CONTRACT",
    "title": "A small schema<br>is a strong boundary.",
    "subtitle": "Inputs select candidates. Policy grants access.",
    "body": "<svg class=\"diagram\" data-visual=\"schema-anatomy\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Search input contains query, site, version and a bounded limit.\"><defs><marker id=\"arrow-13\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"75\" y=\"40\" width=\"780\" height=\"340\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"115\" y=\"100\" font-size=\"39\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">search_docs</text><text x=\"120\" y=\"170\" font-size=\"28\" fill=\"#c9dcf7\" text-anchor=\"start\" font-weight=\"550\">query</text><text x=\"120\" y=\"219\" font-size=\"28\" fill=\"#c9dcf7\" text-anchor=\"start\" font-weight=\"550\">site_id</text><text x=\"120\" y=\"268\" font-size=\"28\" fill=\"#c9dcf7\" text-anchor=\"start\" font-weight=\"550\">version</text><text x=\"120\" y=\"317\" font-size=\"28\" fill=\"#c9dcf7\" text-anchor=\"start\" font-weight=\"550\">limit ≤ 5</text><path d=\"M860 140L1050 140\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-13)\"/><path d=\"M860 285L1050 285\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-13)\"/><rect x=\"1060\" y=\"95\" width=\"300\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1210\" y=\"136.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Validation</text><text x=\"1210\" y=\"172.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">shape + bounds</text><rect x=\"1060\" y=\"240\" width=\"300\" height=\"95\" rx=\"5\" fill=\"#06746e\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1210\" y=\"281.5\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Authorization</text><text x=\"1210\" y=\"317.5\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">caller + object</text></svg>",
    "notes": "Read only the important fields aloud: explicit version, bounded query and result count, no arbitrary URL. openWorldHint false assumes a deliberately bounded authorized documentation catalog; if the tool performs open-ended public web search, true is appropriate. Hints must follow actual behavior and target-platform requirements. Add an output schema for title, source URI, document version, excerpt and stable document identity as needed. Do not include internal tracing metadata in the model response. Enforce the same validation in the service layer: JSON Schema is not an authorization boundary.\n\nDetailed reference from the first draft: {\n\"name\": \"search_docs\",\n\"title\": \"Search documentation\",\n\"description\": \"Find guides in one authorized site and version. Returns up to 5 hits.\",\n\"inputSchema\": {\n\"type\": \"object\", \"additionalProperties\": false,\n\"properties\": {\n\"query\": { \"type\": \"string\", \"minLength\": 1, \"maxLength\": 500 },\n\"site_id\": { \"type\": \"string\" },\n\"version\": { \"type\": \"string\" },\n\"limit\": { \"type\": \"integer\", \"minimum\": 1, \"maximum\": 5 }\n},\n\"required\": [\"query\", \"site_id\", \"version\"]\n},\n\"annotations\": {\n\"readOnlyHint\": true, \"destructiveHint\": false, \"openWorldHint\": false\n}\n}\n\nVisual walkthrough: The full first-draft JSON schema is retained below in these notes. Keep additionalProperties false where appropriate and enforce the same constraints at runtime.",
    "refs": [
      "tools",
      "openai-policy"
    ],
    "seconds": 0,
    "appendix": false,
    "theme": "light",
    "visualKind": "schema-anatomy",
    "core": true,
    "edition": "visual",
    "anchor": "scene-11"
  },
  {
    "section": "01 BUILD · CONTRACT",
    "title": "Anatomy of a call.",
    "subtitle": "Separate routing, arguments and context.",
    "body": "<svg class=\"diagram\" data-visual=\"request-envelope\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A request envelope carries protocol metadata, operation and validated arguments.\"><defs><marker id=\"arrow-37\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"95\" y=\"25\" width=\"1250\" height=\"370\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"95\" y=\"25\" width=\"1250\" height=\"72\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"135\" y=\"75\" font-size=\"25\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">REQUEST ENVELOPE</text><rect x=\"135\" y=\"125\" width=\"690\" height=\"58\" rx=\"5\" fill=\"#183a63\" stroke=\"none\" stroke-width=\"2\"/><text x=\"160\" y=\"164\" font-size=\"26\" fill=\"#e9f2ff\" text-anchor=\"start\" font-weight=\"550\">Protocol metadata</text><rect x=\"135\" y=\"203\" width=\"690\" height=\"58\" rx=\"5\" fill=\"#183a63\" stroke=\"none\" stroke-width=\"2\"/><text x=\"160\" y=\"242\" font-size=\"26\" fill=\"#e9f2ff\" text-anchor=\"start\" font-weight=\"550\">Method + request ID</text><rect x=\"135\" y=\"281\" width=\"690\" height=\"58\" rx=\"5\" fill=\"#183a63\" stroke=\"none\" stroke-width=\"2\"/><text x=\"160\" y=\"320\" font-size=\"26\" fill=\"#e9f2ff\" text-anchor=\"start\" font-weight=\"550\">Tool name + arguments</text><text x=\"895\" y=\"165\" font-size=\"23\" fill=\"#b8cfee\" text-anchor=\"start\" font-weight=\"550\">Version + capabilities</text><text x=\"895\" y=\"243\" font-size=\"23\" fill=\"#b8cfee\" text-anchor=\"start\" font-weight=\"550\">Request correlation</text><text x=\"895\" y=\"321\" font-size=\"23\" fill=\"#b8cfee\" text-anchor=\"start\" font-weight=\"550\">Validated application input</text></svg>",
    "notes": "This is an anatomical sketch, not a complete copy-and-paste wire message. In the current protocol era, required protocol metadata and capabilities are per-request. The SDK should encode the exact supported form. A JSON-RPC ID correlates a response with a request; it is not an application idempotency key for a side effect. Arguments are model-supplied inputs and must be validated and authorized. Authentication and request context are resolved by the server; do not trust a tenant field merely because it appears inside a syntactically valid request. Keep secrets outside model-visible arguments and output.",
    "refs": [
      "transport",
      "tools"
    ],
    "seconds": 0,
    "appendix": false,
    "theme": "light",
    "visualKind": "request-envelope",

    "edition": "visual",
    "anchor": "scene-12"

  {
    "section": "01 BUILD · CONTRACT",
    "title": "Make the handler<br>easy to audit.",
    "subtitle": "A fixed order for every invocation.",
    "body": "<svg class=\"diagram\" data-visual=\"handler-pipeline\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Validate → Authenticate → Authorize → Execute → Project\"><defs><marker id=\"arrow-14\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"146.4\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Validate</text><path d=\"M262.8 205L307.8 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><rect x=\"316.8\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"433.20000000000005\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Authenticate</text><path d=\"M549.6 205L594.6 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><rect x=\"603.6\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Authorize</text><path d=\"M836.4000000000001 205L881.4000000000001 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><rect x=\"890.4000000000001\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1006.8000000000001\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Execute</text><path d=\"M1123.2 205L1168.2 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-14)\"/><rect x=\"1177.2\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1293.6000000000001\" y=\"213\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Project</text></svg>",
    "notes": "The pseudocode illustrates ordering and is not runnable without the named application services. For a public catalog, authenticate can deliberately resolve an anonymous principal with a public-only policy. For private docs, missing auth is not anonymous access. The server owns tenant mapping. Authorization should constrain search itself to prevent count and ranking leakage, then check returned records to catch index ACL lag. Use parameterized database queries and bounded search. Do not turn an unknown site into a best-effort arbitrary fetch. Test unauthorized document IDs and version mismatches explicitly.\n\nDetailed reference from the first draft: async function searchDocs(input, requestContext) {\nconst args = validateSearchInput(input);\nconst principal = await authenticate(requestContext);\nconst site = await catalog.requireAuthorizedSite(principal, args.site_id);\npolicy.require(principal, \"docs:read\", site);\n\nconst hits = await index.search({\ntenant: site.tenantId, site: site.id, version: args.version,\nquery: args.query, limit: Math.min(args.limit ?? 5, 5)\n});\nconst visible = await authorizeEveryHit(principal, hits);\nreturn validateSearchOutput(projectEvidence(visible));\n} \nModel-supplied IDs select candidates. Server-side policy decides which candidates exist for this caller.\n\nVisual walkthrough: Walk through the retained pseudocode in notes. Authorization constrains retrieval itself, then each returned record is checked. Output projection avoids over-sharing.",

    "section": "01 BUILD",
    "title": "Make the grant explicit.",
    "subtitle": "Identity is only the first check.",
    "body": "<svg class=\"sequence\" viewBox=\"0 0 1100 370\" role=\"img\" aria-label=\"Sequence diagram: Request; 401 + metadata; Consent + PKCE; Resource-bound token; Authorize each call\"><defs><marker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"50\" y=\"24\" text-anchor=\"start\" class=\"lane-title\">Host</text><line x1=\"50\" y1=\"45\" x2=\"50\" y2=\"360\" class=\"lifeline\"/><text x=\"550\" y=\"24\" text-anchor=\"middle\" class=\"lane-title\">MCP resource</text><line x1=\"550\" y1=\"45\" x2=\"550\" y2=\"360\" class=\"lifeline\"/><text x=\"1050\" y=\"24\" text-anchor=\"end\" class=\"lane-title\">Issuer</text><line x1=\"1050\" y1=\"45\" x2=\"1050\" y2=\"360\" class=\"lifeline\"/><g class=\"event\" style=\"--order:0\"><line x1=\"50\" y1=\"83\" x2=\"550\" y2=\"83\" marker-end=\"url(#arrowhead)\"/><rect x=\"261.3\" y=\"59\" width=\"77.39999999999999\" height=\"23\" rx=\"3\"/><text x=\"300\" y=\"76\" text-anchor=\"middle\">Request</text></g><g class=\"event\" style=\"--order:1\"><line x1=\"550\" y1=\"136\" x2=\"50\" y2=\"136\" marker-end=\"url(#arrowhead)\"/><rect x=\"232.60000000000002\" y=\"112\" width=\"134.79999999999998\" height=\"23\" rx=\"3\"/><text x=\"300\" y=\"129\" text-anchor=\"middle\">401 + metadata</text></g><g class=\"event\" style=\"--order:2\"><line x1=\"50\" y1=\"189\" x2=\"1050\" y2=\"189\" marker-end=\"url(#arrowhead)\"/><rect x=\"482.6\" y=\"165\" width=\"134.79999999999998\" height=\"23\" rx=\"3\"/><text x=\"550\" y=\"182\" text-anchor=\"middle\">Consent + PKCE</text></g><g class=\"event\" style=\"--order:3\"><line x1=\"1050\" y1=\"242\" x2=\"50\" y2=\"242\" marker-end=\"url(#arrowhead)\"/><rect x=\"458\" y=\"218\" width=\"184\" height=\"23\" rx=\"3\"/><text x=\"550\" y=\"235\" text-anchor=\"middle\">Resource-bound token</text></g><g class=\"event\" style=\"--order:4\"><line x1=\"50\" y1=\"295\" x2=\"550\" y2=\"295\" marker-end=\"url(#arrowhead)\"/><rect x=\"212.10000000000002\" y=\"271\" width=\"175.79999999999998\" height=\"23\" rx=\"3\"/><text x=\"300\" y=\"288\" text-anchor=\"middle\">Authorize each call</text></g></svg>",
    "notes": "Explain the resource server and authorization server as separate roles, even if they share a deployment. Public documentation can be unauthenticated; user-account actions need the host-supported OAuth flow. The client discovers the protected resource and issuer, obtains consent with PKCE, and presents a resource-bound token. The server checks identity and object access on every operation. Do not forward a client bearer token to another API merely because it is a token. Store downstream grants separately. Current MCP prefers client ID metadata documents where supported; dynamic registration is a compatibility option, not a universal prerequisite.\n\nDetailed reference from the first draft: [Sequence diagram] MCP access token ≠ upstream API token. Validate audience, issuer, expiry and permissions.\n\nVisual walkthrough: The token authenticates a caller and conveys grants. Object-level policy still decides whether this exact operation may run.",

    "section": "01 BUILD · AUTH",
    "title": "Debug discovery first.",
    "subtitle": "A tool handler cannot fix an HTML metadata response.",
    "body": "<svg class=\"diagram\" data-visual=\"oauth-debug-stack\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Resource URI, Challenge, Issuer, Grant\"><defs><marker id=\"arrow-16\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"70\" y=\"30\" width=\"1300\" height=\"80\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"110\" y=\"80\" font-size=\"28\" fill=\"#edf4ff\" text-anchor=\"start\" font-weight=\"550\">Resource URI</text><text x=\"1300\" y=\"80\" font-size=\"23\" fill=\"#b8cce8\" text-anchor=\"end\" font-weight=\"550\">one canonical public identity</text><rect x=\"108\" y=\"128\" width=\"1224\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"148\" y=\"178\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Challenge</text><text x=\"1262\" y=\"178\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"end\" font-weight=\"550\">401 + metadata location</text><rect x=\"146\" y=\"226\" width=\"1148\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"186\" y=\"276\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Issuer</text><text x=\"1224\" y=\"276\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"end\" font-weight=\"550\">JSON discovery + registration</text><rect x=\"184\" y=\"324\" width=\"1072\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"224\" y=\"374\" font-size=\"28\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Grant</text><text x=\"1186\" y=\"374\" font-size=\"23\" fill=\"#56708a\" text-anchor=\"end\" font-weight=\"550\">consent → code → token</text></svg>",
    "notes": "Debug in this order: exact public resource URI, challenge, metadata JSON, issuer identity, registration support, redirect allowlist, consent, code exchange, token validation. Metadata routes returning an HTML app shell are a classic integration failure. Current MCP authorization supports client ID metadata documents, pre-registration, and compatibility dynamic registration with defined selection rules. Pick the intersection your host and authorization server actually support. A logged-in browser session does not prove the token's scope, audience or tenant. Redact authorization codes and tokens in all saved traces.\n\nDetailed reference from the first draft: [Sequence diagram]",

    "section": "01 BUILD · AUTH",
    "title": "Ask for the<br>smallest useful grant.",
    "subtitle": "Capabilities should grow with the workflow.",
    "body": "<svg class=\"diagram\" data-visual=\"scope-staircase\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Read, edit and publish are progressively broader grants, each explicitly authorized.\"><defs><marker id=\"arrow-38\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"80\" y=\"290\" width=\"370\" height=\"100\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"535\" y=\"205\" width=\"370\" height=\"185\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"990\" y=\"105\" width=\"370\" height=\"285\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"265\" y=\"350\" font-size=\"33\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">READ</text><text x=\"720\" y=\"270\" font-size=\"33\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">EDIT</text><text x=\"1175\" y=\"170\" font-size=\"33\" fill=\"#edf4fc\" text-anchor=\"middle\" font-weight=\"550\">PUBLISH</text><path d=\"M455 325L525 265\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-38)\"/><path d=\"M910 245L980 165\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-38)\"/><text x=\"720\" y=\"435\" font-size=\"25\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">Consent to a scope is not consent to every object.</text></svg>",
    "notes": "These scope names are examples for an application, not protocol-reserved strings. Design grants around meaningful actions. A user who needs public search should not consent to publishing access. An editor grant may still need tenant and document checks, and a publish action may require a separate approval gate. Avoid silently expanding an existing grant during a tool update. Explain why permission is needed at consent time and provide revocation. On each request, validate the token and enforce current object access. The staircase depicts capability breadth, not a recommendation to request all higher scopes up front.",

    "section": "01 BUILD · AUTH",
    "title": "A token has<br>an intended audience.",
    "subtitle": "A bearer string is not universal permission.",
    "body": "<svg class=\"diagram\" data-visual=\"token-audience\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"An MCP resource token is accepted at the intended server and rejected at another service.\"><defs><marker id=\"arrow-39\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"60\" y=\"105\" width=\"450\" height=\"230\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"100\" y=\"165\" font-size=\"22\" fill=\"#b8cfee\" text-anchor=\"start\" font-weight=\"550\">ACCESS TOKEN</text><text x=\"100\" y=\"230\" font-size=\"31\" fill=\"#edf4fc\" text-anchor=\"start\" font-weight=\"550\">aud: MCP resource</text><text x=\"100\" y=\"285\" font-size=\"26\" fill=\"#c9dcf7\" text-anchor=\"start\" font-weight=\"550\">scope: docs:read</text><path d=\"M520 220H700V110H940\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-39)\"/><path d=\"M700 220V335H940\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\"  marker-end=\"url(#arrow-39)\"/><rect x=\"950\" y=\"55\" width=\"440\" height=\"110\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1170\" y=\"104\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">MCP resource</text><text x=\"1170\" y=\"140\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">validate + authorize</text><rect x=\"950\" y=\"280\" width=\"440\" height=\"110\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1170\" y=\"329\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Unrelated API</text><text x=\"1170\" y=\"365\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">reject wrong audience</text><text x=\"795\" y=\"325\" font-size=\"40\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">×</text></svg>",
    "notes": "The token panel is conceptual; tokens can be opaque and the server may validate them through an authorization service rather than decoding local JWT fields. Check issuer, expiration, intended resource and permissions using the chosen authorization system. Never forward a token issued for the MCP resource to an upstream API just because it arrived as a bearer token. Use a separately authorized downstream grant. Incorrect audience handling turns an apparently working connector into a confused trust relationship. Test tokens for the wrong resource, expired tokens and revoked access, as well as the successful path.",

  {
    "section": "01 BUILD · AUTH",
    "title": "Threats meet controls<br>at the boundary.",
    "subtitle": "Treat the protocol as a trust boundary.",
    "body": "<svg class=\"diagram\" data-visual=\"threat-bowtie\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Attacks on the left encounter authorization and egress controls before reaching data.\"><defs><marker id=\"arrow-17\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"35\" y=\"40\" width=\"330\" height=\"85\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"200\" y=\"90.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">SSRF</text><rect x=\"35\" y=\"180\" width=\"330\" height=\"85\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"200\" y=\"230.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Token passthrough</text><rect x=\"35\" y=\"320\" width=\"330\" height=\"85\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"200\" y=\"370.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Confused deputy</text><rect x=\"570\" y=\"140\" width=\"300\" height=\"150\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"209\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">MCP boundary</text><text x=\"720\" y=\"245\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">policy + consent</text><path d=\"M370 82L560 215\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\"  marker-end=\"url(#arrow-17)\"/><path d=\"M370 222L560 215\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\"  marker-end=\"url(#arrow-17)\"/><path d=\"M370 362L560 215\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\"  marker-end=\"url(#arrow-17)\"/><path d=\"M880 215L1070 215\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-17)\"/><rect x=\"1080\" y=\"140\" width=\"330\" height=\"150\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1245\" y=\"209\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Protected service</text><text x=\"1245\" y=\"245\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">scoped capability</text></svg>",
    "notes": "The first three are grounded in MCP security guidance; tenant and retrieval controls are our application design recommendations. Explain why an external article can contain useful facts without becoming an instruction source. Read-only tools still exfiltrate data if queries or results cross a tenant boundary. Avoid presenting prompt wording as the primary defense. Server-side capability and egress restrictions matter even if the model follows malicious retrieved text. For proxies, obtain explicit per-client consent and keep upstream tokens out of tool output. Apply the threat model again when a tool changes from read to write.\n\nDetailed reference from the first draft: Attack Failure boundary Control to implement \nConfused deputy Shared upstream OAuth client skips per-client consent Bind user consent to the requesting client \nToken passthrough MCP token forwarded to unrelated API Validate audience; separate downstream grant \nSSRF User-controlled URL or metadata fetch reaches internal network Allowlist + IP/DNS/redirect validation \nCross-tenant retrieval Model supplies another tenant’s object ID Derive tenant; authorize each object \nInstruction injection Retrieved docs treated as trusted behavioral instructions Separate content from authority; minimize tool privilege",
    "refs": [
      "security"
    ],
    "seconds": 0,
    "appendix": false,
    "theme": "light",
    "visualKind": "threat-bowtie",
    "core": false,
    "edition": "visual",
    "anchor": "scene-18"
  },
  {
    "section": "01 BUILD · AUTH",
    "title": "Tenant isolation<br>must survive retrieval.",
    "subtitle": "Filter before search. Check returned objects.",
    "body": "<svg class=\"diagram\" data-visual=\"tenant-partitions\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A caller authorized for tenant A can search partition A, while partition B is inaccessible.\"><defs><marker id=\"arrow-40\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"155\" width=\"300\" height=\"120\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"190\" y=\"209\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">CALLER A</text><text x=\"190\" y=\"245\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">verified context</text><path d=\"M350 215L530 215\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-40)\"/><rect x=\"545\" y=\"35\" width=\"380\" height=\"360\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"1005\" y=\"35\" width=\"380\" height=\"360\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"735\" y=\"95\" font-size=\"25\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TENANT A</text><text x=\"1195\" y=\"95\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">TENANT B</text><rect x=\"595\" y=\"140\" width=\"280\" height=\"55\" rx=\"5\" fill=\"#f4faf8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"735\" y=\"175.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">doc 1</text><rect x=\"1055\" y=\"140\" width=\"280\" height=\"55\" rx=\"5\" fill=\"#edf2f8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1195\" y=\"175.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">doc 4</text><rect x=\"595\" y=\"215\" width=\"280\" height=\"55\" rx=\"5\" fill=\"#f4faf8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"735\" y=\"250.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">doc 2</text><rect x=\"1055\" y=\"215\" width=\"280\" height=\"55\" rx=\"5\" fill=\"#edf2f8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1195\" y=\"250.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">doc 5</text><rect x=\"595\" y=\"290\" width=\"280\" height=\"55\" rx=\"5\" fill=\"#f4faf8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"735\" y=\"325.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">doc 3</text><rect x=\"1055\" y=\"290\" width=\"280\" height=\"55\" rx=\"5\" fill=\"#edf2f8\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1195\" y=\"325.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">doc 6</text><path d=\"M350 270H475V425H1195V405\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\" stroke-dasharray=\"7 8\" marker-end=\"url(#arrow-40)\"/><text x=\"880\" y=\"430\" font-size=\"23\" fill=\"#b44735\" text-anchor=\"middle\" font-weight=\"550\">DENY</text></svg>",
    "notes": "Treat tenant identifiers from arguments as candidate selectors, not authority. Resolve the tenant from validated caller context and catalog ownership. Apply an authorized filter inside retrieval so ranking, count and snippet results do not reveal another tenant’s documents. Recheck individual objects before returning them, especially if an index can lag behind permission changes. A global shared index requires deliberate partition and cache design. Test direct document IDs, search queries, pagination cursors, source links and cached results for cross-tenant leakage. This is an application architecture recommendation, not built-in isolation supplied by MCP.",

  {
    "section": "01 BUILD · AUTH",
    "title": "Retrieved text<br>is data, not authority.",
    "subtitle": "Keep instructions and content on different rails.",
    "body": "<svg class=\"diagram\" data-visual=\"instruction-data-rails\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Host instructions remain on a control rail; untrusted retrieved text is confined to a content rail.\"><defs><marker id=\"arrow-41\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"70\" y=\"70\" font-size=\"22\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">CONTROL</text><rect x=\"70\" y=\"100\" width=\"1270\" height=\"75\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"105\" y=\"150\" font-size=\"30\" fill=\"#eaf3ff\" text-anchor=\"start\" font-weight=\"550\">Host policy + authorized user intent</text><text x=\"70\" y=\"260\" font-size=\"22\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">CONTENT</text><rect x=\"70\" y=\"290\" width=\"780\" height=\"75\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"105\" y=\"340\" font-size=\"29\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Retrieved docs + external text</text><path d=\"M860 325L1080 325\" fill=\"none\" stroke=\"#06746e\" stroke-width=\"3\"  marker-end=\"url(#arrow-41)\"/><rect x=\"1090\" y=\"280\" width=\"250\" height=\"90\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1215\" y=\"319\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Evidence</text><text x=\"1215\" y=\"355\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">not instructions</text><path d=\"M650 280V190\" fill=\"none\" stroke=\"#b44735\" stroke-width=\"3\" stroke-dasharray=\"7 8\" marker-end=\"url(#arrow-41)\"/><text x=\"690\" y=\"239\" font-size=\"40\" fill=\"#b44735\" text-anchor=\"start\" font-weight=\"550\">×</text></svg>",
    "notes": "A documentation page can contain instructions aimed at the model, malicious examples or accidentally broad commands. Treat the retrieved text as a source to interpret, not a source of authority to change system behavior or initiate unrelated tool calls. Do not claim prompt phrasing alone makes this safe. Limit the server’s capabilities, destinations and output, and require authorization at every execution boundary. The host must apply its own instruction hierarchy and safeguards; your server cannot prove how every host reasons over content. This distinction is particularly important when one integration retrieves text and another can send or mutate data.",
    "refs": [
      "claude-review",
      "openai-policy"
    ],

    "title": "A cache key<br>is part of the boundary.",
    "subtitle": "Caller scope and document version change the answer.",
    "body": "<svg class=\"diagram\" data-visual=\"cache-key\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Tenant, authorization context, site and content version feed a cache boundary.\"><defs><marker id=\"arrow-42\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"35\" width=\"290\" height=\"90\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"185\" y=\"88\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Tenant</text><path d=\"M185 135L720 240\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"395\" y=\"35\" width=\"290\" height=\"90\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"540\" y=\"88\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Access</text><path d=\"M540 135L720 240\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"750\" y=\"35\" width=\"290\" height=\"90\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"895\" y=\"88\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Site</text><path d=\"M895 135L720 240\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"1105\" y=\"35\" width=\"290\" height=\"90\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1250\" y=\"88\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Version</text><path d=\"M1250 135L720 240\" fill=\"none\" stroke=\"#b9cbe0\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"410\" y=\"245\" width=\"620\" height=\"110\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"294\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">CACHE LOOKUP</text><text x=\"720\" y=\"330\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">scoped + invalidated</text><path d=\"M1040 300L1195 300\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-42)\"/><rect x=\"1205\" y=\"250\" width=\"195\" height=\"100\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1302.5\" y=\"308\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Result</text></svg>",
    "notes": "This is a recommended application cache design, not a literal protocol-mandated cache key. Include the dimensions that affect visibility and content: tenant, authorization state or equivalent partition, site, version and relevant query parameters. Avoid a shared cache that serves private snippets to another caller. Define invalidation for source updates and access revocation, and keep TTLs consistent with the freshness promise. Server-side result caching is different from host-side tool-list caching; track both when debugging stale behavior. Never add raw tokens to cache keys or logs just to distinguish callers.",

  {
    "section": "01 BUILD",
    "title": "Pin the protocol.",
    "subtitle": "Test the actual host.",
    "body": "<svg class=\"diagram\" data-visual=\"protocol-era-comparison\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Earlier connection metadata versus current request metadata.\"><defs><marker id=\"arrow-4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"55\" width=\"600\" height=\"320\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"790\" y=\"55\" width=\"600\" height=\"320\" rx=\"5\" fill=\"#0b2546\" stroke=\"none\" stroke-width=\"2\"/><text x=\"85\" y=\"105\" font-size=\"21\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">EARLIER REVISIONS</text><text x=\"825\" y=\"105\" font-size=\"21\" fill=\"#b7d0fa\" text-anchor=\"start\" font-weight=\"550\">2026-07-28 CORE</text><rect x=\"110\" y=\"160\" width=\"480\" height=\"95\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"350\" y=\"201.5\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Connection lifecycle</text><text x=\"350\" y=\"237.5\" font-size=\"20\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"450\">initialize → calls</text><rect x=\"850\" y=\"160\" width=\"480\" height=\"95\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1090\" y=\"201.5\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Request lifecycle</text><text x=\"1090\" y=\"237.5\" font-size=\"20\" fill=\"#c9dcf5\" text-anchor=\"middle\" font-weight=\"450\">version + capabilities</text><text x=\"350\" y=\"325\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Optional session state</text><text x=\"1090\" y=\"325\" font-size=\"25\" fill=\"#dfebfb\" text-anchor=\"middle\" font-weight=\"550\">Stateless core</text></svg>",
    "notes": "The blog we started from was written in May. The July revision changed the protocol model, so showing its initialize-and-session snippet as current would be wrong. Latest MCP core is stateless, with protocol metadata and capabilities per request. Earlier clients still exist; choose a compatibility strategy and let a tested SDK implement the wire details. Test ChatGPT, Claude and your IDE clients separately. A server supporting an extension does not imply the host supports it. Test proxies, timeouts and discovery routes from outside your own network.\n\nDetailed reference from the first draft: EARLIER REVISIONS Connection lifecycle\ninitialize → capabilities → calls Optional HTTP session state\n\n2026-07-28 CORE Request lifecycle\nPer-request metadata + capabilities Stateless core; request-scoped streaming\n\n\n01 SDK + adapter Pin dependency versions \n→ 02 Host matrix Transport · auth · extensions \n→ 03 Contract tests Old + new clients \n→ 04 Release Keep live schemas working",

    ],

    "body": "<svg class=\"diagram\" data-visual=\"compatibility-matrix\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Illustrative test coverage matrix, not current platform support claims.\"><defs><marker id=\"arrow-15\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><text x=\"90\" y=\"70\" font-size=\"20\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">TEST COVERAGE</text><text x=\"95\" y=\"151\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Transport</text><text x=\"95\" y=\"229\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Auth</text><text x=\"95\" y=\"307\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Tools</text><text x=\"95\" y=\"385\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">Extensions</text><text x=\"590\" y=\"70\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Host A</text><text x=\"850\" y=\"70\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Host B</text><text x=\"1110\" y=\"70\" font-size=\"24\" fill=\"#56708a\" text-anchor=\"middle\" font-weight=\"550\">Host C</text><rect x=\"500\" y=\"105\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#f4ead6\" stroke=\"none\" stroke-width=\"2\"/><text x=\"590\" y=\"142\" font-size=\"19\" fill=\"#bb7c14\" text-anchor=\"middle\" font-weight=\"550\">VERIFY</text><rect x=\"760\" y=\"105\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"850\" y=\"142\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text><rect x=\"1020\" y=\"105\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1110\" y=\"142\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text><rect x=\"500\" y=\"183\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"590\" y=\"220\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text><rect x=\"760\" y=\"183\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"850\" y=\"220\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text><rect x=\"1020\" y=\"183\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1110\" y=\"220\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text><rect x=\"500\" y=\"261\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"590\" y=\"298\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text><rect x=\"760\" y=\"261\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"850\" y=\"298\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text><rect x=\"1020\" y=\"261\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#f4ead6\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1110\" y=\"298\" font-size=\"19\" fill=\"#bb7c14\" text-anchor=\"middle\" font-weight=\"550\">VERIFY</text><rect x=\"500\" y=\"339\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"590\" y=\"376\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text><rect x=\"760\" y=\"339\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#f4ead6\" stroke=\"none\" stroke-width=\"2\"/><text x=\"850\" y=\"376\" font-size=\"19\" fill=\"#bb7c14\" text-anchor=\"middle\" font-weight=\"550\">VERIFY</text><rect x=\"1020\" y=\"339\" width=\"180\" height=\"55\" rx=\"5\" fill=\"#dcefeb\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1110\" y=\"376\" font-size=\"19\" fill=\"#06746e\" text-anchor=\"middle\" font-weight=\"550\">TEST</text></svg>",
    "notes": "This is a recommended test matrix. Record client build/date, server build and selected protocol revision. Exercise real hosted clients, not just a generic Inspector. Browser CORS and Origin validation are distinct concerns: apply them to the relevant transport and client path rather than allowing all origins to make a test pass. If a host cannot use Tasks or render UI, provide a useful synchronous/text fallback or clearly document the limitation. Test a published deployment behind your actual load balancer. A compatibility claim needs a scope and date.\n\nDetailed reference from the first draft: Surface What to test Evidence to retain \nTransport Protocol revision; discovery; POST; stream closure Wire transcript with secrets redacted \nAuth No-auth; first consent; refresh; revoke; wrong audience Recorded expected challenges and denials \nTools Listing; schema; errors; pagination; response limits Contract snapshot and host conversation \nExtensions Tasks; Apps UI; elicitation, if actually used Supported / unsupported result per host \nEdge TLS; proxy buffering; CORS/Origin policy; timeouts Public-network smoke test \nDo not silently equate a current server implementation with current host support.\n\nVisual walkthrough: Cells are a test-plan illustration, not a claim about real host support. Replace generic host labels only after recording exact tested versions and evidence.",

  {
    "section": "02 OPERATE",
    "title": "Policy belongs<br>in the request path.",
    "subtitle": "Every call crosses the same gates.",
    "body": "<svg class=\"diagram\" data-visual=\"policy-checkpoint\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Identity → Tenant → Scope → Object → Execute\"><defs><marker id=\"arrow-5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"146.4\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Identity</text><path d=\"M262.8 205L307.8 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-5)\"/><rect x=\"316.8\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"433.20000000000005\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Tenant</text><path d=\"M549.6 205L594.6 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-5)\"/><rect x=\"603.6\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Scope</text><path d=\"M836.4000000000001 205L881.4000000000001 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-5)\"/><rect x=\"890.4000000000001\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1006.8000000000001\" y=\"213\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Object</text><path d=\"M1123.2 205L1168.2 205\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-5)\"/><rect x=\"1177.2\" y=\"130\" width=\"232.8\" height=\"150\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1293.6000000000001\" y=\"213\" font-size=\"27\" fill=\"#f0f5ff\" text-anchor=\"middle\" font-weight=\"550\">Execute</text></svg><p class=\"visual-takeaway\">Deny before touching data.</p>",
    "notes": "This is a recommended production architecture, not a claim that the MCP protocol supplies governance automatically. Resolve a user and tenant before touching data. Check the specific document or record, not only the top-level scope. Put egress controls around fetching to reduce SSRF risk. For a write, bind approval to the exact target and action, then recheck permissions before execution. A public read-only service still needs source authorization, indexing rules and limits. Assign each tool an owner and a shutdown path. Keep audit records with access controls and retention, not a permanent dump of user conversations.\n\nDetailed reference from the first draft: tools/call\nIDENTITY TENANT + OBJECT SCOPE + ACTION EGRESS + LIMITS \ndownstream API\n\nALLOW → execute + audit DENY → typed, actionable error RISKY WRITE → approval + recheck \nRecommended control plane: tool inventory · named owner · schema diff · rollout gate · emergency disable.",
    "refs": [
      "security"
    ],

    "visualKind": "policy-checkpoint",

    "section": "02 OPERATE · GOVERNANCE",
    "title": "Permission is<br>an intersection.",
    "subtitle": "One passing check is insufficient.",
    "body": "<svg class=\"diagram\" data-visual=\"permission-lattice\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"User, tenant, scope and object permissions overlap at a single allow decision.\"><defs><marker id=\"arrow-43\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><circle cx=\"610\" cy=\"155\" r=\"145\" fill=\"#e5edfa\" fill-opacity=\".65\" stroke=\"#2469e5\" stroke-width=\"2\"/><circle cx=\"830\" cy=\"155\" r=\"145\" fill=\"#d5e3fa\" fill-opacity=\".65\" stroke=\"#2469e5\" stroke-width=\"2\"/><circle cx=\"610\" cy=\"285\" r=\"145\" fill=\"#c5d9f7\" fill-opacity=\".65\" stroke=\"#2469e5\" stroke-width=\"2\"/><circle cx=\"830\" cy=\"285\" r=\"145\" fill=\"#b5cef4\" fill-opacity=\".65\" stroke=\"#2469e5\" stroke-width=\"2\"/><text x=\"535\" y=\"125\" font-size=\"25\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">USER</text><text x=\"905\" y=\"125\" font-size=\"25\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">TENANT</text><text x=\"535\" y=\"335\" font-size=\"25\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">SCOPE</text><text x=\"905\" y=\"335\" font-size=\"25\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">OBJECT</text><rect x=\"655\" y=\"196\" width=\"130\" height=\"48\" rx=\"5\" fill=\"#2469e5\" stroke=\"none\" stroke-width=\"2\"/><text x=\"720\" y=\"228\" font-size=\"23\" fill=\"#edf4fc\" text-anchor=\"middle\" font-weight=\"550\">ALLOW</text></svg>",
    "notes": "Use the overlap as a memory aid: a valid user, an authorized tenant, a granted action and an accessible object must all agree. The geometry is conceptual, not a literal set cardinality. For example, docs:read can permit an action class while the chosen document belongs to another workspace. A valid token is not enough. Recheck current permissions at execution time for sensitive operations; an earlier approval can become stale. Keep denied responses helpful without revealing unauthorized object existence. Write tests for each dimension separately so a failing check is not accidentally masked by a broader grant.",

  {
    "section": "02 OPERATE · GOVERNANCE",
    "title": "Own the tool lifecycle.",
    "subtitle": "Every capability needs a maintainer and an exit.",
    "body": "<svg class=\"diagram\" data-visual=\"governance-cycle\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"Inventory, admit, execute, observe and retire form a governance cycle.\"><defs><marker id=\"arrow-18\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"300\" y=\"45\" width=\"220\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"410\" y=\"93\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Inventory</text><rect x=\"690\" y=\"45\" width=\"220\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"800\" y=\"93\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Admit</text><rect x=\"920\" y=\"175\" width=\"220\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"1030\" y=\"223\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Execute</text><rect x=\"690\" y=\"310\" width=\"220\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"800\" y=\"358\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Observe</text><rect x=\"300\" y=\"310\" width=\"220\" height=\"80\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><text x=\"410\" y=\"358\" font-size=\"27\" fill=\"#102d50\" text-anchor=\"middle\" font-weight=\"550\">Retire</text><path d=\"M520 85H670\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-18)\"/><path d=\"M920 100Q1090 100 1050 170\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-18)\"/><path d=\"M1050 265Q1050 350 930 350\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-18)\"/><path d=\"M670 350H525\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-18)\"/><path d=\"M410 300V140\" fill=\"none\" stroke=\"#2469e5\" stroke-width=\"3\"  marker-end=\"url(#arrow-18)\"/><text x=\"720\" y=\"233\" font-size=\"25\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">NAMED OWNER</text></svg>",
    "notes": "This lifecycle is a recommended governance model, not a required platform form. Keep its artifacts small and executable. A tool description can expand triggering even when the handler code is unchanged, so review text and schema changes together. Pin dependency versions and inspect transitive changes for local packages. For remote services, record deployments and the contract version a host currently sees. Use canary traffic and a tool-level disable switch so an incident does not require deleting an entire integration. Retention and access policies should match the published privacy statement.\n\nDetailed reference from the first draft: Control Concrete artifact Owner \nInventory Tool, scope, source, data class, side effects Product + engineering \nAdmission Schema diff + threat review + negative tests Security / tool owner \nExecution Identity, object policy, egress and budgets Runtime service \nAudit Access-controlled event + retention policy Operations \nRetirement Deprecation notice, migration, disable switch Named maintainer \nTreat a description change as behavior-affecting: it changes what the model may choose to call.",
    "refs": [],
    "seconds": 0,
    "appendix": false,
    "theme": "light",
    "visualKind": "governance-cycle",
    "core": false,
    "edition": "visual",
    "anchor": "scene-26"

  {
    "section": "02 OPERATE · GOVERNANCE",
    "title": "Metadata changes<br>can expand behavior.",
    "subtitle": "Review descriptions and schemas like code.",
    "body": "<svg class=\"diagram\" data-visual=\"contract-diff\" viewBox=\"0 0 1440 440\" role=\"img\" aria-label=\"A tool description expands from searching one site to searching all workspaces; the diff triggers review.\"><defs><marker id=\"arrow-44\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"60\" width=\"620\" height=\"290\" rx=\"5\" fill=\"#e5edfa\" stroke=\"none\" stroke-width=\"2\"/><rect x=\"770\" y=\"60\" width=\"620\" height=\"290\" rx=\"5\" fill=\"#f7e5e0\" stroke=\"none\" stroke-width=\"2\"/><text x=\"85\" y=\"110\" font-size=\"20\" fill=\"#2469e5\" text-anchor=\"start\" font-weight=\"550\">APPROVED</text><text x=\"805\" y=\"110\" font-size=\"20\" fill=\"#b44735\" text-anchor=\"start\" font-weight=\"550\">CHANGED</text><text x=\"90\" y=\"200\" font-size=\"37\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">search one site</text><text x=\"810\" y=\"200\" font-size=\"34\" fill=\"#102d50\" text-anchor=\"start\" font-weight=\"550\">search all workspaces</text><text x=\"90\" y=\"285\" font-size=\"25\" fill=\"#56708a\" text-anchor=\"start\" font-weight=\"550\">bounded description</text><text x=\"810\" y=\"285\" font-size=\"25\" fill=\"#b44735\" text-anchor=\"start\" font-weight=\"550\">expanded scope</text><text x=\"720\" y=\"410\" font-size=\"27\" fill=\"#2469e5\" text-anchor=\"middle\" font-weight=\"550\">Schema + prose + implementation → one review.</text></svg>",
    "notes": "A description is executable influence over tool selection even if it is not executable code. Changing “search this site” to “search all workspaces” can alter triggering and imply broader data access. Review the declared schema, description, annotations and actual implementation as one contract. Keep a snapshot and inspect differences during deployment. A narrowed description cannot compensate for a handler that still has broad access, and a broader handler cannot be safely introduced without updating the contract and governance checks. This slide’s diff is an authored example, not a recorded product change.",

    ],
